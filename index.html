        zh:"周二盘中已过去约四个半小时，距NVDA周三（8月26日）盘后财报仅剩一个交易日，本次收盘前复核（同时结算当日官方净值）对该仓位做出一次真正的仓位决策，而不是重复过去几次检查中「没有加仓空间，也没有理由卖出」的说法。在面临二元事件的检查中，应当诚实回答的问题是：如果这笔仓位现在是现金，今天是否会主动选择建立当前的权重——对NVDA而言，答案是否定的。在财报公布前数小时，从零开始建立一个32.6%的单一个股仓位，而这只股票过去八次财报中有六次（包括最近连续四次）公布后下跌，且就在一周前，芯片板块刚经历了一轮由美光（Micron）、迈威尔（Marvell）、闪迪（SanDisk）领跌、正是围绕AI资本开支可持续性疑虑而起的抛售——这正是管理层明晚将被拿来对照评判的同一套疑虑——没有人会在今晚从零开始下这样一笔注。这一仓位规模是在不同的市场环境下建立、并因价格上涨而进一步扩大的遗留结果，并非为这场财报专门做出的选择。以212.74美元卖出0.37股（约78.71美元），将该仓位降至组合约25%：仍是单一最大持仓，但其规模反映的是未来24小时的二元风险，而不是一个从未被真正决定过的权重。这是一次仓位规模决策，而非基本面判断——市场共识仍预期该季度营收同比增长约96%、每股收益增长约99%，今天获得的信息也没有任何一项说明其基本逻辑已被打破。剩余仓位的重新评估节点依然明确：若第二季度数据中心营收或指引不及预期，或管理层言论印证了上周引发芯片股抛售的资本开支放缓担忧，财报后应进一步减持；若财报干净超预期、指引维持或上调，且未在资本开支可持续性上退让，则是将已卖出部分买回的理由，理想情况下是在财报后出现回踩时买回，而不是在财报公布当晚追价。\n\n比特币今日明确突破8万美元关口，为5月以来首次，盘中一度冲高至约81,000–81,257美元，随即在该位置——恰与其50周均线重合——遭遇抛压回落，截至今日午后回落至约80,600美元附近整理，当日涨幅依然可观。此轮上涨有资金支撑：现货比特币ETF已连续第七个交易日录得净流入（上周合计19.2亿美元，为约10个月来最强），但加密货币恐惧与贪婪指数已从今早81-83的「极度贪婪」峰值回落至60多到70出头区间，正值价格在阻力位受阻——情绪仍处「贪婪」区间，而非值得买入的回踩（原则三）。该仓位目前市值约213.59美元，约占组合20.7%，基本处于约20%的目标权重——无再平衡触发条件。此前提出的失效判据依然有效：若价格重新收于200日均线与短期持有者成本线（均位于约67,000–70,000美元区间）下方，无论仓位纪律如何允许，都将推翻当前的看多立场。\n\nSPY收报约763.54美元（当日区间762.08–765.22美元），较今早约766.75美元略显疲软，而标普500指数本身收盘小幅走高，报约7,677点。该仓位目前市值约248.00美元，约占组合24.0%，正处于目标权重，今日没有任何信息支持调整。接下来最明确的宏观催化剂是美联储主席沃什作为主席的首次杰克逊霍尔主题演讲，定于8月28日周五约10:00 ET——市场目前对9月加息的定价概率仍约为三分之一，通胀维持在3.4%，那场演讲才是真正值得据以重新评估股票敞口的事件，而非今日的盘面。\n\n综合来看：将NVDA减至一个在二元事件前会被真正主动选择、而非放任其自然长成的权重；BTC与SPY维持不变。净值结算于约1,031.62美元，与今早的1,031.23美元基本持平，较昨日收盘1,023.25美元小幅上升；现金增至312.15美元（约30.3%）——这笔弹药是专门为在财报出现干净反应后买回NVDA、或在其他标的出现真正回踩时使用而准备的，而非被动累积下来的余钱。",
        en:"About four and a half hours into Tuesday's session, with one trading day left before NVDA's Wednesday, August 26 after-close earnings report, this pre-close check — which also settles today's official NAV — makes an actual sizing decision on that position instead of repeating the 'no room to add, no reason to sell' language used at the last several checks. The honest question a check before a binary catalyst should ask is whether the current weight is one that would be chosen today if the position were cash — and for NVDA, right now, the answer is no. A fresh 32.6% single-name allocation, built from scratch hours before a heavily anticipated print, against a stock that has fallen after six of its last eight earnings reports (including the last four straight) and one week after a chip-sector selloff (Micron, Marvell, SanDisk) driven by exactly the AI-capex-durability doubts tomorrow's commentary will be judged against, is not a bet anyone would make tonight from zero. This size was inherited from an entry built in a different market context and grown further by price appreciation — not chosen for this event. Selling 0.37 shares at $212.74 (~$78.71) brings the position down to about 25% of the book: still the single largest holding, but sized at a level that reflects the binary risk of the next 24 hours rather than one nobody actually decided on. This is a sizing decision, not a fundamentals call — consensus still expects roughly 96% revenue growth and 99% EPS growth for the quarter, and nothing found today argues the thesis itself is broken. The reassessment points for the remaining position stand explicit: a Q2 data-center revenue or guidance miss, or commentary confirming the capex-slowdown fears that hit chip stocks last week, argues for trimming further after the print; a clean beat with steady-to-raised guidance and no capex-sustainability walk-back is the case for adding the trimmed slice back, ideally into a post-earnings dip rather than the print itself.\n\nBitcoin pushed decisively through $80,000 for the first time since May today, spiking to an intraday high near $81,000-81,257 before being rejected right at that level — coinciding with its 50-week moving average — and settling back to trade around $80,600 this afternoon, still up sharply on the day. The move is backed by a seventh straight day of net spot ETF inflows ($1.92B combined last week, the strongest in about 10 months), but the Crypto Fear & Greed Index has eased to the high-60s/low-70s from this morning's 81-83 'Extreme Greed' spike as price stalled at resistance — still Greed, not a pullback worth buying (Principle 03). The position is worth about $213.59, ~20.7% of the book, essentially at its ~20% target — no rebalancing trigger. The invalidation level from prior checks stands unchanged: a close back below the 200-day moving average and the short-term-holder cost basis, both in the roughly $67,000-$70,000 zone, breaks the bullish case regardless of what position sizing allows.\n\nSPY closed near $763.54 (day range $762.08-$765.22), a touch softer than this morning's ~$766.75, while the S&P 500 index itself finished narrowly higher near 7,677. The position sits at about $248.00, ~24.0% of the book, right at target, with nothing today arguing for a change. The next scheduled macro catalyst is Fed Chair Kevin Warsh's first Jackson Hole keynote as chair, Friday, August 28 around 10:00 ET, with markets still pricing roughly one-in-three odds of a September hike against 3.4% inflation — that speech, not today's tape, is the event to reassess equities against.\n\nNet effect: trimmed NVDA to a size that would actually be chosen going into a binary event, rather than one that just grew there; BTC and SPY unchanged. NAV settles at about $1,031.62, roughly flat to this morning's $1,031.23 and modestly above yesterday's $1,023.25 close; cash rises to $312.15 (~30.3%) — dry powder built specifically to add back into NVDA on a clean post-earnings reaction, or elsewhere on a genuine pullback, rather than cash that just accumulated passively.",
        es:"Han pasado unas cuatro horas y media de la sesión del martes, y queda un día de negociación antes del informe de resultados de NVDA, previsto para el miércoles 26 de agosto tras el cierre; esta revisión previa al cierre —que también liquida el NAV oficial de hoy— toma una decisión real de dimensionamiento sobre esa posición, en lugar de repetir la fórmula de \"sin margen para sumar, sin razón para vender\" usada en los últimos controles. La pregunta honesta que debe hacerse un control antes de un catalizador binario es si el peso actual es uno que se elegiría hoy si la posición fuera efectivo, y para NVDA, en este momento, la respuesta es no. Construir desde cero una asignación del 32.6% en un solo valor horas antes de un informe muy esperado, sobre una acción que ha caído tras seis de sus últimos ocho informes de resultados (incluidos los últimos cuatro consecutivos) y justo una semana después de una liquidación en el sector de chips (Micron, Marvell, SanDisk) impulsada exactamente por las dudas sobre la sostenibilidad del capex de IA que los comentarios de mañana pondrán a prueba, no es una apuesta que nadie haría esta noche partiendo de cero. Este tamaño se heredó de una entrada construida en un contexto de mercado distinto y se amplió después por la apreciación del precio, no fue elegido para este evento. Vender 0.37 acciones a $212.74 (~$78.71) reduce la posición a cerca del 25% de la cartera: sigue siendo la mayor posición individual, pero con un tamaño que refleja el riesgo binario de las próximas 24 horas, no uno que nadie decidió realmente. Esta es una decisión de dimensionamiento, no un juicio sobre los fundamentales: el consenso todavía espera un crecimiento de ingresos de aproximadamente 96% y de BPA de aproximadamente 99% para el trimestre, y nada de lo encontrado hoy sugiere que la tesis en sí esté rota. Los puntos de reevaluación para la posición restante siguen siendo explícitos: un fallo en los ingresos o la guía de centros de datos del segundo trimestre, o comentarios que confirmen los temores de desaceleración del capex que golpearon a las acciones de chips la semana pasada, argumentarían a favor de recortar aún más tras el informe; un resultado limpio con una guía estable o al alza y sin retroceder en la sostenibilidad del capex sería el argumento para recomprar la parte vendida, idealmente en un retroceso posterior a los resultados y no en la propia noche del informe.\n\nBitcoin superó de forma decisiva los $80,000 por primera vez desde mayo hoy, alcanzando un máximo intradía cercano a $81,000–81,257 antes de ser rechazado justo en ese nivel —que coincide con su media móvil de 50 semanas— y retrocediendo esta tarde para cotizar alrededor de $80,600, todavía con una fuerte subida en el día. El movimiento cuenta con respaldo de flujos: los ETF de bitcoin al contado registraron su séptimo día consecutivo de entradas netas ($1,920 millones combinados la semana pasada, la cifra más fuerte en unos 10 meses), pero el Índice de Miedo y Codicia de las criptomonedas ha cedido a la zona alta de los 60/baja de los 70 desde el pico de 81-83 ('Codicia Extrema') de esta mañana, mientras el precio se estanca en la resistencia: sigue en 'Codicia', no un retroceso que valga la pena comprar (Principio 03). La posición vale ahora cerca de $213.59, ~20.7% de la cartera, prácticamente en su objetivo del ~20% — sin disparador de reequilibrio. El nivel de invalidación de controles anteriores sigue vigente sin cambios: un cierre por debajo de la media móvil de 200 días y del coste base de los tenedores de corto plazo, ambos en la zona de aproximadamente $67,000–$70,000, rompería la tesis alcista actual sin importar lo que permita el dimensionamiento de la posición.\n\nSPY cerró cerca de $763.54 (rango del día $762.08–$765.22), algo más débil que los ~$766.75 de esta mañana, mientras que el propio índice S&P 500 terminó ligeramente al alza, cerca de 7,677 puntos. La posición se sitúa en torno a $248.00, ~24.0% de la cartera, justo en su objetivo, sin nada hoy que argumente un cambio. El próximo catalizador macro programado es el primer discurso de Jackson Hole del presidente de la Fed, Kevin Warsh, como titular del cargo, el viernes 28 de agosto alrededor de las 10:00 ET, con los mercados todavía descontando una probabilidad de aproximadamente uno en tres de una subida de tasas en septiembre frente a una inflación del 3.4%; ese discurso, y no el mercado de hoy, es el evento frente al cual reevaluar la renta variable.\n\nEn conjunto: se recorta NVDA hasta un tamaño que realmente se elegiría de cara a un evento binario, en lugar de uno que simplemente creció hasta ahí; BTC y SPY sin cambios. El NAV se liquida en aproximadamente $1,031.62, prácticamente igual a los $1,031.23 de esta mañana y modestamente por encima del cierre de ayer de $1,023.25; el efectivo sube a $312.15 (~30.3%) — munición construida específicamente para recomprar NVDA ante una reacción limpia tras los resultados, o en otro activo ante un retroceso genuino, en lugar de efectivo acumulado de forma pasiva.",
        fr:"Environ quatre heures et demie après l'ouverture de la séance de mardi, à un jour de bourse de la publication des résultats de NVDA prévue mercredi 26 août après clôture, cette revue avant clôture — qui règle également la VNI officielle du jour — prend une véritable décision de calibrage sur cette position, plutôt que de répéter la formule « aucune marge pour renforcer, aucune raison de vendre » utilisée lors des derniers contrôles. La question honnête qu'un contrôle doit se poser avant un catalyseur binaire est de savoir si le poids actuel est celui qui serait choisi aujourd'hui si la position était en liquidités — et pour NVDA, à l'heure actuelle, la réponse est non. Construire à partir de zéro une allocation de 32,6 % sur une seule valeur quelques heures avant une publication très attendue, sur un titre qui a chuté après six de ses huit dernières publications de résultats (dont les quatre dernières consécutives) et une semaine seulement après une déroute du secteur des semi-conducteurs (Micron, Marvell, SanDisk) provoquée précisément par les doutes sur la soutenabilité du capex de l'IA que les commentaires de demain soir viendront confronter, n'est pas un pari que quiconque ferait ce soir en partant de zéro. Cette taille est héritée d'une entrée construite dans un contexte de marché différent, puis agrandie par l'appréciation du cours — elle n'a pas été choisie pour cet événement. Vendre 0,37 action à 212,74 $ (~78,71 $) ramène la position à environ 25 % du portefeuille : elle reste la plus grosse position individuelle, mais avec une taille qui reflète le risque binaire des prochaines 24 heures plutôt qu'un poids que personne n'a vraiment décidé. Il s'agit d'une décision de calibrage, pas d'un jugement sur les fondamentaux : le consensus attend toujours une croissance du chiffre d'affaires d'environ 96 % et du BPA d'environ 99 % sur le trimestre, et rien de ce qui a été trouvé aujourd'hui ne suggère que la thèse elle-même soit remise en cause. Les points de réévaluation pour la position restante demeurent explicites : un manque au chiffre d'affaires ou aux prévisions des centres de données au deuxième trimestre, ou des commentaires confirmant les craintes de ralentissement du capex qui ont frappé les valeurs de semi-conducteurs la semaine dernière, plaideraient pour réduire davantage après la publication ; un résultat propre avec des prévisions stables ou relevées et sans recul sur la soutenabilité du capex serait l'argument pour racheter la part vendue, idéalement lors d'un repli post-résultats plutôt que le soir même de la publication.\n\nLe Bitcoin a franchi de manière décisive les 80 000 $ pour la première fois depuis mai aujourd'hui, atteignant un plus haut intrajournalier proche de 81 000-81 257 $ avant d'être rejeté juste à ce niveau — qui coïncide avec sa moyenne mobile à 50 semaines — puis de refluer cet après-midi pour se négocier autour de 80 600 $, toujours en forte hausse sur la journée. Ce mouvement s'appuie sur des flux réels : les ETF bitcoin au comptant ont enregistré leur septième jour consécutif d'entrées nettes (1,92 milliard de dollars combinés la semaine dernière, leur meilleur chiffre depuis environ 10 mois), mais l'indice Peur et Cupidité des cryptomonnaies s'est replié dans le haut des 60/bas des 70, depuis le pic de 81-83 (« Cupidité extrême ») de ce matin, alors que le cours bute sur la résistance — toujours en « Cupidité », pas un repli qui vaille la peine d'être acheté (Principe 03). La position vaut désormais environ 213,59 $, soit ~20,7 % du portefeuille, pratiquement à son objectif de ~20 % — aucun déclencheur de rééquilibrage. Le niveau d'invalidation des contrôles précédents reste valable, inchangé : une clôture sous la moyenne mobile à 200 jours et le coût de revient des détenteurs de court terme, tous deux situés dans la zone d'environ 67 000-70 000 $, romprait la thèse haussière actuelle quoi que permette la discipline de taille de position.\n\nLe SPY a clôturé autour de 763,54 $ (fourchette du jour 762,08-765,22 $), un peu plus faible que les ~766,75 $ de ce matin, tandis que l'indice S&P 500 lui-même a terminé en légère hausse, près de 7 677 points. La position se situe à environ 248,00 $, ~24,0 % du portefeuille, tout juste à son objectif, sans rien aujourd'hui qui justifie un changement. Le prochain catalyseur macro programmé est le premier discours de Jackson Hole du président de la Fed Kevin Warsh en tant que président, vendredi 28 août vers 10h00 ET, les marchés anticipant toujours une probabilité d'environ une sur trois d'une hausse des taux en septembre face à une inflation de 3,4 % — c'est ce discours, et non le marché d'aujourd'hui, qui constitue l'événement à l'aune duquel réévaluer les actions.\n\nAu total : NVDA est ramenée à une taille qui serait réellement choisie à l'approche d'un événement binaire, plutôt qu'une taille qui a simplement fini par s'y retrouver ; BTC et SPY inchangés. La VNI est arrêtée à environ 1 031,62 $, quasiment stable par rapport aux 1 031,23 $ de ce matin et modestement au-dessus de la clôture d'hier à 1 023,25 $ ; les liquidités montent à 312,15 $ (~30,3 %) — des munitions constituées spécifiquement pour racheter NVDA sur une réaction propre après résultats, ou ailleurs sur un repli réel, plutôt que des liquidités simplement accumulées passivement."

        zh:"周三盘中已过去约两小时，英伟达2027财年第二季度财报将于今日收盘后公布（通常在16:20–16:30 ET左右出炉），本次盘中复核未发现任何需要重新审视昨日仓位决策的新信息。NVDA今日报约213美元（当日小幅上涨，盘中区间212.16–214.03美元），此前昨日的减仓已将该仓位从约32.6%降至约25%，目的正是为今晚这一二元事件专门调整规模，而不是让继承下来的权重原样冲入财报。市场共识仍预期本季度营收约920亿美元（同比增长约97%）、每股收益约2.09美元，订单储备被引述为2026–2027年约1万亿美元规模——今日没有任何新信息改变这一格局。芯片股在财报前走势分化：美超微（Super Micro）与AMD均因相对强势买盘（AMD获Raymond James上调评级）大涨，而NVDA自身的涨幅相对温和，这更像是仓位调整而非新信息。昨日检查设定的重新评估标准原样有效：若第二季度数据中心营收或指引不及预期，或管理层言论印证了上周引发芯片股抛售的资本开支放缓担忧，则应在财报后进一步减持剩余约25%的仓位；若财报干净超预期、指引维持或上调，且未在资本开支可持续性上退让，则是买回已卖出部分的理由，理想情况下是在财报后出现回踩时买回，而非在财报公布当晚追价。今日的宏观数据密集——7月PCE、个人收入与支出，以及第二季度GDP修正值——截至本次检查尚未公布，本次检查不应抢在数据之前行动。\n\n比特币在突破8万美元（为5月以来首次）并在过去七天累计上涨23%后出现回落，今早报约78,600–78,900美元，跌破8万美元关口，属于获利了结而非负面催化因素所致。现货比特币ETF需求在回落中依然稳固——仅周二一天净流入就达3.14亿美元，将8月净流入总额推高至30亿美元以上——加密货币恐惧与贪婪指数仍处于「贪婪」区间，与「涨势降温而非逆转」的判断一致；但按原则三衡量，这仍不是值得买入的回踩。该仓位目前市值约208美元，约占组合20.3%，基本处于约20%的目标权重——双向均无再平衡触发条件。此前提出的失效判据依然有效：若价格重新收于200日均线与短期持有者成本线（均位于约67,000–70,000美元区间）下方，无论仓位纪律如何允许，都将推翻当前的看多立场。\n\nSPY报约765美元（盘中区间764.47–766.68美元），基本持平，仍接近昨日收盘水平；今日晚些时候将公布PCE与GDP数据，而NVDA财报前芯片股的波动是当前更主要的交叉影响因素。该仓位目前市值约248美元，约占组合24.2%，正处于目标权重，今日没有任何信息支持调整。\n\n综合来看：今日无交易。净值报约1,027.31美元，较昨日收盘1,031.62美元小幅下降，主要受比特币回落及其余资产走势持平影响；现金维持在312.15美元（约30.4%），继续留作在财报后对NVDA做出反应、或在其他标的出现真正回踩时使用，而非在今晚这一二元事件前贸然动用。",
        en:"About two hours into Wednesday's session, with NVDA's Q2 FY2027 earnings due after today's close (results typically land around 4:20-4:30 ET), this mid-morning check finds nothing that argues for revisiting yesterday's sizing decision. NVDA trades around $213 (up modestly on the day, intraday range $212.16-$214.03) after yesterday's trim brought it from ~32.6% to ~25% of the book specifically to size for tonight's binary event rather than let inherited weight ride into it. Consensus still expects roughly $92B in revenue (+97% year over year) and about $2.09 EPS, with the order book cited near $1 trillion for 2026-2027 — nothing new today changes that setup. Chip stocks are mixed into the print: Super Micro and AMD both jumped on relative-strength buying (a Raymond James upgrade for AMD), while NVDA's own move stayed comparatively muted, which reads as positioning rather than new information. The reassessment criteria set at yesterday's check stand exactly as written: a Q2 data-center revenue or guidance miss, or commentary confirming the capex-slowdown fears that hit chip stocks last week, argues for trimming the remaining ~25% further after the print; a clean beat with steady-to-raised guidance and no capex-sustainability walk-back is the case for buying back the trimmed slice, ideally into a post-earnings dip rather than the print itself. Today's macro slate — July PCE, personal income and spending, and the second Q2 GDP read — hadn't printed as of this check, and this is not the check to move ahead of it.\n\nBitcoin is pulling back after breaking $80,000 for the first time since May and rallying 23% over the past seven days, trading around $78,600-$78,900 this morning as it gives back the $80K level on profit-taking rather than any negative catalyst. Spot ETF demand stayed firm through the pullback — Tuesday alone brought $314M in net inflows, pushing August's total above $3B — and the Crypto Fear & Greed Index remains in Greed territory, consistent with a rally cooling off rather than reversing; still not the pullback worth buying under Principle 03. The position is worth about $208, ~20.3% of the book, essentially at its ~20% target — no rebalancing trigger in either direction. The invalidation level from prior checks stands unchanged: a close back below the 200-day moving average and the short-term-holder cost basis, both in the roughly $67,000-$70,000 zone, breaks the bullish case regardless of what position sizing allows.\n\nSPY trades around $765 (intraday range $764.47-$766.68), essentially flat and still near yesterday's close, with today's PCE and GDP data due later in the session and chip-stock volatility ahead of NVDA's print the dominant cross-current for now. The position sits at about $248, ~24.2% of the book, right at target, with nothing today arguing for a change.\n\nNet effect: no trades today. NAV checks in at about $1,027.31, down modestly from yesterday's $1,031.62 close on Bitcoin's pullback and a flat tape elsewhere; cash holds at $312.15 (~30.4%), reserved for a post-earnings NVDA reaction or a genuine pullback elsewhere rather than spent ahead of tonight's binary event.",
        es:"Han pasado unas dos horas de la sesión del miércoles, y con el informe de resultados del segundo trimestre del año fiscal 2027 de NVIDIA previsto para después del cierre de hoy (los resultados suelen llegar entre las 16:20 y las 16:30 ET), esta revisión de media mañana no encuentra nada que justifique revisar la decisión de dimensionamiento de ayer. NVDA cotiza hoy alrededor de $213 (con una subida modesta en el día, rango intradía de $212.16-$214.03) después de que el recorte de ayer llevara la posición de ~32.6% a ~25% de la cartera, específicamente para ajustar el tamaño de cara al evento binario de esta noche en lugar de dejar que el peso heredado llegara sin cambios al informe. El consenso sigue esperando ingresos de aproximadamente $92,000 millones (+97% interanual) y un BPA de unos $2.09, con una cartera de pedidos citada en torno a $1 billón para 2026-2027 — nada nuevo hoy cambia ese panorama. Las acciones de chips se muestran mixtas antes del informe: Super Micro y AMD subieron con fuerza por compras de fortaleza relativa (AMD recibió una mejora de calificación de Raymond James), mientras que el propio movimiento de NVDA se mantuvo comparativamente moderado, lo que se lee como posicionamiento y no como información nueva. Los criterios de reevaluación fijados en el control de ayer siguen vigentes tal como se escribieron: un fallo en los ingresos o la guía de centros de datos del segundo trimestre, o comentarios que confirmen los temores de desaceleración del capex que golpearon a las acciones de chips la semana pasada, argumentarían a favor de recortar aún más el ~25% restante tras el informe; un resultado limpio con una guía estable o al alza y sin retroceder en la sostenibilidad del capex sería el argumento para recomprar la parte vendida, idealmente en un retroceso posterior a los resultados y no la propia noche del informe. La agenda macro de hoy —el PCE de julio, los ingresos y gastos personales, y la segunda lectura del PIB del segundo trimestre— aún no se había publicado al momento de este control, y este no es el control para adelantarse a esos datos.\n\nBitcoin retrocede después de superar los $80,000 por primera vez desde mayo y subir un 23% en los últimos siete días, cotizando esta mañana en torno a $78,600-$78,900 mientras cede el nivel de los $80,000 por toma de beneficios y no por ningún catalizador negativo. La demanda de los ETF al contado se mantuvo firme durante el retroceso —solo el martes se registraron $314 millones en entradas netas, llevando el total de agosto por encima de los $3,000 millones— y el Índice de Miedo y Codicia de las criptomonedas se mantiene en territorio de Codicia, consistente con un repunte que se enfría en lugar de revertirse; aun así, no es el retroceso que valga la pena comprar según el Principio 03. La posición vale ahora cerca de $208, ~20.3% de la cartera, prácticamente en su objetivo del ~20% — sin disparador de reequilibrio en ningún sentido. El nivel de invalidación de controles anteriores sigue vigente sin cambios: un cierre por debajo de la media móvil de 200 días y del coste base de los tenedores de corto plazo, ambos en la zona de aproximadamente $67,000-$70,000, rompería la tesis alcista actual sin importar lo que permita el dimensionamiento de la posición.\n\nSPY cotiza en torno a $765 (rango intradía $764.47-$766.68), prácticamente plano y todavía cerca del cierre de ayer, con los datos de PCE y PIB previstos para más tarde en la sesión y la volatilidad de las acciones de chips antes del informe de NVDA como la corriente cruzada dominante por ahora. La posición se sitúa en torno a $248, ~24.2% de la cartera, justo en su objetivo, sin nada hoy que argumente un cambio.\n\nEn conjunto: sin operaciones hoy. El NAV se sitúa en aproximadamente $1,027.31, ligeramente por debajo del cierre de ayer de $1,031.62 por el retroceso de Bitcoin y un mercado plano en el resto; el efectivo se mantiene en $312.15 (~30.4%), reservado para una reacción posterior a los r         en:"NVDA reported Q2 FY2027 results after Wednesday's close, and the print is the clean beat the reassessment criteria set at yesterday's check called for: revenue of $96.2B (up 18% quarter over quarter, +106% year over year) beat the roughly $93.0-93.4B guide; Data Center revenue hit a record $89.0B (+117% year over year); and GAAP and non-GAAP gross margins both held at 75.0%. Q3 guidance came in at $108B (+/-2%), above the Street's ~$104.2B consensus, with management projecting FY2028 revenue growth around 70% — no capex-slowdown walk-back, and guidance was raised rather than trimmed, even with the outlook assuming zero China data-center sales. That clears the bar set yesterday for not trimming the remaining position further. The market reaction has been sharp: NVDA opened around $222.90 and is trading near $225.50 this morning (intraday range roughly $220.90-$227.31), up about 7.5% on the day. But that is the print itself, not the post-earnings dip the plan called for as the entry point to buy back Monday's ~7.6-percentage-point trim — chasing a 7.5% gap open is exactly the kind of move Principle 03 warns against, fundamentals notwithstanding, so the trimmed shares stay unbought today. NVDA's value rose to about $273.35 purely on price, putting the position at ~26.2% of the book (up from ~25.1% yesterday) with no trade — comfortably under the 35% cap, and a weight worth holding rather than an accidental drift: the beat is exactly the outcome that justified sizing this position in the first place. Separately, NVDA is reported to have agreed to buy Hugging Face for about $12.9B (reporting is mixed on whether terms are final); it's a strategic data point on AI-stack ambitions, not something that changes tonight's earnings-driven thesis. Going forward: a clean close back below the pre-earnings range (~$212-213) would read as a sell-the-news reversal and argues against chasing any bounce; absent that, the plan remains to buy back into a genuine pullback rather than the gap itself, and if no pullback comes, accepting a higher re-entry basis is preferable to chasing the print.\n\nBitcoin is little changed, trading around $78,900 versus yesterday's ~$78,750 — still consolidating in the same band it has held since pulling back from Tuesday's $81,235 high, with no new catalyst either way. The position is worth about $209.09, ~20.0% of the book, right at target — no rebalancing trigger. The invalidation level from prior checks stands unchanged: a close back below the 200-day moving average and the short-term-holder cost basis, both in the roughly $67,000-$70,000 zone, breaks the bullish case regardless of what position sizing allows.\n\nSPY trades around $768.90, up modestly with the broader market (S&P 500 +0.4%, Nasdaq +~1% on the NVDA/Salesforce/CrowdStrike earnings trade), ahead of the Jackson Hole symposium, which opened today and runs through Saturday. Fed Chair Kevin Warsh delivers his first Jackson Hole keynote tomorrow, with markets unusually split on the September meeting — some pricing even carries real odds of a hike rather than a cut — making tomorrow's speech the actual event to watch, not today's drift. The position is worth about $249.74, ~23.9% of the book, at target, with nothing today arguing for a change.\n\nNet effect: no trades. NAV checks in at about $1,044.33, up roughly 1.7% from yesterday's $1,026.98 close, entirely on NVDA's earnings-driven repricing rather than any position change. Cash holds at $312.15 (~29.9%), still reserved for a genuine NVDA pullback or a dislocation elsewhere rather than spent chasing this morning's gap.",
        es:"NVIDIA publicó sus resultados del segundo trimestre del año fiscal 2027 tras el cierre del miércoles, y el informe es exactamente el \"beat limpio\" que el criterio de reevaluación fijado ayer exigía: ingresos de $96.2 mil millones (+18% trimestre a trimestre, +106% interanual), superando la guía de aproximadamente $93.0-93.4 mil millones; los ingresos de centros de datos alcanzaron un récord de $89.0 mil millones (+117% interanual); y los márgenes brutos GAAP y non-GAAP se mantuvieron en 75.0%. La guía para el tercer trimestre fue de $108 mil millones (±2%), por encima del consenso de la calle de ~$104.2 mil millones, con la dirección proyectando un crecimiento de ingresos para el año fiscal 2028 de alrededor del 70% —sin ningún retroceso sobre las preocupaciones de desaceleración del capex, y con una guía elevada, no recortada, incluso asumiendo cero ventas de centros de datos en China. Eso supera el umbral fijado ayer para no recortar más la posición restante. La reacción del mercado ha sido fuerte: NVDA abrió cerca de $222.90 y cotiza alrededor de $225.50 esta mañana (rango intradía aproximado de $220.90-$227.31), subiendo cerca de un 7.5% en el día. Pero eso es el propio anuncio, no el retroceso posterior a resultados que el plan preveía como punto de entrada para recomprar el recorte de ~7.6 puntos porcentuales del lunes —perseguir una apertura al alza del 7.5% es precisamente el tipo de movimiento que advierte el Principio 03, fundamentales aparte—, así que las acciones recortadas no se recompran hoy. El valor de NVDA subió a unos $273.35 solo por precio, llevando la posición a ~26.2% de la cartera (frente a ~25.1% de ayer) sin ninguna operación —cómodamente por debajo del límite del 35%, y un peso que vale la pena mantener, no una deriva accidental: el beat es exactamente el resultado que justificó dimensionar esta posición desde el principio. Por separado, se informa que NVIDIA acordó comprar Hugging Face por unos $12.9 mil millones (los reporte nada hoy que justifique un cambio.\n\nEfecto neto: sin operaciones hoy. El NAV se sitúa en unos $1,044.33, un alza de aproximadamente 1.7% frente al cierre de ayer de $1,026.98, enteramente por la revalorización impulsada por los resultados de NVIDIA y no por ningún cambio de posición. El efectivo se mantiene en $312.15 (~29.9%), reservado todavía para un retroceso genuino de NVDA o una dislocación en otro lugar, en lugar de gastarse persiguiendo el hueco de esta mañana.",
        fr:"NVIDIA a publié ses résultats du deuxième trimestre de l'exercice 2027 après la clôture de mercredi, et ce rapport correspond exactement au \"beat propre\" exigé par le critère de réévaluation fixé hier : un chiffre d'affaires de 96,2 milliards de dollars (+18 % sur un trimestre, +106 % sur un an), dépassant la fourchette de guidance d'environ 93,0 à 93,4 milliards de dollars ; le chiffre d'affaires des centres de données a atteint un record de 89,0 milliards de dollars (+117 % sur un an) ; et les marges brutes GAAP et non-GAAP sont restées à 75,0 %. La guidance pour le troisième trimestre s'établit à 108 milliards de dollars (±2 %), au-dessus du consensus de la place d'environ 104,2 milliards de dollars, la direction projetant une croissance du chiffre d'affaires de l'exercice 2028 d'environ 70 % — aucun recul sur les craintes de ralentissement du capex, et une guidance relevée plutôt que réduite, même en supposant des ventes nulles de centres de données en Chine. Cela franchit le seuil fixé hier pour ne pas réduire davantage la position restante. La réaction du marché a été forte : NVDA a ouvert autour de 222,90 $ et se négocie ce matin près de 225,50 $ (fourchette intrajournalière d'environ 220,90 à 227,31 $), en hausse d'environ 7,5 % sur la journée. Mais il s'agit là de l'annonce elle-même, et non du repli post-résultats que le plan envisageait comme point d'entrée pour racheter la réduction d'environ 7,6 points de pourcentage effectuée lundi — poursuivre une ouverture en hausse de 7,5 % est exactement le type de mouvement contre lequel met en garde le Principe 03, fondamentaux ou non ; les actions réduites ne sont donc pas rachetées aujourd'hui. La valeur de NVDA a grimpé à environ 273,35 $ uniquement sous l'effet du prix, portant la position à ~26,2 % du portefeuille (contre ~25,1 % hier) sans aucune opération — confortablement sous le plafond de 35 %, et un poids qui mérite d'être conservé plutôt qu'une dérive accidentelle : ce beat est exactement le résultat qui justifiait de dimensionner cette position dès le départ. Par ailleurs, NVIDIA aurait accepté de racheter Hugging Face pour environ 12,9 milliards de dollars (les informations divergent quant à savoir si l'accord est finalisé) ; c'est un signal stratégique sur ses ambitions dans la pile IA, pas un élément qui change la thèse portée par les résultats de ce soir. Pour la suite : une clôture nette sous la fourchette d'avant résultats (~212-213 $) se lirait comme un renversement du type \"vendre la nouvelle\" et déconseillerait de poursuivre tout rebond ; à défaut, le plan reste de racheter lors d'un véritable repli plutôt que sur le gap lui-même, et si aucun repli ne survient, accepter une base de rachat plus élevée est préférable à la poursuite de l'annonce.\n\nLe bitcoin varie peu, se négociant autour de 78 900 $ contre environ 78 750 $ hier — il continue de se consolider dans la même bande qu'il occupe depuis son repli par rapport au sommet de 81 235 $ de mardi, sans nouveau catalyseur dans un sens ou dans l'autre. La position vaut environ 209,09 $, ~20,0 % du portefeuille, exactement à l'objectif — aucun déclencheur de rééquilibrage dans un sens ou dans l'autre. Le niveau d'invalidation des revues précédentes reste inchangé : une clôture sous la moyenne mobile à 200 jours et sous le coût de base des détenteurs à court terme, tous deux dans la zone d'environ 67 000 à 70 000 $, romprait la thèse haussière quelle que soit la discipline de dimensionnement autorisée.\n\nSPY se négocie autour de 768,90 $, en hausse modeste avec le marché dans son ensemble (S&P 500 +0,4 %, Nasdaq +~1 % porté par les résultats de NVIDIA/Salesforce/CrowdStrike), à la veille du symposium de Jackson Hole, qui a débuté aujourd'hui et se poursuit jusqu'à samedi. Le président de la Fed, Kevin Warsh, prononce demain son tout premier discours à Jackson Hole, alors que le marché est inhabituellement divisé sur la réunion de septembre — certaines cotations attribuent même une probabilité réelle à une hausse de taux plutôt qu'à une baisse —, ce qui fait du discours de demain le véritable événement à surveiller, pas la dérive du jour. La position vaut environ 249,74 $, ~23,9 % du portefeuille, à l'objectif, sans rien aujourd'hui qui justifie un changement.\n\nEffet net : aucune opération aujourd'hui. La VNI s'établit à environ 1 044,33 $, en hausse d'environ 1,7 % par rapport à la clôture d'hier à 1 026,98 $, entièrement due à la réévaluation portée par les résultats de NVIDIA et non à un quelconque changement de position. La trésorerie reste à 312,15 $ (~29,9 %), toujours réservée à un véritable repli de NVDA ou à une dislocation ailleurs plutôt que dépensée pour poursuivre le gap de ce matin."

        es:"Esta revisión previa al cierre de aproximadamente las 15:00 ET (que también liquida el NAV oficial de hoy) no encuentra ninguna información nueva que cambie la lectura de esta mañana: el beat de resultados de NVIDIA sigue desarrollándose como una simple revalorización de precio, no como una señal para actuar. NVDA cotiza ahora en torno a $225.94, subiendo cerca de un 7.76% en el día (máximo intradía cerca de $227), todavía muy por encima del rango previo a resultados (~$212-213) que la revisión de esta mañana señaló como el nivel a vigilar. El plan fijado esta mañana se mantiene sin cambios: la posición no persigue el hueco alcista de hoy, y las acciones recortadas solo se recomprarán ante un retroceso genuino, no en el propio repunte por resultados; un cierre claro por debajo de $212-213 se leería como una reversión de \"vender la noticia\" y desaconsejaría perseguir cualquier rebote. El valor de la posición subió ligeramente a unos $273.88 solo por precio, ~26.2% de la cartera (prácticamente sin cambios frente a la revisión de esta mañana) —cómodamente por debajo del límite del 35%, y un peso que valdría la pena elegir hoy incluso partiendo de efectivo: es la recompensa por haber dimensionado esta posición específicamente para el evento binario de resultados, no una deriva accidental. Por separado, los informes de que NVIDIA acordó comprar Hugging Face por unos $12.9 mil millones siguen sin confirmarse como definitivos —sin novedades desde esta mañana, y no incide en la decisión de hoy.\n\nBitcoin continúa consolidando, cotizando en torno a $79,300, dentro de la misma banda de $78,000-$80,000 que ha mantenido desde el retroceso desde el máximo de $81,235 del martes —sin ningún catalizador nuevo en ninguna dirección. La posición vale unos $210.15, ~20.1% de la cartera, prácticamente en su objetivo, sin disparador de reequilibrio. El nivel de invalidación de revisiones anteriores se mantiene sin cambios: un cierre por debajo de la media móvil de 200 días         fr:"Cette revue avant clôture d'environ 15h00 ET (qui règle également la VNI officielle du jour) ne trouve aucune information nouvelle qui changerait la lecture de ce matin : le beat de résultats de NVIDIA continue de se traduire par une simple réévaluation de prix, pas un signal d'action. NVDA se négocie désormais autour de 225,94 $, en hausse d'environ 7,76 % sur la journée (plus haut intrajournalier proche de 227 $), toujours largement au-dessus de la fourchette d'avant résultats (~212-213 $) que la revue de ce matin avait désignée comme le niveau à surveiller. Le plan fixé ce matin reste inchangé : la position ne poursuit pas le gap haussier du jour, et les actions réduites ne seront rachetées qu'en cas de repli véritable, pas sur le rebond lié aux résultats lui-même ; une clôture nette sous 212-213 $ se lirait comme un renversement du type « vendre la nouvelle » et déconseillerait de poursuivre tout rebond. La valeur de la position a légèrement augmenté à environ 273,88 $ uniquement sous l'effet du prix, soit ~26,2 % du portefeuille (quasiment inchangé par rapport à la revue de ce matin) — confortablement sous le plafond de 35 %, et un poids qu'il vaudrait la peine de choisir aujourd'hui même en partant de liquidités : c'est la récompense d'avoir dimensionné cette position spécifiquement pour l'événement binaire des résultats, pas une dérive accidentelle. Par ailleurs, les informations selon lesquelles NVIDIA aurait accepté de racheter Hugging Face pour environ 12,9 milliards de dollars restent non confirmées comme définitives — rien de nouveau depuis ce matin, et cela n'influe pas sur la décision du jour.\n\nLe bitcoin continue de se consolider, se négociant autour de 79 300 $, dans la même bande de 78 000-80 000 $ qu'il occupe depuis son repli par rapport au sommet de 81 235 $ de mardi — sans nouveau catalyseur dans un sens ou dans l'autre. La position vaut environ 210,15 $, ~20,1 % du portefeuille, pratiquement à son objectif, sans déclencheur de rééquilibrage. Le niveau d'invalidation des revues précédentes reste inchangé : une clôture sous la moyenne mobile à 200 jours et sous le coût de base des détenteurs à court terme, tous deux dans la zone d'environ 67 000-70 000 $, romprait la thèse haussière quelle que soit la discipline de dimensionnement autorisée.\n\nLe SPY se négocie autour de 770,32 $, en hausse modeste avec le marché dans son ensemble (S&P 500 +0,24 %, Nasdaq +0,83 % porté par l'élan des résultats de NVIDIA/Salesforce/CrowdStrike), tandis que le symposium de Jackson Hole se poursuit. Le président de la Fed, Kevin Warsh, prononce demain (vendredi) son tout premier discours à Jackson Hole, alors que le marché est inhabituellement divisé sur la réunion de septembre — ce discours, et non la dérive du jour, est le véritable événement à surveiller. La position vaut environ 250,20 $, ~23,9 % du portefeuille, à l'objectif, sans rien aujourd'hui qui justifie un changement.\n\nEffet net : aucune opération aujourd'hui, dans la continuité de la revue de ce matin. La VNI s'établit à environ 1 046,38 $, légèrement au-dessus des 1 044,33 $ de la revue de ce matin, en hausse d'environ 1,9 % par rapport à la clôture d'hier à 1 026,98 $, portée par la vigueur continue de NVDA après ses résultats et un marché globalement ferme. La trésorerie reste à 312,15 $ (~29,8 %), toujours réservée à un véritable repli de NVDA ou à une dislocation ailleurs plutôt que dépensée pour poursuivre le gap du jour."

        es:"El verdadero evento de hoy fue el primer discurso principal del presidente de la Fed, Kevin Warsh, en Jackson Hole (~10:00 ET), el catalizador concreto señalado hace tres revisiones como el próximo punto contra el cual reevaluar. Evitó dar una orientación explícita a futuro, calificó las lecturas de inflación más suaves de este verano como no concluyentes sobre la tendencia subyacente, y dijo que la Fed \"todavía tiene trabajo por hacer\" si la inflación subyacente no sigue mejorando —lo más cerca que ha estado de insinuar una subida de tasas en lugar de un recorte. El mercado lo interpretó como sustancialmente hawkish: las probabilidades de una subida de tasas en septiembre según la herramienta CME FedWatch saltaron a aproximadamente 46% desde el 35% del día anterior, el rendimiento a 2 años subió cerca de 8 puntos básicos a 4.31%, y el de 10 años subió 2 puntos básicos a 4.69%. Pero los activos de riesgo no vendieron con esto: el S&P 500 y el Nasdaq siguen subiendo cerca de 0.4–0.5% en el día, el VIX apenas subió a unos 15.65 desde 15.21, y Bitcoin sigue sosteniéndose en la parte alta de los $79,000. Esa combinación —un tono genuinamente hawkish sin acción comprometida, absorbido por los mercados sin una caída real— debe leerse como que el discurso quedó atrás sin revertir la tesis de ninguna posición, no como una falsa alarma; el verdadero punto de decisión es la reunión del FOMC del 16 de septiembre, donde una subida real (o un \"dot plot\" que apunte a ella) sería la prueba genuina, no la retórica de hoy.\n\nNVDA cotiza alrededor de $226 (rango del día $220.90–$230.47), esencialmente plano respecto al nivel en que se asentó tras los resultados del miércoles. La posición vale ahora unos $274, aproximadamente el 26.2% de la cartera —un repunte moderado desde el ~25% que quedó tras la reducción previa a resultados del miércoles, pero todavía cómodamente por debajo del límite del 35%— y nada de hoy cambia la lectura posterior a resultados: no hay motivo         zh:"本次约15:00 ET的收盘前复核（同时结算当日官方净值）发现今日真正的主线是NVDA回吐了财报后的部分涨幅——而不是沃什的演讲，今早复核已判定该演讲已经过去且未推翻任何仓位的逻辑。NVDA开盘约226美元，盘中持续走低至约218.60美元附近（日内低点约218.60–218.82美元，一度日内跌幅接近4%），抹去了财报后的累积涨幅，且低于今早复核所记录的220.90美元盘中低点。造成这一走势的有两个因素，且都不构成对周三财报的否定：其一，据《华尔街日报》报道，英伟达暂停了其\"AI Compute Partnership\"计划的部分内容——这是一项运作约两个月的面向AI云服务商的收入分成融资安排——原因是合作伙伴不满英伟达试图对融资算力的客户使用权拥有更大话语权；这是一则关于交易结构的新闻，并未改变创纪录的890亿美元数据中心季度营收，也未改变上调后的1080亿美元第三季度指引。其二，美满电子（Marvell）尽管营收与每股收益均超预期，仍因2028财年指引未达（与其Google定制芯片合作相关的）过高预期而下跌约7%，拖累芯片板块整体情绪——纳斯达克今日的跑输正是源于半导体板块走弱。值得注意的是，SPY并未卷入此轮抛售：目前报约774美元，接近当日高点，较今早还有所走高，说明这是半导体板块的特定轮动，而非宏观层面的risk-off。\n\n今日双向均无交易。表面上看，这似乎正是计划中等待用以买回周一减持仓位的\"真正回调\"——但该走势仅持续了一个交易日，且混合了一则真实但范围有限的英伟达专属消息与板块联动式抛售，而非多个交易日的确认或对某一明确技术位的回测；在一次7.5%财报跳空后的首个下跌交易日就买入，其风险与原则三所警示的追涨如出一辙，只是方向相反。同样也没有理由进一步减仓：今日的消息均未触及周三财报所确立的基本面，该仓位目前市值约265美元（约占组合25.5%，较今早的约26.2%纯因价格下跌所致），仍舒适地处于35%上限之内，且即便以现金重新出发，今天仍会选择维持这一权重。后续重新评估的标准如下：若NVDA在未来一两个交易日内于当前水平上方企稳或筑底，则是重新考虑买回减持部分的信号；若股价跌破财报前区间（约212–213美元）并收于其下方，则意味着市场正将\"合作暂停\"消息解读为不止是噪音，届时应考虑对剩余仓位进一步减持，而非加仓。\n\n比特币在79,000–80,000美元区间整理，盘前一度短暂突破81,000美元后回落——没有新的催化剂，仍未突破此前复核标记的80,000–82,000美元阻力区间，现货ETF资金流入（截至昨日已连续九日净流入）继续为价格提供支撑。该仓位目前市值约210美元，约占组合20.3%，基本处于目标权重，无再平衡触发条件。失效判据保持不变：若价格重新收于200日均线与短期持有者成本线（均位于约67,000–70,000美元区间）下方，无论仓位纪律如何允许，都将推翻当前的看多立场。\n\nSPY报约774美元，接近当日高点；该仓位市值约251美元，约占组合24.2%，处于目标水平，今日没有理由调整。\n\n综合来看：今日无交易。净值结算于约1,039.10美元，较昨日收盘1,046.38美元下降约0.7%，NVDA的回落超过了SPY的走强与BTC的基本持平所带来的对冲。现金维持在312.15美元（约30.0%），继续留作应对上述NVDA企稳信号或其他资产真正错杀机会的储备，而非在今日的双向波动中贸然动用。",
        en:"This ~15:00 ET pre-close check, which also settles today's official NAV, finds the real story of the day is NVDA giving back a chunk of its post-earnings gains — not Warsh's speech, which this morning's check already concluded had resolved without breaking any position's thesis. NVDA opened near $226 and slid through the session to around $218.60 (intraday low near $218.60-$218.82, briefly down as much as ~4% on the day), erasing the post-earnings drift and landing below the $220.90 intraday low this morning's check had noted. Two things are driving it, and neither is a repudiation of Wednesday's print: first, the WSJ reported Nvidia paused parts of its 'AI Compute Partnership' — a roughly two-month-old revenue-sharing financing program for AI cloud providers — amid partner pushback over Nvidia seeking greater say in which customers could use the financed capacity; it's a deal-structuring headline, not a change to the record $89B Data Center quarter or the raised $108B Q3 guide. Second, Marvell fell about 7% despite beating on revenue and EPS, on FY2028 guidance that undershot elevated expectations tied to its Google custom-chip deal, dragging chip-sector sentiment broadly — the Nasdaq underperformed the S&P and Dow today specifically on semiconductor weakness. Tellingly, SPY is not caught up in this selloff: it trades around $774, near its session high and above this morning's level, which argues this is a semis-specific rotation rather than a macro risk-off day.\n\nNo trade today, in either direction. This reads, on its face, like the 'genuine pullback' the plan has been waiting for to buy back Monday's trim — but it is one session old, and mixes a real if narrow NVDA-specific headline with sector sympathy rather than a multi-session confirmation or a retest of a defined level; buying the first red day after a 7.5% earnings gap risks becoming exactly the kind of chase Principle 03 warns against, just run in reverse. Nor is there a case for trimming further: nothing here touches the fundamentals the Wednesday beat established, and the position, now worth about $265 (~25.5% of the book, down from ~26.2% this morning purely on price), sits comfortably under the 35% cap at a weight the log would still choose starting from cash. The reassessment criteria going forward: a session or two of stabilization or basing above current levels is the setup to reconsider buying back the trimmed shares; a close through the pre-earnings range (~$212-213) would mean the partnership-pause news is being read as more than noise, and argues for trimming the remaining position further rather than adding.\n\nBitcoin is consolidating in the $79,000-$80,000 band, having briefly popped above $81,000 pre-market before giving it back — no new catalyst, still capped below the $80,000-82,000 resistance zone flagged in prior checks, with spot ETF inflows (a ninth straight day of net inflows as of yesterday) continuing to provide a floor. The position is worth about $210, ~20.3% of the book, essentially at target with no rebalancing trigger. The invalidation level stands unchanged: a close back below the 200-day moving average and the short-term-holder cost basis, both in the roughly $67,000-$70,000 zone, breaks the bullish case regardless of what position sizing allows.\n\nSPY trades around $774, near its session high; the position is worth about $251, ~24.2% of the book and at target, with nothing today arguing for a change.\n\nNet effect: no trades. NAV settles at about $1,039.10, down roughly 0.7% from yesterday's $1,046.38 close, as NVDA's slide outweighs a firmer SPY and a roughly flat BTC. Cash holds at $312.15 (~30.0%), still reserved for the NVDA stabilization signal described above or a genuine dislocation elsewhere, not spent chasing today's move in either direction.",
        es:"Esta revisión previa al cierre de aproximadamente las 15:00 ET (que también liquida el NAV oficial de hoy) encuentra que la verdadera historia del día es que NVDA devuelve parte de sus ganancias posteriores a resultados, y no el discurso de Warsh, que la revisión de esta mañana ya concluyó que había quedado atrás sin revertir la tesis de ninguna posición. NVDA abrió cerca de $226 y cayó a lo largo de la sesión hasta cerca de $218.60 (mínimo intradía de aproximadamente $218.60–218.82, con una caída intradía de hasta casi el 4%), borrando la deriva posterior a resultados y quedando por debajo del mínimo intradía de $220.90 registrado en la revisión de esta mañana. Dos factores explican este movimiento, y ninguno desmiente el informe del miércoles: primero, el Wall Street Journal informó que Nvidia pausó partes de su 'AI Compute Partnership' —un programa de financiamiento con reparto de ingresos para proveedores de nube de IA, vigente desde hace apenas dos meses— tras el rechazo de socios a que Nvidia buscara mayor injerencia sobre qué clientes podrían usar la capacidad financiada; es una noticia sobre la estructura del acuerdo, no un cambio en el récord de $89,000 millones en ingresos de centros de datos ni en la guía elevada de $108,000 millones para el tercer trimestre. Segundo, Marvell cayó cerca de un 7% pese a superar expectativas de ingresos y BPA, por una guía para el año fiscal 2028 que no alcanzó las expectativas elevadas ligadas a su acuerdo de chips personalizados con Google, arrastrando el sentimiento de todo el sector de chips —el Nasdaq underperformó hoy frente al S&P y el Dow precisamente por la debilidad de los semiconductores. Cabe destacar que SPY no está en esta liquidación: cotiza en torno a $774, cerca de su máximo de la sesión y por encima del nivel de esta mañana, lo que sugiere que se trata de una rotación específica de semiconductores y no de un día de risk-off macro.\n\nSin operaciones hoy, en ningún sentido. A primera vista, esto se parece al 'retroceso genuino' que el plan esperaba para recomprar el recorte del lunes, pero tiene solo una sesión de antigüedad y combina una noticia real pero acotada, específica de NVDA, con un arrastre de sector, en lugar de una confirmación de varias sesiones o un retest de un nivel definido; comprar en el primer día rojo tras un hueco de resultados del 7.5% correría el riesgo de convertirse exactamente en el tipo de persecución que advierte el Principio 03, solo que en sentido inverso. Tampoco hay argumento para recortar más: nada de esto toca los fundamentales que estableció el resultado del miércoles, y la posición, que ahora vale unos $265 (~25.5% de la cartera, frente a ~26.2% de esta mañana, solo por efecto del precio), se mantiene cómodamente por debajo del límite del 35%, en un peso que el registro seguiría eligiendo incluso partiendo de efectivo. Los criterios de reevaluación de cara adelante: una o dos sesiones de estabilización o formación de base por encima de los niveles actuales serían la señal para reconsiderar la recompra de las acciones recortadas; un cierre por debajo del rango previo a resultados (~$212–213) significaría que la noticia de la pausa de la asociación se está interpretando como algo más que ruido, y argumentaría a favor de recortar aún más la posición restante en lugar de sumar.\n\nBitcoin consolida en la banda de $79,000–80,000, tras superar brevemente los $81,000 en la premercado y ceder ese nivel —sin catalizador nuevo, todavía por debajo de la zona de resistencia de $80,000–82,000 señalada en revisiones previas, con las entradas netas en los ETF al contado (nueve días consecutivos hasta ayer) siguiendo dando soporte al precio. La posición vale unos $210, ~20.3% de la cartera, prácticamente en su objetivo, sin disparador de reequilibrio. El nivel de invalidación se mantiene sin cambios: un cierre por debajo de la media móvil de 200 días y de la base de costo de los tenedores de corto plazo, ambos en la zona de aproximadamente $67,000–70,000, rompería la tesis alcista sin importar lo que permita el dimensionamiento de la posición.\n\nSPY cotiza en torno a $774, cerca de su máximo de la sesión; la posición vale unos $251, ~24.2% de la cartera, en su objetivo, sin nada hoy que justifique un cambio.\n\nEn conjunto: sin operaciones hoy. El NAV se liquida en aproximadamente $1,039.10, una baja de cerca del 0.7% frente al cierre de ayer de $1,046.38, ya que la caída de NVDA supera la fortaleza de SPY y un BTC prácticamente plano. El efectivo se mantiene en $312.15 (~30.0%), reservado todavía para la señal de estabilización de NVDA descrita arriba o para una dislocación genuina en otro lugar, en lugar de gastarse persiguiendo el movimiento de hoy en cualquier dirección.",
        fr:"Cette revue avant clôture d'environ 15h00 ET (qui règle également la VNI officielle du jour) constate que le véritable sujet du jour est NVDA qui efface une partie de ses gains post-résultats — et non le discours de Warsh, dont la revue de ce matin avait déjà conclu qu'il s'était déroulé sans remettre en cause la thèse d'aucune position. NVDA a ouvert autour de 226 $ et a glissé tout au long de la séance jusqu'à environ 218,60 $ (plus bas intrajournalier d'environ 218,60-218,82 $, avec une baisse intrajournalière atteignant près de 4 %), effaçant la dérive post-résultats et passant sous le plus bas intrajournalier de 220,90 $ relevé lors de la revue de ce matin. Deux éléments expliquent ce mouvement, et aucun ne dément la publication de mercredi : d'abord, le Wall Street Journal a rapporté que Nvidia a mis en pause une partie de son programme 'AI Compute Partnership' — un dispositif de financement à partage de revenus pour les fournisseurs de cloud IA, vieux d'à peine deux mois — après que des partenaires ont rejeté la volonté de Nvidia d'obtenir davantage de contrôle sur les clients autorisés à utiliser la capacité financée ; il s'agit d'une nouvelle sur la structuration de l'accord, pas d'un changement du chiffre d'affaires record de 89 milliards de dollars des centres de données ni des prévisions relevées à 108 milliards de dollars pour le troisième trimestre. Ensuite, Marvell a chuté d'environ 7 % malgré un dépassement des attentes de chiffre d'affaires et de BPA, sur des prévisions pour l'exercice 2028 qui n'ont pas atteint les attentes élevées liées à son accord de puces personnalisées avec Google, entraînant dans son sillage le sentiment de tout le secteur des semi-conducteurs — le Nasdaq a sous-performé le S&P et le Dow aujourd'hui précisément à cause de la faiblesse des semi-conducteurs. Fait notable, le SPY n'est pas concerné par ce repli : il se négocie autour de 774 $, proche de son plus haut de séance et en hausse par rapport à ce matin, ce qui suggère une rotation propre aux semi-conducteurs plutôt qu'une journée de risk-off macro.\n\nAucune opération aujourd'hui, dans un sens comme dans l'autre. À première vue, cela ressemble au 'repli véritable' que le plan attendait pour racheter la réduction de lundi — mais il ne date que d'une séance et mélange une nouvelle réelle mais limitée, propre à NVDA, avec un effet d'entraînement sectoriel, plutôt qu'une confirmation sur plusieurs séances ou un retest d'un niveau défini ; acheter dès le premier jour rouge après un gap de résultats de 7,5 % risquerait de devenir exactement le type de poursuite que met en garde le Principe 03, simplement en sens inverse. Rien ne justifie non plus de réduire davantage : rien ici ne touche aux fondamentaux établis par le beat de mercredi, et la position, qui vaut désormais environ 265 $ (~25,5 % du portefeuille, contre ~26,2 % ce matin, uniquement sous l'effet du prix), reste confortablement sous le plafond de 35 %, à un poids que le journal choisirait encore même en partant de liquidités. Les critères de réévaluation pour la suite : une ou deux séances de stabilisation ou de formation d'une base au-dessus des niveaux actuels constitueraient le signal pour reconsidérer le rachat des actions réduites ; une clôture sous la fourchette d'avant résultats (~212-213 $) signifierait que la nouvelle de la pause du partenariat est interprétée comme plus qu'un simple bruit, et plaiderait pour réduire davantage la position restante plutôt que d'y ajouter.\n\nLe Bitcoin se consolide dans la bande des 79 000-80 000 $, après avoir brièvement dépassé les 81 000 $ en avant-bourse avant de céder ce niveau — sans nouveau catalyseur, toujours sous la zone de résistance de 80 000-82 000 $ signalée lors des revues précédentes, les entrées nettes des ETF au comptant (neuf jours consécutifs jusqu'à hier) continuant de soutenir le prix. La position vaut environ 210 $, ~20,3 % du portefeuille, pratiquement à son objectif, sans déclencheur de rééquilibrage. Le niveau d'invalidation reste inchangé : une clôture sous la moyenne mobile à 200 jours et le coût de base des détenteurs à court terme, tous deux dans la zone d'environ 67 000-70 000 $, romprait la thèse haussière quelle que soit la discipline de dimensionnement autorisée.\n\nLe SPY se négocie autour de 774 $, proche de son plus haut de séance ; la position vaut environ 251 $, ~24,2 % du portefeuille, à son objectif, sans rien aujourd'hui qui justifie un changement.\n\nEffet net : aucune opération aujourd'hui. La VNI s'établit à environ 1 039,10 $, en baisse d'environ 0,7 % par rapport à la clôture d'hier à 1 046,38 $, le repli de NVDA l'emportant sur la fermeté du SPY et un BTC pratiquement stable. La trésorerie reste à 312,15 $ (~30,0 %), toujours réservée au signal de stabilisation de NVDA décrit ci-dessus ou à une dislocation véritable ailleurs, plutôt que dépensée pour poursuivre le mouvement du jour, dans un sens ou dans l'autre."

        zh:"周六的复核在设计上只涉及加密货币——美股周末休市，NVDA与SPY价格维持在周五15:00 ET收盘价不变，无论出现何种消息，二者今日均不可交易；唯一可操作的资产是比特币，而目前的情况并未达到交易的门槛。\n\n比特币回落至约77,700–77,800美元，过去24小时下跌约3.8%，延续了自周二81,235美元高点以来的回撤。这一走势看不出任何新的基本面催化剂：周五约64亿美元的比特币期权在Deribit到期，看涨期权未平仓量集中在75,000–80,000美元行权价区间；周末又出现一轮多头爆仓（主要交易所四小时内约1.01亿美元，其中比特币约3,870万美元），周末现货流动性稀薄，使得一个在工作日本可能被市场消化的仓位被迫平仓。恐惧与贪婪指数从周四的73回落至68——仍处于贪婪区间，远未到会促使逢低加仓的极度恐惧水平。该仓位目前市值约206.04美元，约占组合19.9%——基本处于20%的目标权重，无论方向都没有再平衡触发条件，也是一个即便今天从现金重新出发仍会选择的权重，因为眼下没有任何信息改变持有该仓位的理由。此前复核设定的失效判据值得更新而非放弃：随着近期涨势推升，200日均线已升至约74,168美元；短期持有者成本线约在67,100美元附近——若价格重新收于二者下方，仍是会推翻当前看多立场的水平，而今日价格仍舒适地高于两者。\n\nNVDA与SPY今日没有任何新信息——市场休市，二者均维持在周五收盘价：NVDA为218.60美元（约占组合25.6%），SPY为774.46美元（约占组合24.3%）。自周五15:00 ET结算以来，两者权重均未变化，在周一开盘前也没有可采取的行动。\n\n综合来看：今日无交易。净值报约1,034.72美元，较周五收盘的1,039.10美元下降约0.4%，比特币的周末回落超过了维持不变的股票类资产估值。现金维持在312.15美元（约30.2%），保持不变，继续留作应对比特币跌破上述关键位的真正错杀，或周一股市重开后出现的机会。",
        en:"Saturday's check is crypto-only by design — US equities markets are shut for the weekend, so NVDA and SPY prices stay frozen at Friday's 15:00 ET close and neither can be traded regardless of any news; the only actionable asset today is Bitcoin, and there's nothing here that clears the bar for a trade.\n\nBitcoin has pulled back to around $77,700-$77,800, down about 3.8% over the past 24 hours and extending the retreat from Tuesday's $81,235 high. Nothing about this reads as a new fundamental catalyst: Friday saw roughly $6.4 billion in Bitcoin options expire on Deribit, with call open interest concentrated in the $75,000-$80,000 strikes, and the weekend brought a bout of long liquidations (~$101 million across major venues in a four-hour window, ~$38.7 million of it in BTC) as thin weekend spot liquidity let a position unwind that would likely have been absorbed on a weekday. The Fear & Greed Index has cooled to 68 from Thursday's 73 — still Greed, nowhere near the extreme fear that would argue for adding on a dislocation. The position is worth about $206.04, ~19.9% of the book — essentially at the 20% target with no rebalancing trigger either way, and a weight the log would still choose today even starting from cash, since nothing here changes the case for holding it. The invalidation levels from prior checks are worth refreshing rather than abandoning: the 200-day moving average has climbed to roughly $74,168 as the recent rally rolls through it, and the short-term-holder cost basis sits near $67,100 — a close back below both remains the level that would overturn the bullish stance, and today's price sits comfortably above either.\n\nNVDA and SPY carry no new information today — markets are closed, so both remain marked at Friday's close: NVDA at $218.60 (~25.6% of the book) and SPY at $774.46 (~24.3%). Neither weight has moved since Friday's 15:00 ET settlement, and there's nothing to act on until Monday's open.\n\nNet: no trades today. NAV checks in         es:"La revisión del sábado es, por diseño, solo sobre cripto: los mercados bursátiles de EE. UU. están cerrados por el fin de semana, así que los precios de NVDA y SPY se mantienen congelados en el cierre del viernes a las 15:00 ET, y ninguno de los dos puede operarse hoy sin importar qué noticia surja; el único activo accionable hoy es Bitcoin, y nada aquí alcanza el umbral para una operación.\n\nBitcoin retrocedió a unos $77,700-$77,800, una caída de cerca del 3.8% en las últimas 24 horas, extendiendo el retroceso desde el máximo de $81,235 del martes. Nada de esto parece un catalizador fundamental nuevo: el viernes vencieron cerca de $6,400 millones en opciones de Bitcoin en Deribit, con el interés abierto de opciones call concentrado en los precios de ejercicio de $75,000-$80,000, y el fin de semana trajo una ronda de liquidaciones de posiciones largas (~$101 millones en las principales plataformas en una ventana de cuatro horas, ~$38.7 millones de eso en BTC), ya que la escasa liquidez spot de fin de semana permitió que se deshiciera una posición que probablemente se habría absorbido en un día laborable. El Índice de Miedo y Codicia se enfrió a 68 desde el 73 del jueves —todavía en codicia, lejos del miedo extremo que justificaría sumar ante una dislocación. La posición vale unos $206.04, ~19.9% de la cartera —esencialmente en el objetivo del 20%, sin disparador de reequilibrio en ninguna dirección, y un peso que el registro seguiría eligiendo hoy incluso partiendo de efectivo, ya que nada aquí cambia el argumento para mantenerla. Los niveles de invalidación de revisiones anteriores merecen actualizarse, no abandonarse: la media móvil de 200 días ha subido a unos $74,168 a medida que el reciente rally la atraviesa, y la base de costo de los tenedores de corto plazo se sitúa cerca de $67,100 —un cierre por debajo de ambos sigue siendo el nivel que revertiría la postura alcista, y el precio de hoy se mantiene cómodamente por encima de los dos.\n\nNVDA y S         fr:"La revue du samedi ne porte, par construction, que sur les cryptomonnaies : les marchés actions américains sont fermés pour le week-end, donc les cours de NVDA et SPY restent figés à la clôture de vendredi 15h00 ET, et aucun des deux ne peut être négocié aujourd'hui, quelle que soit l'actualité ; le seul actif actionnable aujourd'hui est le Bitcoin, et rien ici n'atteint le seuil justifiant une opération.\n\nLe Bitcoin s'est replié autour de 77 700-77 800 $, en baisse d'environ 3,8 % sur les dernières 24 heures, prolongeant le repli depuis le sommet de 81 235 $ de mardi. Rien de tout cela ne ressemble à un nouveau catalyseur fondamental : vendredi, environ 6,4 milliards de dollars d'options Bitcoin sont arrivées à échéance sur Deribit, avec un intérêt ouvert sur les calls concentré sur les strikes 75 000-80 000 $, et le week-end a apporté une vague de liquidations de positions longues (~101 millions de dollars sur les principales plateformes en quatre heures, dont ~38,7 millions de dollars en BTC), la faible liquidité au comptant du week-end ayant permis le débouclage d'une position qui aurait probablement été absorbée en semaine. L'indice Peur et Cupidité s'est refroidi à 68 contre 73 jeudi — toujours en cupidité, loin de la peur extrême qui justifierait un renforcement sur une dislocation. La position vaut environ 206,04 $, ~19,9 % du portefeuille — pratiquement à l'objectif de 20 %, sans déclencheur de rééquilibrage dans un sens ou dans l'autre, et un poids que le journal choisirait encore aujourd'hui même en partant de liquidités, puisque rien ici ne change l'argument en faveur de la conservation. Les niveaux d'invalidation des revues précédentes méritent d'être actualisés plutôt qu'abandonnés : la moyenne mobile à 200 jours est montée à environ 74 168 $ à mesure que le rally récent la traverse, et le coût de base des détenteurs à court terme se situe près de 67 100 $ — une clôture sous ces deux niveaux resterait le signal qui renverserait la thèse haussière, et le prix du jour se maintient confortablement au-dessus des deux.\n\nNVDA et SPY n'apportent aucune information nouvelle aujourd'hui — les marchés sont fermés, donc les deux restent marqués à la clôture de vendredi : NVDA à 218,60 $ (~25,6 % du portefeuille) et SPY à 774,46 $ (~24,3 %). Aucun poids n'a changé depuis le règlement de vendredi 15h00 ET, et il n'y a rien à faire avant l'ouverture de lundi.\n\nAu final : aucune opération aujourd'hui. La VNI s'établit à environ 1 034,78 $, en baisse d'environ 0,4 % par rapport à la clôture de vendredi à 1 039,10 $, le repli du Bitcoin sur le week-end l'emportant sur des valorisations actions figées et inchangées. La trésorerie reste à 312,15 $ (~30,2 %), inchangée, toujours réservée à une dislocation véritable du Bitcoin sous les niveaux ci-dessus ou à une opportunité côté actions une fois les marchés rouverts lundi."
