  const {holdings, totalValue} = totals;
  document.getElementById('holdingsNote').textContent = t.holdingsNote(ALPHA_DATA.meta.lastUpdated);
  document.getElementById('holdingsBody').innerHTML = holdings.map(h=>{
    const pnlCls = h.pnl>0?'up':(h.pnl<0?'down':'flat');
    const weight = (h.marketValue/totalValue*100).toFixed(1);
    return `
      <tr>
        <td><div class="sym"><b>${h.symbol}</b><span>${h.name}</span></div></td>
        <td><span class="type-pill">${L(h.type)}</span></td>
        <td>${fmtQty(h.shares, h.qtyDecimals)}</td>
        <td>${fmtUSD(h.avgCost)}</td>
        <td>${fmtUSD(h.currentPrice)}</td>
        <td>${fmtUSD(h.marketValue)}</td>
        <td class="${pnlCls}">${h.pnl>=0?'+':''}${fmtUSD(h.pnl)} (${fmtPct(h.pnlPct)})</td>
        <td>${weight}%</td>
      </tr>
    `;
  }).join('') + `
    <tr>
      <td><div class="sym"><b>${t.cashRowLabel}</b><span>${t.cashRowSub}</span></div></td>
      <td><span class="type-pill">${t.cashRowLabel}</span></td>
      <td colspan="4" style="color:var(--text-faint)">—</td>
      <td>${fmtUSD(ALPHA_DATA.cash)}</td>
      <td>${(ALPHA_DATA.cash/totalValue*100).toFixed(1)}%</td>
    </tr>
  `;
}

function renderAllocation(totals){
  const {holdings, totalValue} = totals;
  const t = I18N[currentLang];
  const labels = [...holdings.map(h=>h.symbol), t.cashRowLabel];
  const values = [...holdings.map(h=>h.marketValue), ALPHA_DATA.cash];
  const colors = [...holdings.map(h=>colorFor(h.symbol)), colorFor('CASH')];

  if (allocChartInstance) allocChartInstance.destroy();
  allocChartInstance = new Chart(document.getElementById('allocChart'), {
    type:'doughnut',
    data:{ labels, datasets:[{ data:values, backgroundColor:colors, borderColor:'#10171a', borderWidth:3 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      cutout:'68%',
      plugins:{ legend:{display:false}, tooltip:{
        backgroundColor:'#141d20', borderColor:'#213032', borderWidth:1,
        titleFont:{family:'IBM Plex Mono'}, bodyFont:{family:'IBM Plex Mono'},
        callbacks:{ label:(ctx)=> ` ${fmtUSD(ctx.parsed)} (${(ctx.parsed/totalValue*100).toFixed(1)}%)` }
      }}
    }
  });

  document.getElementById('allocLegend').innerHTML = labels.map((l,i)=>`
    <div class="alloc-row">
      <span class="l"><span class="sw" style="background:${colors[i]}"></span>${l}</span>
      <span class="v">${(values[i]/totalValue*100).toFixed(1)}%</span>
    </div>
  `).join('');
}

function renderWatchlist(){
  document.getElementById('watchGrid').innerHTML = ALPHA_DATA.watchlist.map(w=>`
    <div class="watch-card">
      <span class="watch-status hold">${L(w.status)}</span>
      <div class="wh"><b>${w.symbol}</b><span class="px">${L(w.price)}</span></div>
      <p>${L(w.note)}</p>
    </div>
  `).join('');
}

function renderTradeLog(){
  const t = I18N[currentLang];
  document.getElementById('tradeNote').textContent = t.tradeNote(ALPHA_DATA.trades.length);
  const allTrades = [...ALPHA_DATA.trades].reverse();
  const trades = logExpanded ? allTrades : allTrades.slice(0, LOG_PAGE_SIZE);
  document.getElementById('tradeLog').innerHTML = trades.map((tr, i)=>{
    const idx = ALPHA_DATA.trades.length - i;
    const id = 'LOG-' + String(idx).padStart(3,'0');
    const badgeLabel = tr.action==='buy' ? t.badgeBuy : tr.action==='sell' ? t.badgeSell : t.badgeHold;
    const mainBlock = tr.action==='hold' ? `
        <div class="log-main">
          <div class="who"><b>${t.holdLabel}</b></div>
          <div class="calc">${t.navAtCheckLabel}<br><b>${fmtUSD(tr.navAtCheck)}</b></div>
        </div>
      ` : `
        <div class="log-main">
          <div class="who"><b>${tr.symbol}</b><span>${tr.name}</span></div>
          <div class="calc">
            ${fmtQty(tr.shares, qtyDecimalsFor(tr.symbol))} × ${fmtUSD(tr.price)} = <b>${fmtUSD(tr.amount)}</b><br>
            ${t.cashAfterLabel} ${fmtUSD(tr.cashAfter)}
          </div>
        </div>
      `;
    return `
      <div class="log-entry ${tr.action}" id="${id}">
        <div class="log-top">
          <span class="log-id">${id}</span>
          <span class="log-date">${tr.date} · ${L(tr.time)}</span>
          <span class="badge ${tr.action}">${badgeLabel}</span>
        </div>
        ${mainBlock}
        <div class="log-reason">
          <div class="reason-label">${t.reasonLabel}</div>
          <div class="log-reason-text" id="reason-${id}">${L(tr.reason)}</div>
          <button type="button" class="reason-toggle" data-target="reason-${id}">${t.reasonExpand}</button>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.log-reason-text').forEach(el => {
    const toggle = el.nextElementSibling;
    if (el.scrollHeight <= el.clientHeight + 1) toggle.style.display = 'none';
  });

  const hiddenCount = allTrades.length - trades.length;
  const moreRow = document.getElementById('logMoreRow');
  if (allTrades.length <= LOG_PAGE_SIZE) {
    moreRow.innerHTML = '';
  } else if (logExpanded) {
    moreRow.innerHTML = `<button type="button" class="log-more-btn" id="logMoreBtn">${t.logShowLess}</button>`;
  } else {
    moreRow.innerHTML = `<button type="button" class="log-more-btn" id="logMoreBtn">${t.logShowMore(hiddenCount)}</button>`;
  }
}

function renderNavChart(){
  const t = I18N[currentLang];
  const labels = ALPHA_DATA.snapshots.map(s=>L(s.label));
  const data = ALPHA_DATA.snapshots.map(s=>s.totalValue);
  document.getElementById('chartNote').textContent = t.chartNote(ALPHA_DATA.snapshots.length);

  if (navChartInstance) navChartInstance.destroy();
  navChartInstance = new Chart(document.getElementById('navChart'), {
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'nav',
          data,
          borderColor:'#ffb400',
          backgroundColor:'rgba(255,180,0,0.08)',
          pointBackgroundColor:'#ffb400',
          pointBorderColor:'#0a0e0f',
          pointRadius:5,
          pointHoverRadius:7,
          borderWidth:2,
          fill:true,
          tension:0.25
        },
        {
          label:'baseline',
          data:labels.map(()=>ALPHA_DATA.meta.initialCapital),
          borderColor:'#4e6567',
          borderDash:[4,4],
          borderWidth:1,
          pointRadius:0,
          fill:false
        }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#141d20', borderColor:'#213032', borderWidth:1,
          titleFont:{family:'IBM Plex Mono', size:11}, bodyFont:{family:'IBM Plex Mono', size:12},
          callbacks:{ label:(ctx)=> ctx.datasetIndex===0 ? ` ${t.navTooltip}${fmtUSD(ctx.parsed.y)}` : ` ${t.baselineTooltip}${fmtUSD(ctx.parsed.y)}` }
        }
      },
      scales:{
        x:{ grid:{color:'#1a2528'}, ticks:{color:'#8ba0a2', font:{family:'IBM Plex Mono', size:11}} },
        y:{ grid:{color:'#1a2528'}, ticks:{color:'#8ba0a2', font:{family:'IBM Plex Mono', size:11}, callback:(v)=>fmtUSD(v,0)} }
      }
    }
  });
}

function renderPrinciples(){
  const t = I18N[currentLang];
  document.getElementById('principles').innerHTML = t.principles.map(p=>`
    <div class="principle">
      <div class="n">${p.n}</div>
      <h3>${p.h}</h3>
      <p>${p.p}</p>
    </div>
  `).join('');
}

function renderSubscribe(){
  const t = I18N[currentLang];
  document.getElementById('subscribeTitle').textContent = t.subscribeTitle;
  document.getElementById('subscribeNote').textContent = t.subscribeNote;
  document.getElementById('subscribeLabel').textContent = t.subscribeLabel;
  document.getElementById('subscribeSubmit').value = t.subscribeSubmit;
  document.getElementById('subscribePowered').textContent = t.subscribePowered;
}

function renderFooter(){
  const t = I18N[currentLang];
  document.getElementById('disclaimerText').innerHTML =
    `${t.disclaimerIntro} <b>${t.disclaimerLead}</b>${t.disclaimerRest}`;
  document.getElementById('footerMeta').innerHTML = `
    <span>${t.footerInception} ${ALPHA_DATA.meta.startDate}</span>
    <span>${t.footerLastUpdated} ${ALPHA_DATA.meta.lastUpdated}</span>
    <span>${t.footerInitialCapital} ${fmtUSD(ALPHA_DATA.meta.initialCapital)}</span>
  `;
}

function renderAll(){
  const t = I18N[currentLang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.title;
  renderLangSwitch();

  const totals = computeTotals();
  renderStatusbar();
  renderHero(totals);
  renderStats(totals);
  renderSectionChrome();
  renderHoldings(totals);
  renderAllocation(totals);
  renderWatchlist();
  renderTradeLog();
  renderNavChart();
  renderPrinciples();
  renderSubscribe();
  renderFooter();
}

document.getElementById('langSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('.lang-btn');
  if (!btn) return;
  currentLang = btn.dataset.lang;
  renderAll();
});

document.getElementById('tradeLog').addEventListener('click', (e) => {
  const btn = e.target.closest('.reason-toggle');
  if (!btn) return;
  const t = I18N[currentLang];
  const textEl = document.getElementById(btn.dataset.target);
  const expanded = textEl.classList.toggle('expanded');
  btn.textContent = expanded ? t.reasonCollapse : t.reasonExpand;
});

document.getElementById('logMoreRow').addEventListener('click', (e) => {
  const btn = e.target.closest('#logMoreBtn');
  if (!btn) return;
  logExpanded = !logExpanded;
  renderTradeLog();
});

renderAll();
</script>

<script>
/* ======================================================================
   Subscribe-box funnel (Umami custom events)

   The useful conversion rate is "of the people who actually reached the
   subscribe box, how many submitted" — not submissions over pageviews, which
   mostly measures whether people scroll. So the box reports being seen, and
   the form reports being submitted, and both carry the same source string.

   Every call is optional-chained and wrapped: cloud.umami.is is blocked by
   most ad blockers, so window.umami is simply absent for a good share of
   visitors. Subscribing must keep working when it is.
   ====================================================================== */
(function(){
  function signupSource(){
    try {
      const q = new URLSearchParams(location.search);
      const tagged = q.get('utm_source') || q.get('ref');
      if (tagged) return tagged.slice(0, 40);
      if (!document.referrer) return 'direct';
      const host = new URL(document.referrer).hostname.replace(/^www\./, '');
      return host === location.hostname ? 'internal' : host.slice(0, 40);
    } catch (e) { return 'unknown'; }
  }

  function track(name, data){
    try { window.umami && window.umami.track(name, data); } catch (e) {}
  }

  const source = signupSource();

  const hidden = document.getElementById('bdSignupSource');
  if (hidden) hidden.value = source;

  const form = document.getElementById('subscribeForm');
  if (!form) return;

  // Fired once, the first time the box is actually on screen.
  if ('IntersectionObserver' in window) {
    let seen = false;
    const io = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting || seen) continue;
        seen = true;
        io.disconnect();
        track('subscribe-view', { source: source });
      }
    }, { threshold: 0.5 });
    io.observe(form);
  }

  // Not preventDefault'd on purpose: the form posts to Buttondown and the page
  // navigates away. Blocking that to wait on an analytics call would risk the
  // conversion itself, which is a far worse trade than losing some events.
  form.addEventListener('submit', function(){
    track('subscribe-submit', { source: source });
  });
})();
</script>
