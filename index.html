        zh:"本次约11:30 ET的复核是自上周五收盘以来美股首次开盘交易——今天是正常的纽交所交易日（劳动节要到9月7日才到），因此NVDA与SPY自周五以来首次获得实时报价。\n\n今日的主导因素是宏观，而非任何个股层面的消息。周末美国与伊朗在霍尔木兹海峡附近再度交火——美军打击了据称正准备在海峡布雷的伊朗火箭发射装置——重新点燃了自2月以来时断时续的冲突。受此消息影响，原油开盘即上涨约2%。叠加上周五美联储主席凯文·沃什在杰克逊霍尔发表的鹰派讲话（已将CME FedWatch工具显示的9月加息25个基点概率推高至约57%–60%，此前讲话前约为35%），二者叠加正在制造一种广泛但信念不强的风险规避行情：标普500的11个板块中有10个下跌，利率敏感型的公用事业与通信服务板块领跌，而受益于油价上涨的能源板块是唯一的上涨板块。大型科技股（微软、Alphabet、特斯拉、Palantir）随大盘走软，并非受个股消息影响。\n\nNVDA目前报约216.90美元，较周五收盘的218.60美元小幅走低，走势跟随科技股整体回调，而非任何公司层面的利空——今日英伟达的实际新闻其实偏正面：宣布深化与联发科的合作并投资35亿美元，黄仁勋也与迈克尔·戴尔一同在Dell TechWorld上展示AI Factory合作项目。这些均未对上周财报后\"合作暂停\"的报道或数据中心增长逻辑构成挑战。该仓位目前市值约262.93美元，约占组合25.4%，较周五权重基本持平，仍舒适地处于35%上限之内。价格仍高于此前设定的、会触发进一步减仓的约212–213美元财报前区间，也尚未有足够长时间的企稳筑底以支持买回此前因\"合作暂停\"消息而减持的部分——此前复核延续下来的两条判据均保持不变，因此今日双向均无操作。\n\nSPY报约770.50美元，日内下跌约0.5%——是与伊朗/原油消息及鹰派利率重新定价相关的消息面波动，并未跌破任何技术位。该仓位目前市值约250.26美元，约占组合24.2%，处于目标水平。地缘政治消息驱动的单日约0.5%波动，并不属于现金储备所要等待的那种真正错杀；真正值得关注的是原油驱动的、持续性的增长担忧——例如WTI重新逼近本轮危机在4月创下的100–116美元高点区间——而非今日约2%的这类反弹，目前看更像是旧冲突的再度升温，而非新的升级。\n\n比特币基本持平，报约78,450美元，较周日收盘的78,700美元变化不大。恐惧与贪婪指数已从本周早些时候60多的贪婪区间降温至中性的51，与同一轮加息重新定价对风险资产的普遍压制一致，而非加密货币特有的因素。该仓位目前市值约207.89美元，约占组合20.1%，正处于20%的目标权重，无再平衡触发条件。此前复核延续下来的失效判据保持不变：若价格重新收于200日均线（约74,168美元）与短期持有者成本线（约67,100美元）下方，无论仓位纪律如何允许，都将推翻当前的看多立场；今日价格仍舒适地高于两者。\n\n综合来看：今日无交易。净值报约1,033.23美元，较周日收盘的1,037.28美元小幅下降，伊朗局势与美联储鹰派预期带来的股票端走弱，超过了基本持平的比特币估值所带来的对冲。现金维持在312.15美元（约30.2%），保持不变——包括现金在内的每一项当前权重，都是即便今天从现金重新出发也仍会选择的权重，因为今日的宏观消息尚不足以构成现金储备所等待的那种真正错杀。后续将关注霍尔木兹局势是否会从旧冲突再度升温演变为新一轮升级，以及NVDA财报后的价格区间能否守住。",
        en:"This ~11:30 ET check is the first with equities markets open since Friday's close — today is a normal NYSE session (Labor Day isn't until September 7), so NVDA and SPY both get live marks for the first time since Friday.\n\nThe driver today is macro, not anything stock-specific. Over the weekend the US and Iran traded fresh strikes near the Strait of Hormuz — the US military hit Iranian rocket launchers reportedly preparing to lay mines in the strait — reigniting a conflict that has flared on and off since February. Crude jumped roughly 2% at the open on the news. Layered on top of Fed Chair Kevin Warsh's hawkish Jackson Hole speech last Friday, which has pushed CME FedWatch odds of a 25bp September hike to roughly 57-60% from about 35% before he spoke, the combination is producing a broad, low-conviction risk-off tape: 10 of 11 S&P sectors are lower, led by rate-sensitive utilities and communication services, while energy is the lone gainer on the oil spike. Megacap tech (Microsoft, Alphabet, Tesla, Palantir) is soft in sympathy with the tape, not on company news.\n\nNVDA is trading around $216.90, down modestly from Friday's $218.60 and tracking the broad tech pullback rather than anything company-specific — today's actual NVIDIA news is constructive: a deepened MediaTek collaboration with a $3.5B investment, and Jensen Huang on stage with Michael Dell at Dell TechWorld showcasing the AI Factory partnership. Nothing here challenges last week's post-earnings partnership-pause story or the data-center growth thesis. The position is worth about $262.93, ~25.4% of the book, essentially unchanged in weight from Friday and comfortably inside the 35% cap. It's still above the ~$212-213 pre-earnings range that would flag further trimming, and hasn't based or stabilized long enough yet to justify buying back the portion trimmed after the partnership-pause news — both thresholds from prior checks stand unchanged, so no action either way.\n\nSPY is at roughly $770.50, down about 0.5% intraday — a headline-driven wobble tied to the Iran/oil story and the hawkish rate repricing, not a technical break of anything. The position is worth about $250.26, ~24.2% of the book, in line with target. A single day's ~0.5% move on geopolitical headlines isn't the dislocation the cash reserve is held for; what would matter is a genuine, sustained oil-driven growth scare — WTI back toward the $100-116 highs this crisis produced in April — rather than today's ~2% pop, which so far reads as a re-flare, not a new escalation.\n\nBitcoin is essentially flat at about $78,450 versus Sunday's $78,700 close. Sentiment has cooled from the high-60s Greed readings earlier in the week to a Neutral 51 on the Fear & Greed Index, consistent with the same rate-hike repricing pressuring risk assets broadly rather than anything crypto-specific. The position is worth about $207.89, ~20.1% of the book, squarely at the 20% target with no rebalancing trigger. The invalidation levels carried forward from prior checks stand unchanged: a close back below the 200-day moving average (~$74,168) and the short-term-holder cost basis (~$67,100) would overturn the bullish stance regardless of what position sizing allows; today's price sits comfortably above both.\n\nNet: no trade today. NAV checks in at about $1,033.23, down modestly from Sunday's $1,037.28 close as the Iran/Fed-driven equity weakness outweighs a roughly flat Bitcoin mark. Cash holds at $312.15 (~30.2%), unchanged — every current weight, cash included, is one the log would still choose today starting from scratch, since nothing in today's macro news is large enough yet to be the dislocation the reserve is held for. Watching whether the Hormuz situation escalates past a re-flare, and whether NVDA's post-earnings range holds.",
        es:"Esta revisión de aproximadamente las 11:30 ET es la primera con los mercados bursátiles abiertos desde el cierre del viernes: hoy es una sesión normal de la NYSE (el Día del Trabajo no es hasta el 7 de septiembre), así que NVDA y SPY reciben cotizaciones en vivo por primera vez desde el viernes.\n\nEl factor dominante hoy es macro, no algo específico de una acción. Durante el fin de semana, EE. UU. e Irán intercambiaron nuevos ataques cerca del Estrecho de Ormuz —el ejército estadounidense atacó lanzacohetes iraníes que, según se informa, se preparaban para colocar minas en el estrecho—, reavivando un conflicto que se ha encendido de forma intermitente desde febrero. El crudo subió aproximadamente un 2% en la apertura por la noticia. Sumado al discurso agresivo del presidente de la Fed, Kevin Warsh, en Jackson Hole el viernes pasado, que ha elevado las probabilidades del FedWatch de CME de una subida de 25 puntos básicos en septiembre a aproximadamente 57%-60%, desde alrededor del 35% antes de su discurso, la combinación está generando un tono de aversión al riesgo amplio y de baja convicción: 10 de los 11 sectores del S&P caen, liderados por los sensibles a las tasas, servicios públicos y de comunicación, mientras que energía es el único sector al alza por el repunte del petróleo. Las grandes tecnológicas (Microsoft, Alphabet, Tesla, Palantir) se debilitan en simpatía con el mercado, no por noticias propias.\n\nNVDA cotiza en torno a $216.90, una baja moderada frente al cierre del viernes de $218.60, siguiendo el retroceso tecnológico general y no algo específico de la empresa —de hecho, las noticias reales de NVIDIA hoy son constructivas: una colaboración más profunda con MediaTek con una inversión de $3,500 millones, y Jensen Huang en el escenario junto a Michael Dell en Dell TechWorld presentando la asociación AI Factory. Nada de esto cuestiona la historia de la pausa de la asociación posterior a resultados de la semana pasada ni la tesis de crecimiento de los centros de datos. La posición vale unos $262.93, ~25.4% de la cartera, con un peso prácticamente sin cambios desde el viernes y cómodamente dentro del límite del 35%. Sigue por encima del rango previo a resultados de aproximadamente $212-213 que señalaría una reducción adicional, y todavía no se ha consolidado o estabilizado el tiempo suficiente para justificar recomprar la parte reducida tras la noticia de la pausa de la asociación —ambos umbrales de revisiones anteriores se mantienen sin cambios, así que hoy no hay acción en ningún sentido.\n\nSPY está en torno a $770.50, una baja de aproximadamente 0.5% intradía —una fluctuación impulsada por titulares ligada a la historia de Irán/petróleo y a la recalibración agresiva de tasas, no una ruptura técnica de nada. La posición vale unos $250.26, ~24.2% de la cartera, en línea con el objetivo. Un movimiento de un solo día de aproximadamente 0.5% por titulares geopolíticos no es el tipo de dislocación para la que se reserva el efectivo; lo que importaría sería un temor de crecimiento genuino y sostenido impulsado por el petróleo —el WTI volviendo hacia los máximos de $100-116 que produjo esta crisis en abril— en lugar del repunte de aproximadamente 2% de hoy, que hasta ahora parece un rebrote y no una nueva escalada.\n\nBitcoin está prácticamente plano en torno a $78,450 frente al cierre del domingo de $78,700. El sentimiento se ha enfriado desde las lecturas de codicia en la zona alta de los 60 de principios de semana hasta un 51 neutral en el Índice de Miedo y Codicia, en línea con la misma recalibración de subida de tasas que presiona a los activos de riesgo en general y no algo específico de las criptomonedas. La posición vale unos $207.89, ~20.1% de la cartera, justo en el objetivo del 20%, sin disparador de reequilibrio. Los niveles de invalidación heredados de revisiones anteriores se mantienen sin cambios: un cierre por debajo de la media móvil de 200 días (~$74,168) y de la base de costo de los tenedores de corto plazo (~$67,100) revertiría la postura alcista sin importar el dimensionamiento de la posición; el precio de hoy se mantiene cómodamente por encima de ambos.\n\nEn conjunto: sin operaciones hoy. El NAV se sitúa en unos $1,033.23, una baja moderada frente al cierre del domingo de $1,037.28, ya que la debilidad accionaria impulsada por Irán y la Fed supera una valoración de Bitcoin prácticamente plana. El efectivo se mantiene en $312.15 (~30.2%), sin cambios —cada peso actual, incluido el efectivo, es uno que el registro seguiría eligiendo hoy partiendo de cero, ya que nada en las noticias macro de hoy es todavía lo bastante grande como para ser la dislocación para la que se reserva el efectivo. Se seguirá vigilando si la situación de Ormuz escala más allá de un rebrote, y si el rango posterior a resultados de NVDA se mantiene.",
        fr:"Cette revue d'environ 11h30 ET est la première avec les marchés actions ouverts depuis la clôture de vendredi — aujourd'hui est une séance normale du NYSE (la fête du Travail n'a lieu que le 7 septembre), donc NVDA et SPY reçoivent des cotations en direct pour la première fois depuis vendredi.\n\nLe facteur dominant aujourd'hui est macro, pas spécifique à une action. Pendant le week-end, les États-Unis et l'Iran ont échangé de nouvelles frappes près du détroit d'Ormuz — l'armée américaine a frappé des lance-roquettes iraniens qui, selon les informations, se préparaient à poser des mines dans le détroit — ravivant un conflit qui s'est enflammé par intermittence depuis février. Le brut a bondi d'environ 2 % à l'ouverture sur cette nouvelle. Ajouté aux propos très faucons du président de la Fed, Kevin Warsh, à Jackson Hole vendredi dernier, qui ont poussé les probabilités du FedWatch du CME d'une hausse de 25 points de base en septembre à environ 57-60 %, contre environ 35 % avant son discours, cette combinaison produit une ambiance d'aversion au risque large et de faible conviction : 10 des 11 secteurs du S&P sont en baisse, menés par les services publics et les communications, sensibles aux taux, tandis que l'énergie est le seul secteur en hausse grâce à la flambée du pétrole. Les grandes valeurs technologiques (Microsoft, Alphabet, Tesla, Palantir) fléchissent par sympathie avec le marché, pas sur des nouvelles propres à l'entreprise.\n\nNVDA se négocie autour de 216,90 $, en légère baisse par rapport à la clôture de vendredi à 218,60 $, suivant le repli technologique général plutôt qu'un élément propre à l'entreprise — les véritables nouvelles NVIDIA du jour sont d'ailleurs constructives : une collaboration approfondie avec MediaTek assortie d'un investissement de 3,5 milliards de dollars, et Jensen Huang sur scène aux côtés de Michael Dell à Dell TechWorld pour présenter le partenariat AI Factory. Rien ici ne remet en cause l'histoire de la pause du partenariat après résultats de la semaine dernière, ni la thèse de croissance des centres de données. La position vaut environ 262,93 $, ~25,4 % du portefeuille, un poids pratiquement inchangé depuis vendredi et confortablement sous le plafond de 35 %. Elle reste au-dessus de la fourchette pré-résultats d'environ 212-213 $ qui signalerait une réduction supplémentaire, et ne s'est pas encore stabilisée ou n'a pas formé de base assez longtemps pour justifier de racheter la portion réduite après la nouvelle de la pause du partenariat — les deux seuils hérités des revues précédentes restent inchangés, donc aucune action dans un sens ou dans l'autre aujourd'hui.\n\nSPY est à environ 770,50 $, en baisse d'environ 0,5 % en intraday — une fluctuation dictée par les gros titres, liée à l'histoire Iran/pétrole et à la recalibration faucon des taux, pas une cassure technique de quoi que ce soit. La position vaut environ 250,26 $, ~24,2 % du portefeuille, conforme à l'objectif. Un mouvement d'une seule journée d'environ 0,5 % sur des gros titres géopolitiques n'est pas le type de dislocation pour lequel la réserve de liquidités est conservée ; ce qui compterait serait une véritable frayeur de croissance durable induite par le pétrole — le WTI revenant vers les sommets de 100-116 $ produits par cette crise en avril — plutôt que le bond d'environ 2 % d'aujourd'hui, qui ressemble pour l'instant à une reprise d'un conflit existant plutôt qu'à une nouvelle escalade.\n\nLe Bitcoin est pratiquement stable autour de 78 450 $ contre 78 700 $ à la clôture de dimanche. Le sentiment s'est refroidi, passant des lectures de cupidité dans la zone haute des 60 en début de semaine à un 51 neutre sur l'indice Peur et Cupidité, cohérent avec la même recalibration de hausse des taux qui pèse largement sur les actifs à risque plutôt qu'avec quoi que ce soit de spécifique aux cryptomonnaies. La position vaut environ 207,89 $, ~20,1 % du portefeuille, exactement à l'objectif de 20 %, sans déclencheur de rééquilibrage. Les niveaux d'invalidation hérités des revues précédentes restent inchangés : une clôture sous la moyenne mobile à 200 jours (~74 168 $) et le coût de base des détenteurs à court terme (~67 100 $) renverserait la thèse haussière quel que soit le dimensionnement de la position ; le prix du jour reste confortablement au-dessus des deux.\n\nAu final : aucune opération aujourd'hui. La VNI s'établit à environ 1 033,23 $, en légère baisse par rapport à la clôture de dimanche à 1 037,28 $, la faiblesse actions induite par l'Iran et la Fed l'emportant sur une valorisation du Bitcoin pratiquement stable. La trésorerie reste à 312,15 $ (~30,2 %), inchangée — chaque poids actuel, trésorerie comprise, est un poids que le journal choisirait encore aujourd'hui en repartant de zéro, puisque rien dans les nouvelles macro du jour n'est encore assez important pour constituer la dislocation pour laquelle la réserve est conservée. À surveiller : si la situation du détroit d'Ormuz dépasse une simple reprise du conflit existant pour devenir une nouvelle escalade, et si la fourchette post-résultats de NVDA tient."
      }

        en:"This ~15:00 ET pre-close check, which settles today's official NAV, continues this morning's ~11:30 ET review (LOG-045) — the macro backdrop is essentially the same set of forces, just with a few more hours to develop.\n\nNVDA has actually firmed since this morning, last near $217.55 versus the 11:30 read of $216.90 and Friday's $218.60 close — a modest recovery inside today's broader tech pullback, with a day range of $216.81-$220.60. Nothing new from the company since this morning: the MediaTek collaboration and Dell TechWorld appearance remain the extent of today's news, and neither challenges the post-earnings partnership-pause story or the data-center growth thesis. The position is worth about $263.71, ~25.5% of the book, essentially flat in weight and comfortably inside the 35% cap. It remains above the ~$212-213 pre-earnings range that would flag further trimming, and still hasn't based long enough to justify buying back the trimmed portion — both thresholds carried forward from prior checks, so no action either way today.\n\nSPY has drifted lower through the session, last around $765.88 (~-0.45% on the day), down from this morning's $770.50 and Friday's $771.10 close. The S&P 500 itself closed down about 0.3%, with 10 of 11 sectors lower and energy the lone gainer as WTI crude pushed above $86, up roughly 2.6-3% on the day — its sharpest move since the weekend's Hormuz strikes. The Strait of Hormuz remains effectively shut to commercial traffic: Iran says it stays closed absent a return to the earlier deal, though Oman has floated a temporary shipping-corridor proposal and Qatar's PM is due in Tehran Thursday for de-escalation talks. None of this is new information beyond what this morning's check already priced in; a single session's ~0.7% pullback on a now-familiar geopolitical story is not the dislocation the cash reserve is held for. That would take a genuine, sustained growth scare — WTI back toward the $100-116 highs this crisis produced in April — not today's move. The position is worth about $248.76, ~24.1% of the book, still in line with target.\n\nBTC has ticked up modestly to about $78,700 (quotes range roughly $78,100-$79,500 across venues) from this morning's $78,450, with the Fear & Greed Index still Neutral in the low-to-mid 50s, essentially unchanged from the 51 reading at 11:30 — the same rate-repricing pressure noted this morning, not a crypto-specific move. CME FedWatch odds of a September hike have ticked up further to roughly 60%, from the 57-60% range this morning. The position is worth about $208.56, ~20.2% of the book, still at the 20% target with no rebalancing trigger. The invalidation levels carried forward stand unchanged: a close back below the 200-day moving average (~$74,168) and the short-term-holder cost basis (~$67,100) would overturn the bullish stance regardless of what position sizing allows; today's price sits comfortably above both.\n\nNet: no trade today, in either check. NAV settles at about $1,033.18, essentially unchanged from this morning's $1,033.23 and modestly below Sunday's $1,037.28 close, as a slightly softer equity mark roughly offsets a slightly firmer crypto one. Cash holds at $312.15 (~30.2%), unchanged — every current weight, cash included, is one the log would still choose today starting from scratch, since nothing in today's session cleared the bar for the dislocation the reserve is held for. Still watching the same two things flagged this morning: whether the Hormuz situation escalates past today's re-flare, and whether NVDA's post-earnings range holds.",
        es:"Esta revisión previa al cierre de aproximadamente las 15:00 ET, que liquida el NAV oficial de hoy, continúa la revisión de esta mañana en torno a las 11:30 ET (LOG-045) —el trasfondo macro es esencialmente el mismo conjunto de fuerzas, solo con unas horas más para desarrollarse.\n\nNVDA en realidad se ha afirmado desde esta mañana, cotizando por última vez cerca de $217.55 frente a la lectura de las 11:30 de $216.90 y el cierre del viernes de $218.60 —una recuperación moderada dentro del retroceso tecnológico más amplio de hoy, con un rango diario de $216.81–$220.60. No hay nada nuevo por parte de la empresa desde esta mañana: la colaboración con MediaTek y la aparición en Dell TechWorld siguen siendo la totalidad de las noticias de hoy, y ninguna de las dos cuestiona la historia de la pausa de la asociación posterior a resultados ni la tesis de crecimiento de los centros de datos. La posición vale ahora unos $263.71, ~25.5% de la cartera, con un peso prácticamente sin cambios y cómodamente dentro del límite del 35%. Sigue por encima del rango previo a resultados de aproximadamente $212–213 que señalaría una reducción adicional, y todavía no se ha consolidado el tiempo suficiente para justificar recomprar la parte reducida anteriormente —ambos umbrales heredados de revisiones previas, así que hoy no hay acción en ningún sentido.\n\nSPY ha ido cediendo a lo largo de la sesión, cotizando por última vez cerca de $765.88 (baja de aproximadamente 0.45% en el día), por debajo de los $770.50 de esta mañana y del cierre del viernes de $771.10. El propio índice S&P 500 cerró con una baja de aproximadamente 0.3%, con 10 de los 11 sectores a la baja y energía como el único sector al alza, impulsado por el petróleo WTI que superó los $86 (un alza de aproximadamente 2.6%–3% en el día, su mayor movimiento diario desde los ataques del fin de semana en el estrecho de Ormuz). El estrecho de Ormuz permanece efectivamente cerrado al tráfico comercial —Irán dice que seguirá así a menos que EE. UU. vuelva al acuerdo anterior, aunque Omán ha propuesto un corredor de navegación temporal y el primer ministro de Catar tiene previsto viajar a Teherán el jueves para conversaciones de distensión. Nada de esto es información nueva más allá de lo que ya incorporó la revisión de esta mañana; un retroceso de aproximadamente 0.7% en una sola sesión, sobre una historia geopolítica ya conocida por el mercado, no es el tipo de dislocación para la que se reserva el efectivo. Lo que realmente importaría sería un temor de crecimiento genuino y sostenido impulsado por el petróleo —el WTI volviendo hacia los máximos de $100–116 que produjo esta crisis en abril— en lugar de un movimiento como el de hoy. La posición vale unos $248.76, ~24.1% de la cartera, todavía en línea con el objetivo.\n\nBitcoin ha subido modestamente desde los $78,450 de esta mañana hasta unos $78,700 (con cotizaciones de $78,100–$79,500 según la plataforma), con el Índice de Miedo y Codicia todavía en la zona neutral de poco más de 50, prácticamente igual que el 51 de las 11:30 —una continuación de la misma presión de la recalibración de tasas sobre los activos de riesgo, no algo específico de las criptomonedas. Las probabilidades del FedWatch de CME de una subida en septiembre subieron aún más hasta cerca del 60%, desde el rango de 57%–60% de esta mañana. La posición vale unos $208.56, ~20.2% de la cartera, todavía en el objetivo del 20%, sin disparador de reequilibrio. Los niveles de invalidación heredados de revisiones anteriores se mantienen sin cambios: un cierre por debajo de la media móvil de 200 días (~$74,168) y de la base de costo de los tenedores de corto plazo (~$67,100) revertiría la postura alcista sin importar el dimensionamiento de la posición; el precio de hoy se mantiene cómodamente por encima de ambos.\n\nEn conjunto: sin operaciones hoy, en ninguna de las dos revisiones. El NAV se liquida en unos $1,033.18, prácticamente igual a los $1,033.23 de esta mañana, y con una baja moderada frente al cierre del domingo de $1,037.28, ya que la ligera caída del lado accionario compensa aproximadamente el ligero fortalecimiento del lado cripto. El efectivo se mantiene en $312.15 (~30.2%), sin cambios —cada peso actual, incluido el efectivo, es uno que el registro seguiría eligiendo hoy partiendo de cero, ya que el mercado de hoy todavía no alcanza el umbral de la dislocación genuina para la que se reserva el efectivo. Se seguirán vigilando los dos puntos señalados esta mañana: si la situación de Ormuz escala más allá del rebrote de hoy, y si el rango posterior a resultados de NVDA se mantiene.",
        fr:"Cette revue avant clôture d'environ 15h00 ET, qui règle la VNI officielle du jour, prolonge la revue de ce matin vers 11h30 ET (LOG-045) — le contexte macro reste essentiellement le même ensemble de forces, avec simplement quelques heures de plus pour se développer.\n\nNVDA s'est en fait raffermi depuis ce matin, se négociant en dernier autour de 217,55 $ contre 216,90 $ lors du contrôle de 11h30 et 218,60 $ à la clôture de vendredi — une modeste reprise au sein du repli technologique plus large d'aujourd'hui, avec une fourchette journalière de 216,81–220,60 $. Rien de nouveau du côté de l'entreprise depuis ce matin : la collaboration avec MediaTek et l'apparition à Dell TechWorld restent l'intégralité des nouvelles du jour, et aucune des deux ne remet en cause l'histoire de la pause du partenariat après résultats ni la thèse de croissance des centres de données. La position vaut désormais environ 263,71 $, ~25,5 % du portefeuille, un poids pratiquement inchangé et confortablement sous le plafond de 35 %. Elle reste au-dessus de la fourchette pré-résultats d'environ 212–213 $ qui signalerait une réduction supplémentaire, et ne s'est toujours pas stabilisée assez longtemps pour justifier de racheter la portion réduite précédemment — les deux seuils hérités des revues précédentes, donc aucune action dans un sens ou dans l'autre aujourd'hui.\n\nLe SPY a cédé du terrain tout au long de la séance, se négociant en dernier autour de 765,88 $ (en baisse d'environ 0,45 % sur la journée), en dessous des 770,50 $ de ce matin et de la clôture de vendredi à 771,10 $. Le S&P 500 lui-même a clôturé en baisse d'environ 0,3 %, avec 10 des 11 secteurs en repli et l'énergie comme seul secteur en hausse, porté par le WTI qui a dépassé 86 $ (en hausse d'environ 2,6–3 % sur la journée, son plus fort mouvement journalier depuis les frappes du week-end dans le détroit d'Ormuz). Le détroit d'Ormuz reste dans les faits fermé au trafic commercial — l'Iran affirme qu'il le restera tant que les États-Unis ne reviendront pas à l'accord précédent, bien qu'Oman ait proposé un corridor maritime temporaire et que le Premier ministre du Qatar doive se rendre jeudi à Téhéran pour des discussions de désescalade. Rien de tout cela ne constitue une information nouvelle au-delà de ce que la revue de ce matin avait déjà intégré ; un repli d'environ 0,7 % sur une seule séance, sur une histoire géopolitique désormais familière, n'est pas le type de dislocation pour lequel la réserve de liquidités est conservée. Ce qui compterait vraiment serait une véritable frayeur de croissance durable induite par le pétrole — le WTI revenant vers les sommets de 100–116 $ produits par cette crise en avril — plutôt que le mouvement d'aujourd'hui. La position vaut environ 248,76 $, ~24,1 % du portefeuille, toujours conforme à l'objectif.\n\nLe Bitcoin a progressé modestement depuis les 78 450 $ de ce matin jusqu'à environ 78 700 $ (avec des cotations de 78 100–79 500 $ selon les plateformes), l'indice Peur et Cupidité restant dans la zone neutre, un peu au-dessus de 50, pratiquement inchangé par rapport au 51 du contrôle de 11h30 — une continuation de la même pression de recalibration des taux sur les actifs à risque, pas un mouvement propre aux cryptomonnaies. Les probabilités du FedWatch du CME d'une hausse en septembre ont encore grimpé à environ 60 %, contre la fourchette de 57–60 % de ce matin. La position vaut environ 208,56 $, ~20,2 % du portefeuille, toujours à l'objectif de 20 %, sans déclencheur de rééquilibrage. Les niveaux d'invalidation hérités des revues précédentes restent inchangés : une clôture sous la moyenne mobile à 200 jours (~74 168 $) et le coût de revient des détenteurs à court terme (~67 100 $) renverserait la thèse haussière quel que soit le dimensionnement de la position ; le prix du jour reste confortablement au-dessus des deux.\n\nAu final : aucune opération aujourd'hui, dans aucune des deux revues. La VNI se règle à environ 1 033,18 $, pratiquement inchangée par rapport aux 1 033,23 $ de ce matin, et en légère baisse par rapport à la clôture de dimanche à 1 037,28 $, la légère faiblesse du côté actions compensant à peu près le léger raffermissement du côté crypto. La trésorerie reste à 312,15 $ (~30,2 %), inchangée — chaque poids actuel, trésorerie comprise, est un poids que le journal choisirait encore aujourd'hui en repartant de zéro, puisque le marché d'aujourd'hui n'a pas encore atteint le seuil de la dislocation véritable pour laquelle la réserve est conservée. Les deux points signalés ce matin restent surveillés : si la situation d'Ormuz dépasse la reprise du jour pour devenir une nouvelle escalade, et si la fourchette post-résultats de NVDA tient."

function L(field){
  if (field && typeof field === 'object' && ('zh' in field || 'en' in field || 'es' in field || 'fr' in field)) {
    return field[currentLang] ?? field.en ?? field.zh ?? '';
  }
  return field;
}

const fmtUSD = (n, d=2) => '$' + n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtPct = (n) => (n>=0?'+':'') + n.toFixed(2) + '%';
const fmtQty = (n, d) => n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});

function getNextCheckInfo(){
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hour: 'numeric', minute: 'numeric', hour12: false
  }).formatToParts(new Date());
  let h = parseInt(parts.find(p=>p.type==='hour').value, 10);
  const m = parseInt(parts.find(p=>p.type==='minute').value, 10);
  if (h === 24) h = 0;
  const nowMin = h*60 + m;
  const morningMin = 11*60 + 30, closeMin = 15*60;
  if (nowMin < morningMin) return { time:'11:30', today:true };
  if (nowMin < closeMin) return { time:'15:00', today:true };
  return { time:'11:30', today:false };
}

const ASSET_COLORS = {NVDA:'#ffb400', SPY:'#5eead4', BTC:'#f0a35c', CASH:'#3a4b4e'};
function colorFor(sym){ return ASSET_COLORS[sym] || '#7c8e90'; }
function qtyDecimalsFor(sym){
  const h = ALPHA_DATA.holdings.find(x=>x.symbol===sym);
  return h ? h.qtyDecimals : 4;
}

function computeHoldings(){
  return ALPHA_DATA.holdings.map(h=>{
    const marketValue = h.shares * h.currentPrice;
    const costValue = h.shares * h.avgCost;
    const pnl = marketValue - costValue;
    const pnlPct = costValue !== 0 ? (pnl/costValue*100) : 0;
    return {...h, marketValue, costValue, pnl, pnlPct};
  });
}

function computeTotals(){
  const holdings = computeHoldings();
  const holdingsValue = holdings.reduce((s,h)=>s+h.marketValue,0);
  const totalValue = holdingsValue + ALPHA_DATA.cash;
  const totalPnl = totalValue - ALPHA_DATA.meta.initialCapital;
  const totalPnlPct = totalPnl / ALPHA_DATA.meta.initialCapital * 100;
  return {holdings, holdingsValue, totalValue, totalPnl, totalPnlPct};
}

function computeDailyChange(totalValue){
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit'
  }).format(new Date());
  const priorSnaps = ALPHA_DATA.snapshots.filter(s => s.date < parts);
  if (priorSnaps.length === 0) return null;
  const baseline = priorSnaps[priorSnaps.length - 1].totalValue;
  if (!baseline) return null;
  const change = totalValue - baseline;
  return { change, changePct: change / baseline * 100 };
}

function renderStats(totals){
  const t = I18N[currentLang];
  const {totalValue, holdingsValue, totalPnl, totalPnlPct} = totals;
  const cls = totalPnl>0?'up':(totalPnl<0?'down':'flat');
  const daily = computeDailyChange(totalValue);
  const dailyCls = !daily ? 'flat' : (daily.change>0?'up':(daily.change<0?'down':'flat'));
  const dailyStat = !daily
    ? {label:t.statDailyChange, value:'—', sub:t.dailyChangeNA}
    : {label:t.statDailyChange, value:`<span class="${dailyCls}">${fmtPct(daily.changePct)}</span>`, sub:`<span class="${dailyCls}">${daily.change>=0?'+':''}${fmtUSD(daily.change)}</span> ${t.dailyChangeSub}`};
  const stats = [
    {label:t.statTotalValue, value:fmtUSD(totalValue), sub:t.statTotalValueSub},
    {label:t.statTotalReturn, value:`<span class="${cls}">${fmtPct(totalPnlPct)}</span>`, sub:`<span class="${cls}">${totalPnl>=0?'+':''}${fmtUSD(totalPnl)}</span>`},
    dailyStat,
    {label:t.statCash, value:fmtUSD(ALPHA_DATA.cash), sub:t.pctOfPortfolio((ALPHA_DATA.cash/totalValue*100).toFixed(1))},
    {label:t.statInvested, value:fmtUSD(holdingsValue), sub:t.pctOfPortfolio((holdingsValue/totalValue*100).toFixed(1))},
    {label:t.statDays, value:t.dayN(ALPHA_DATA.meta.dayCount), sub:t.tradesTotal(ALPHA_DATA.trades.length, countTrades())}
  ];
  document.getElementById('statsGrid').innerHTML = stats.map(s=>`
    <div class="stat-card">
      <div class="label">${s.label}</div>
      <div class="value">${s.value}</div>
      <div class="sub">${s.sub}</div>
    </div>
  `).join('');
}

  document.getElementById('secWatchTitle').textContent = t.secWatch;
  document.getElementById('watchNoteText').textContent = t.watchNote;
  document.getElementById('secTradeLogTitle').textContent = t.secTradeLog;
  document.getElementById('secPrinciplesTitle').textContent = t.secPrinciples;
  document.getElementById('principlesNoteText').textContent = t.principlesNote;
  const nextCheck = getNextCheckInfo();
  document.getElementById('cursorText').textContent = t.cursorLine(nextCheck.time, nextCheck.today ? t.todayLabel : t.tomorrowLabel);
  document.getElementById('baselineNote').innerHTML = `<span class="swatch"></span> ${t.baselineNote}`;
  document.getElementById('holdingsThead').innerHTML = `
    <tr><th>${t.thAsset}</th><th>${t.thType}</th><th>${t.thQty}</th><th>${t.thAvgCost}</th><th>${t.thPrice}</th><th>${t.thMktValue}</th><th>${t.thPnl}</th><th>${t.thWeight}</th></tr>
  `;
}

function renderHoldings(totals){
  const t = I18N[currentLang];
  const {holdings, totalValue} = totals;
  document.getElementById('holdingsNote').textContent = t.holdingsNote(ALPHA_DATA.meta.lastUpdated);
  document.getElementById('holdingsBody').innerHTML = holdings.map(h=>{
    const pnlCls = h.pnl>0?'up':(h.pnl<0?'down':'flat');
    const weight = (h.marketValue/totalValue*100).toFixed(1);
    return `
      <tr>
        <td><div class="sym"><b>${h.symbol}</b><span>${h.name}</span></div></td>
        <td><span class="type-pill">${L(h.type)}</span></td>
        <td>${fmtQty(h.shares, h.qtyDecimals)}</td>
        <td>${fmtUSD(h.avgCost)}</td>
        <td>${fmtUSD(h.currentPrice)}</td>
        <td>${fmtUSD(h.marketValue)}</td>
        <td class="${pnlCls}">${h.pnl>=0?'+':''}${fmtUSD(h.pnl)} (${fmtPct(h.pnlPct)})</td>
        <td>${weight}%</td>
      </tr>
    `;
  }).join('') + `
    <tr>
      <td><div class="sym"><b>${t.cashRowLabel}</b><span>${t.cashRowSub}</span></div></td>
      <td><span class="type-pill">${t.cashRowLabel}</span></td>
      <td colspan="4" style="color:var(--text-faint)">—</td>
      <td>${fmtUSD(ALPHA_DATA.cash)}</td>
      <td>${(ALPHA_DATA.cash/totalValue*100).toFixed(1)}%</td>
    </tr>
  `;
}

function renderAllocation(totals){
  const {holdings, totalValue} = totals;
  const t = I18N[currentLang];
  const labels = [...holdings.map(h=>h.symbol), t.cashRowLabel];
  const values = [...holdings.map(h=>h.marketValue), ALPHA_DATA.cash];
  const colors = [...holdings.map(h=>colorFor(h.symbol)), colorFor('CASH')];

  if (allocChartInstance) allocChartInstance.destroy();
  allocChartInstance = new Chart(document.getElementById('allocChart'), {
    type:'doughnut',
    data:{ labels, datasets:[{ data:values, backgroundColor:colors, borderColor:'#10171a', borderWidth:3 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      cutout:'68%',
      plugins:{ legend:{display:false}, tooltip:{
        backgroundColor:'#141d20', borderColor:'#213032', borderWidth:1,
        titleFont:{family:'IBM Plex Mono'}, bodyFont:{family:'IBM Plex Mono'},
        callbacks:{ label:(ctx)=> ` ${fmtUSD(ctx.parsed)} (${(ctx.parsed/totalValue*100).toFixed(1)}%)` }
      }}
    }
  });

  document.getElementById('allocLegend').innerHTML = labels.map((l,i)=>`
    <div class="alloc-row">
      <span class="l"><span class="sw" style="background:${colors[i]}"></span>${l}</span>
      <span class="v">${(values[i]/totalValue*100).toFixed(1)}%</span>
    </div>
  `).join('');
}

function renderWatchlist(){
  document.getElementById('watchGrid').innerHTML = ALPHA_DATA.watchlist.map(w=>`
    <div class="watch-card">
      <span class="watch-status hold">${L(w.status)}</span>
      <div class="wh"><b>${w.symbol}</b><span class="px">${L(w.price)}</span></div>
      <p>${L(w.note)}</p>
    </div>
  `).join('');
}

function renderTradeLog(){
  const t = I18N[currentLang];
  document.getElementById('tradeNote').textContent = t.tradeNote(ALPHA_DATA.trades.length);
  const allTrades = [...ALPHA_DATA.trades].reverse();
  const trades = logExpanded ? allTrades : allTrades.slice(0, LOG_PAGE_SIZE);
  document.getElementById('tradeLog').innerHTML = trades.map((tr, i)=>{
    const idx = ALPHA_DATA.trades.length - i;
    const id = 'LOG-' + String(idx).padStart(3,'0');
    const badgeLabel = tr.action==='buy' ? t.badgeBuy : tr.action==='sell' ? t.badgeSell : t.badgeHold;
    const mainBlock = tr.action==='hold' ? `
        <div class="log-main">
          <div class="who"><b>${t.holdLabel}</b></div>
          <div class="calc">${t.navAtCheckLabel}<br><b>${fmtUSD(tr.navAtCheck)}</b></div>
        </div>
      ` : `
        <div class="log-main">
          <div class="who"><b>${tr.symbol}</b><span>${tr.name}</span></div>
          <div class="calc">
            ${fmtQty(tr.shares, qtyDecimalsFor(tr.symbol))} × ${fmtUSD(tr.price)} = <b>${fmtUSD(tr.amount)}</b><br>
            ${t.cashAfterLabel} ${fmtUSD(tr.cashAfter)}
          </div>
        </div>
      `;
    return `
      <div class="log-entry ${tr.action}" id="${id}">
        <div class="log-top">
          <span class="log-id">${id}</span>
          <span class="log-date">${tr.date} · ${L(tr.time)}</span>
          <span class="badge ${tr.action}">${badgeLabel}</span>
        </div>
        ${mainBlock}
        <div class="log-reason">
          <div class="reason-label">${t.reasonLabel}</div>
          <div class="log-reason-text" id="reason-${id}">${L(tr.reason)}</div>
          <button type="button" class="reason-toggle" data-target="reason-${id}">${t.reasonExpand}</button>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.log-reason-text').forEach(el => {
    const toggle = el.nextElementSibling;
    if (el.scrollHeight <= el.clientHeight + 1) toggle.style.display = 'none';
  });

  const hiddenCount = allTrades.length - trades.length;
  const moreRow = document.getElementById('logMoreRow');
  if (allTrades.length <= LOG_PAGE_SIZE) {
    moreRow.innerHTML = '';
  } else if (logExpanded) {
    moreRow.innerHTML = `<button type="button" class="log-more-btn" id="logMoreBtn">${t.logShowLess}</button>`;
  } else {
    moreRow.innerHTML = `<button type="button" class="log-more-btn" id="logMoreBtn">${t.logShowMore(hiddenCount)}</button>`;
  }
}

function renderNavChart(){
  const t = I18N[currentLang];
  const labels = ALPHA_DATA.snapshots.map(s=>L(s.label));
  const data = ALPHA_DATA.snapshots.map(s=>s.totalValue);
  document.getElementById('chartNote').textContent = t.chartNote(ALPHA_DATA.snapshots.length);

  if (navChartInstance) navChartInstance.destroy();
  navChartInstance = new Chart(document.getElementById('navChart'), {
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'nav',
          data,
          borderColor:'#ffb400',
          backgroundColor:'rgba(255,180,0,0.08)',
          pointBackgroundColor:'#ffb400',
          pointBorderColor:'#0a0e0f',
          pointRadius:5,
          pointHoverRadius:7,
          borderWidth:2,
          fill:true,
          tension:0.25
        },
        {
          label:'baseline',
          data:labels.map(()=>ALPHA_DATA.meta.initialCapital),
          borderColor:'#4e6567',
          borderDash:[4,4],
          borderWidth:1,
          pointRadius:0,
          fill:false
        }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#141d20', borderColor:'#213032', borderWidth:1,
          titleFont:{family:'IBM Plex Mono', size:11}, bodyFont:{family:'IBM Plex Mono', size:12},
          callbacks:{ label:(ctx)=> ctx.datasetIndex===0 ? ` ${t.navTooltip}${fmtUSD(ctx.parsed.y)}` : ` ${t.baselineTooltip}${fmtUSD(ctx.parsed.y)}` }
        }
      },
      scales:{
        x:{ grid:{color:'#1a2528'}, ticks:{color:'#8ba0a2', font:{family:'IBM Plex Mono', size:11}} },
        y:{ grid:{color:'#1a2528'}, ticks:{color:'#8ba0a2', font:{family:'IBM Plex Mono', size:11}, callback:(v)=>fmtUSD(v,0)} }
      }
    }
  });
}

function renderPrinciples(){
  const t = I18N[currentLang];
  document.getElementById('principles').innerHTML = t.principles.map(p=>`
    <div class="principle">
      <div class="n">${p.n}</div>
      <h3>${p.h}</h3>
      <p>${p.p}</p>
    </div>
  `).join('');
}

function renderSubscribe(){
  const t = I18N[currentLang];
  document.getElementById('subscribeTitle').textContent = t.subscribeTitle;
  document.getElementById('subscribeNote').textContent = t.subscribeNote;
  document.getElementById('subscribeLabel').textContent = t.subscribeLabel;
  document.getElementById('subscribeSubmit').value = t.subscribeSubmit;
  document.getElementById('subscribePowered').textContent = t.subscribePowered;
}

function renderFooter(){
  const t = I18N[currentLang];
  document.getElementById('disclaimerText').innerHTML =
    `${t.disclaimerIntro} <b>${t.disclaimerLead}</b>${t.disclaimerRest}`;
  document.getElementById('footerMeta').innerHTML = `
    <span>${t.footerInception} ${ALPHA_DATA.meta.startDate}</span>
    <span>${t.footerLastUpdated} ${ALPHA_DATA.meta.lastUpdated}</span>
    <span>${t.footerInitialCapital} ${fmtUSD(ALPHA_DATA.meta.initialCapital)}</span>
  `;
}

function renderAll(){
  const t = I18N[currentLang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.title;
  renderLangSwitch();

  const totals = computeTotals();
  renderStatusbar();
  renderHero(totals);
  renderStats(totals);
  renderSectionChrome();
  renderHoldings(totals);
  renderAllocation(totals);
  renderWatchlist();
  renderTradeLog();
  renderNavChart();
  renderPrinciples();
  renderSubscribe();
  renderFooter();
}

document.getElementById('langSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('.lang-btn');
  if (!btn) return;
  currentLang = btn.dataset.lang;
  renderAll();
});

document.getElementById('tradeLog').addEventListener('click', (e) => {
  const btn = e.target.closest('.reason-toggle');
  if (!btn) return;
  const t = I18N[currentLang];
  const textEl = document.getElementById(btn.dataset.target);
  const expanded = textEl.classList.toggle('expanded');
  btn.textContent = expanded ? t.reasonCollapse : t.reasonExpand;
});

document.getElementById('logMoreRow').addEventListener('click', (e) => {
  const btn = e.target.closest('#logMoreBtn');
  if (!btn) return;
  logExpanded = !logExpanded;
  renderTradeLog();
});

renderAll();
</script>

<script>
/* ======================================================================
   Subscribe-box funnel (Umami custom events)

   The useful conversion rate is "of the people who actually reached the
   subscribe box, how many submitted" — not submissions over pageviews, which
   mostly measures whether people scroll. So the box reports being seen, and
   the form reports being submitted, and both carry the same source string.

   Every call is optional-chained and wrapped: cloud.umami.is is blocked by
   most ad blockers, so window.umami is simply absent for a good share of
   visitors. Subscribing must keep working when it is.
   ====================================================================== */
(function(){
  function signupSource(){
    try {
      const q = new URLSearchParams(location.search);
      const tagged = q.get('utm_source') || q.get('ref');
      if (tagged) return tagged.slice(0, 40);
      if (!document.referrer) return 'direct';
      const host = new URL(document.referrer).hostname.replace(/^www\./, '');
      return host === location.hostname ? 'internal' : host.slice(0, 40);
    } catch (e) { return 'unknown'; }
  }

  function track(name, data){
    try { window.umami && window.umami.track(name, data); } catch (e) {}
  }

  const source = signupSource();

  const hidden = document.getElementById('bdSignupSource');
  if (hidden) hidden.value = source;

  const form = document.getElementById('subscribeForm');
  if (!form) return;

  // Fired once, the first time the box is actually on screen.
  if ('IntersectionObserver' in window) {
    let seen = false;
    const io = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting || seen) continue;
        seen = true;
        io.disconnect();
        track('subscribe-view', { source: source });
      }
    }, { threshold: 0.5 });
    io.observe(form);
  }

  // Not preventDefault'd on purpose: the form posts to Buttondown and the page
  // navigates away. Blocking that to wait on an analytics call would risk the
  // conversion itself, which is a far worse trade than losing some events.
  form.addEventListener('submit', function(){
    track('subscribe-submit', { source: source });
  });
})();
</script>
