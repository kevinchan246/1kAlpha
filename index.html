<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1KAlpha · AI Trader Simulation Terminal</title>
<meta name="description" content="1KAlpha is a transparent, publicly logged AI trading simulation starting from $1,000 — every buy, sell, and hold decision documented with the real-market reasoning behind it.">
<link rel="canonical" href="https://1kalpha.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e0f;
    --bg-panel:#10171a;
    --bg-panel-2:#141d20;
    --bg-raised:#182225;
    --border:#213032;
    --border-soft:#1a2528;
    --text:#e7edee;
    --text-dim:#8ba0a2;
    --text-faint:#4e6567;
    --amber:#ffb400;
    --amber-dim:#8a640e;
    --teal:#5eead4;
    --green:#34d399;
    --green-dim:#1a5c46;
    --red:#f87171;
    --red-dim:#5c2626;
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
    --sans:'IBM Plex Sans SC','IBM Plex Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg);}
  body{
    background:
      radial-gradient(ellipse 1200px 600px at 15% -10%, rgba(255,180,0,0.06), transparent 60%),
      radial-gradient(ellipse 1000px 800px at 100% 0%, rgba(94,234,212,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    padding-bottom:60px;
    min-height:100vh;
  }
  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px; position:relative; z-index:2;}

  /* ---------- header ---------- */
  header.term{
    border-bottom:1px solid var(--border);
    padding:22px 0 26px;
    margin-bottom:28px;
  }
  .statusbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--text-dim);
    margin-bottom:22px;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2.2s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .dot{animation:none;} }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .statusbar .sep{color:var(--border);}
  .statusbar b{color:var(--teal); font-weight:600;}

  .hero-left .brand{
    font-family:var(--mono); font-size:13px; color:var(--text-faint);
    letter-spacing:.16em; text-transform:uppercase; margin-bottom:10px;
  }
  .hero-left h1{
    font-family:var(--mono); font-weight:700;
    font-size:clamp(34px, 5.4vw, 62px);
    color:var(--text); letter-spacing:-0.01em;
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  }
  .hero-left h1 .delta{
    font-size:clamp(15px,2.2vw,22px); font-weight:600;
  }
  .hero-left .subline{
    margin-top:8px; font-size:14px; color:var(--text-dim);
  }
  .hero-controls{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px; margin-top:20px;
  }
  .tag-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-start;}
  .tag{
    font-family:var(--mono); font-size:11px; padding:5px 10px;
    border:1px solid var(--border); border-radius:3px; color:var(--text-dim);
    white-space:nowrap;
  }
  .tag.warn{border-color:var(--amber-dim); color:var(--amber);}

  .lang-switch{display:flex; gap:3px; padding:3px; border:1px solid var(--border); border-radius:5px; background:var(--bg-panel);}
  .lang-btn{
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.03em;
    padding:5px 10px; border-radius:3px; background:transparent; border:none;
    color:var(--text-faint); cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .lang-btn:hover{color:var(--text-dim);}
  .lang-btn.active{background:var(--amber); color:#0a0e0f;}
  .lang-btn:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}

  .up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--text-dim);}

  /* ---------- section headers ---------- */
  .sec-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin:44px 0 16px; flex-wrap:wrap;
  }
  .sec-head h2{
    font-family:var(--mono); font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text); font-weight:600;
    display:flex; align-items:center; gap:10px;
  }
  .sec-head h2::before{content:''; width:3px; height:14px; background:var(--amber); display:inline-block;}
  .sec-head .note{font-size:12px; color:var(--text-faint); font-family:var(--mono);}

  /* ---------- stat grid ---------- */
  .stats-grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border);
  }
  .stat-card{background:var(--bg-panel); padding:18px 18px 16px;}
  .stat-card .label{font-size:11px; color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px; font-family:var(--mono);}
  .stat-card .value{font-family:var(--mono); font-size:21px; font-weight:600; color:var(--text);}
  .stat-card .sub{font-size:11px; margin-top:6px; font-family:var(--mono); color:var(--text-dim);}
  @media (max-width:900px){ .stats-grid{grid-template-columns:repeat(2,1fr);} }

  /* ---------- panel ---------- */
  .panel{background:var(--bg-panel); border:1px solid var(--border); padding:20px;}

  /* ---------- chart ---------- */
  .chart-panel{padding:22px 22px 12px;}
  .chart-box{position:relative; height:320px;}
  .baseline-note{font-size:11px; color:var(--text-faint); font-family:var(--mono); margin-top:8px; display:flex; align-items:center; gap:6px;}
  .baseline-note .swatch{width:14px; height:0; display:inline-block; border-bottom:1px dashed var(--text-faint);}

  /* ---------- holdings / alloc grid ---------- */
  .grid-2{display:grid; grid-template-columns:1.55fr 1fr; gap:1px; background:var(--border); border:1px solid var(--border);}
  @media (max-width:860px){ .grid-2{grid-template-columns:1fr;} }
  .grid-2 > div{background:var(--bg-panel); padding:20px;}

  table{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13px;}
  th{
    text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-faint); font-weight:500; padding:0 10px 10px 0; border-bottom:1px solid var(--border);
  }
  td{padding:12px 10px 12px 0; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  .sym{display:flex; flex-direction:column; gap:2px;}
  .sym b{color:var(--text); font-size:13.5px; letter-spacing:.02em;}
  .sym span{color:var(--text-faint); font-size:11px; font-family:var(--sans);}
  .type-pill{
    display:inline-block; font-family:var(--sans); font-size:10px; padding:2px 7px;
    border-radius:10px; border:1px solid var(--border); color:var(--text-dim);
  }

  .alloc-legend{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .alloc-row{display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:12.5px;}
  .alloc-row .l{display:flex; align-items:center; gap:8px; color:var(--text-dim);}
  .alloc-row .sw{width:9px; height:9px; border-radius:2px;}
  .alloc-row .v{color:var(--text);}

  /* ---------- watchlist ---------- */
  .watch-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--border); border:1px solid var(--border);}
  @media (max-width:700px){ .watch-grid{grid-template-columns:1fr;} }
  .watch-card{background:var(--bg-panel); padding:18px 20px;}
  .watch-card .wh{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:10px; flex-wrap:wrap;}
  .watch-card .wh b{font-family:var(--mono); font-size:15px;}
  .watch-card .wh .px{font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .watch-card p{font-size:13px; color:var(--text-dim); line-height:1.65;}
  .watch-status{
    display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    padding:3px 8px; border-radius:2px; margin-bottom:10px; text-transform:uppercase;
  }
  .watch-status.hold{background:rgba(255,180,0,0.1); color:var(--amber); border:1px solid var(--amber-dim);}

  /* ---------- trade log ---------- */
  .log-entry{
    border:1px solid var(--border); background:var(--bg-panel);
    padding:18px 20px; margin-bottom:14px; position:relative;
  }
  .log-entry.buy{border-left:3px solid var(--green);}
  .log-entry.sell{border-left:3px solid var(--red);}
  .log-entry.hold{border-left:3px solid var(--text-faint);}
  .log-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
  .log-id{font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:.06em;}
  .log-date{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .badge{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.06em;
    padding:3px 9px; border-radius:2px;
  }
  .badge.buy{background:rgba(52,211,153,0.12); color:var(--green); border:1px solid var(--green-dim);}
  .badge.sell{background:rgba(248,113,113,0.12); color:var(--red); border:1px solid var(--red-dim);}
  .badge.hold{background:rgba(139,160,162,0.12); color:var(--text-dim); border:1px solid var(--border);}
  .log-main{
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;
    margin-bottom:12px;
  }
  .log-main .who b{font-family:var(--mono); font-size:16px;}
  .log-main .who span{font-size:12px; color:var(--text-faint); margin-left:8px;}
  .log-main .calc{font-family:var(--mono); font-size:13px; color:var(--text-dim); text-align:right;}
  .log-main .calc b{color:var(--text); font-size:14px;}
  .log-reason{
    background:var(--bg-panel-2); border:1px solid var(--border-soft); padding:12px 14px;
    font-size:13px; color:var(--text-dim); line-height:1.7; position:relative;
  }
  .reason-label{
    font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    color:var(--teal); text-transform:uppercase; margin-bottom:6px;
  }
  .cursor-line{
    font-family:var(--mono); font-size:12px; color:var(--text-faint); padding:6px 2px; display:flex; align-items:center; gap:8px;
  }
  .cursor-blink{width:7px; height:14px; background:var(--amber); animation:blink 1s step-end infinite;}
  @media (prefers-reduced-motion: reduce){ .cursor-blink{animation:none; opacity:.6;} }
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:0;}}

  /* ---------- philosophy ---------- */
  .principles{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border);}
  @media (max-width:860px){ .principles{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .principles{grid-template-columns:1fr;} }
  .principle{background:var(--bg-panel); padding:18px;}
  .principle .n{font-family:var(--mono); color:var(--amber); font-size:12px; margin-bottom:8px;}
  .principle h3{font-size:14px; margin-bottom:6px; color:var(--text);}
  .principle p{font-size:12.5px; color:var(--text-dim); line-height:1.6;}

  /* ---------- footer ---------- */
  footer{margin-top:56px; padding-top:22px; border-top:1px solid var(--border);}
  footer .disclaimer{
    font-size:12px; color:var(--text-faint); line-height:1.8; max-width:820px;
  }
  footer .disclaimer b{color:var(--text-dim);}
  footer .meta{
    margin-top:14px; font-family:var(--mono); font-size:11px; color:var(--text-faint);
    display:flex; gap:16px; flex-wrap:wrap;
  }

  ::selection{background:var(--amber); color:#0a0e0f;}

  @media (max-width:640px){
    .hero-controls{flex-direction:column; align-items:flex-start;}
    .lang-switch{align-self:flex-start;}
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="wrap">

  <header class="term">
    <div class="statusbar" id="statusbar"></div>
    <div class="hero-left">
      <div class="brand" id="brandText"></div>
      <h1 id="heroValue">—</h1>
      <div class="subline" id="heroSub"></div>
    </div>
    <div class="hero-controls">
      <div class="tag-row" id="heroTags"></div>
      <div class="lang-switch" id="langSwitch"></div>
    </div>
  </header>

  <section class="stats-grid" id="statsGrid"></section>

  <section class="sec-head">
    <h2 id="secNavTitle"></h2>
    <span class="note" id="chartNote"></span>
  </section>
  <div class="panel chart-panel">
    <div class="chart-box"><canvas id="navChart"></canvas></div>
    <div class="baseline-note" id="baselineNote"></div>
  </div>

  <section class="sec-head">
    <h2 id="secHoldingsTitle"></h2>
    <span class="note" id="holdingsNote"></span>
  </section>
  <div class="grid-2">
    <div>
      <div class="table-scroll">
        <table id="holdingsTable">
          <thead id="holdingsThead"></thead>
          <tbody id="holdingsBody"></tbody>
        </table>
      </div>
    </div>
    <div>
      <div class="chart-box" style="height:220px;"><canvas id="allocChart"></canvas></div>
      <div class="alloc-legend" id="allocLegend"></div>
    </div>
  </div>

  <section class="sec-head">
    <h2 id="secWatchTitle"></h2>
    <span class="note" id="watchNoteText"></span>
  </section>
  <div class="watch-grid" id="watchGrid"></div>

  <section class="sec-head">
    <h2 id="secTradeLogTitle"></h2>
    <span class="note" id="tradeNote"></span>
  </section>
  <div id="tradeLog"></div>
  <div class="cursor-line"><span class="cursor-blink"></span><span id="cursorText"></span></div>

  <section class="sec-head">
    <h2 id="secPrinciplesTitle"></h2>
    <span class="note" id="principlesNoteText"></span>
  </section>
  <div class="principles" id="principles"></div>

  <footer>
    <p class="disclaimer" id="disclaimerText"></p>
    <div class="meta" id="footerMeta"></div>
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script>
/* ======================================================================
   ALPHA_DATA — the only block to edit for a daily update.
   Runs every day (crypto trades 24/7; equities only trade on NYSE trading
   days — see holidays.json). Each new day:
   1) Append new trade(s) to trades[] (reason needs zh/en/es/fr). Stock/ETF
      buy/sell entries are only valid on NYSE trading days; crypto buy/sell
      is valid any day.
   2) Update currentPrice / avgCost / shares on each holdings[] entry.
      Crypto currentPrice updates every day; stock/ETF currentPrice only
      updates on NYSE trading days (frozen at last close otherwise).
   3) Update cash
   4) Append a snapshot to snapshots[] (label needs zh/en/es/fr) — once per
      calendar day, at the close check only
   5) Update meta.lastUpdated / meta.dayCount
   Free-text fields use {zh:"...", en:"...", es:"...", fr:"..."}.
   Proper nouns (tickers, company names) stay plain strings — identical
   across languages.

   No-action check-ins: when a scheduled review concludes no trade is
   warranted, append a trades[] entry with action:"hold" instead of
   "buy"/"sell". Shape:
     { date, time:{zh,en,es,fr}, action:"hold",
       navAtCheck: <total portfolio value at the moment of the check>,
       reason:{zh,en,es,fr} }
   (no symbol/name/shares/price/amount/cashAfter — those are buy/sell-only)

        en:"Q2 revenue, EBITDA, and full-year guidance all beat expectations, and the stock spiked to around $177 intraday — too large a single-day move to chase with a good risk/reward. The plan is to wait for a pullback toward the $150–160 breakout zone before reconsidering an entry, rather than chasing today's gap up.",

        en:"Two hours into Thursday's session, the disinflation narrative gets a second confirmation: July PPI came in flat month-over-month (4.7% year-over-year, below the 4.9% forecast), a day after CPI matched expectations — together they give the Fed more room to hold rates steady rather than react to the Iran-driven energy spike. Risk appetite is broadly firm: the S&P 500 has pushed to a fresh intraday record, up about 0.6%, and the Nasdaq is up roughly 0.8% on strength outside the AI-infrastructure names, while the Dow lags slightly (down about 0.1%) after Cisco and Cerebras both sold off on earnings — a reminder that not every AI-adjacent print is being rewarded right now. NVDA is essentially flat on the day near $222.80, holding the ground it gained Tuesday and Wednesday; the position remains right at the portfolio's 35% concentration ceiling, so even on a constructive tape there's no room to add, and nothing in Cisco's or Cerebras' results changes NVDA's own fundamentals. SPY is tracking the broader index higher. Oil eased for a second session (WTI down about 2% to $81, Brent down about 2% to $87) as the Strait of Hormuz standoff shows tentative signs of cooling — removing one of the inputs that had been pressuring risk assets earlier in the week. BTC remains stuck below $65,000 in the low-$63,000s with no crypto-specific catalyst, sitting out both the equity rally and the softer-oil, softer-inflation backdrop that would normally be constructive for it — flows stay directionless. ABNB has pulled back to around $180, narrowing the gap to the $150–160 buy zone but not there yet. SPCX has continued rebuilding off the lockup-driven selloff, back to about $139 and above its $135 IPO price, though the next unlock tranche on August 20 is still ahead. With the largest position capped out, crypto lacking a catalyst, and the two watchlist names still outside their entry zones, the right call is to hold the current mix and let the week's data — PPI now digested, jobless claims and Fed commentary still to come — finish setting the rate path before committing more cash.",
        es:"A dos horas de iniciada la sesión del jueves, la narrativa de desinflación recibe una segunda confirmación: el IPP de julio se mantuvo sin cambios mensuales (4.7% interanual, por debajo del 4.9% previsto), un día después de que el IPC coincidiera exactamente con lo esperado; juntos, le dan a la Fed más margen para mantener las tasas sin cambios en lugar de reaccionar al repunte energético provocado por Irán. El apetito por el riesgo se mantiene firme en general: el S&P 500 marcó un nuevo máximo histórico intradía, subiendo cerca de 0.6%, y el Nasdaq avanza cerca de 0.8% impulsado por fortaleza fuera de los nombres de infraestructura de IA, mientras el Dow se queda algo rezagado (baja cerca de 0.1%) después de que Cisco y Cerebras cayeran tras sus resultados, un recordatorio de que no todos los reportes relacionados con IA están siendo recompensados en este momento. NVDA está prácticamente plano en el día, cerca de $222.80, conservando lo ganado el martes y el miércoles; la posición sigue justo en el límite de concentración del 35% de la cartera, por lo que no hay margen para sumar incluso en una jornada constructiva, y nada en los resultados de Cisco o Cerebras cambia los fundamentales propios de NVDA. SPY sigue al índice general al alza. El petróleo cedió por segunda sesión consecutiva (WTI baja cerca de 2% a $81, Brent baja cerca de 2% a $87) mientras el enfrentamiento en el Estrecho de Ormuz muestra señales tentativas de enfriarse, eliminando uno de los factores que presionaban a los activos de riesgo a principios de semana. BTC sigue atrapado por debajo de $65,000, en la zona baja de los $63,000, sin catalizador específico para las criptomonedas, quedándose al margen tanto del repunte bursátil como del contexto de petróleo e inflación más suaves que normalmente le sería favorable; los flujos siguen sin una dirección clara. ABNB retrocedió a cerca de $180, acortando la distancia hacia la zona de compra de $150–160 pero sin alcanzarla aún; SPCX continúa recuperándose de la liquidación provocada por el desbloqueo, volviendo a cerca de $139, por encima de su precio de OPI de $135, aunque el próximo tramo de desbloqueo del 20 de agosto sigue por delante. Con la posición más grande ya en su límite, las criptomonedas sin catalizador y los dos nombres en seguimiento todavía fuera de sus zonas de entrada, lo más prudente es mantener la combinación actual y esperar a que los datos de esta semana —el IPP ya digerido, con las solicitudes de subsidio por desempleo y comentarios de la Fed aún por venir— terminen de definir la trayectoria de tasas antes de comprometer más efectivo.",
        fr:"Deux heures après l'ouverture de la séance de jeudi, le récit désinflationniste reçoit une seconde confirmation : l'IPP de juillet est resté stable sur un mois (+4,7 % sur un an, sous la prévision de 4,9 %), au lendemain d'un IPC exactement conforme aux attentes ; ensemble, ils donnent à la Fed davantage de marge pour maintenir ses taux plutôt que de réagir à la flambée énergétique liée à l'Iran. L'appétit pour le risque reste globalement solide : le S&P 500 a inscrit un nouveau record intrajournalier, en hausse d'environ 0,6 %, et le Nasdaq progresse d'environ 0,8 %, porté par une vigueur en dehors des valeurs d'infrastructure IA, tandis que le Dow Jones accuse un léger retard (en baisse d'environ 0,1 %) après que Cisco et Cerebras ont toutes deux chuté suite à leurs résultats — un rappel que toutes les publications liées à l'IA ne sont pas récompensées en ce moment. NVDA est pratiquement stable sur la journée, autour de 222,80 $, conservant les gains acquis mardi et mercredi ; la position reste tout juste au plafond de concentration de 35 % du portefeuille, donc aucune marge pour renforcer même lors d'une séance favorable, et rien dans les résultats de Cisco ou Cerebras ne change les fondamentaux propres de NVDA. SPY suit l'indice large à la hausse. Le pétrole a reculé pour une deuxième séance consécutive (WTI en baisse d'environ 2 % à 81 $, Brent en baisse d'environ 2 % à 87 $), le face-à-face autour du détroit d'Ormuz montrant des signes timides d'apaisement — supprimant l'un des facteurs qui pesaient sur les actifs à risque plus tôt dans la semaine. Le BTC reste bloqué sous les 65 000 $, dans le bas de la fourchette des 63 000 $, sans catalyseur propre aux cryptomonnaies, restant à l'écart tant du rallye boursier que du contexte de pétrole et d'inflation plus doux qui lui serait normalement favorable ; les flux restent sans direction claire. ABNB a reculé à environ 180 $, réduisant l'écart avec la zone d'achat de 150–160 $ sans encore l'atteindre ; SPCX poursuit sa reconstruction après la vente liée au déblocage, revenant à environ 139 $, au-dessus de son prix d'IPO de 135 $, bien que la prochaine tranche de déblocage du 20 août reste à venir. Avec la position la plus importante déjà à son plafond, les cryptomonnaies sans catalyseur, et les deux valeurs suivies toujours en dehors de leur zone d'entrée, la décision la plus prudente est de conserver la répartition actuelle et d'attendre que les données de la semaine — l'IPP désormais digéré, les inscriptions au chômage et les commentaires de la Fed encore à venir — achèvent de clarifier la trajectoire des taux avant d'engager davantage de liquidités."

        es:"A dos horas de iniciada la sesión del viernes, el mercado cede una parte de las ganancias del récord histórico marcado el jueves por encima de 7,800 puntos: el S&P 500 se mantiene prácticamente plano, ligeramente por debajo de la línea de referencia, el Dow baja cerca de 0.2% y el Nasdaq-100 retrocede una magnitud similar. El detonante es un dato débil del índice preliminar de confianza del consumidor de la Universidad de Michigan de agosto: se ubicó en 51.0, muy por debajo del consenso de 54.5 y del dato final de julio de 55.2, con las condiciones actuales y las expectativas por debajo de lo previsto, y las expectativas de inflación a un año subiendo a 4.3%. Es una señal de alerta genuina por el lado de la demanda, que llega mientras el rendimiento del bono del Tesoro a 10 años se mantiene cerca de 4.69%, por encima del umbral de aproximadamente 4.30% en el que su correlación con las acciones tiende a volverse negativa, sumando un viento en contra de valoración a la decepción en el dato de confianza. NVDA está prácticamente plano en el día, cotizando en la zona media de los $220; la posición ya se ubica en cerca del 35.6% de la cartera solo por la apreciación del precio, justo en (y técnicamente por encima de) el límite de concentración del 35%, por lo que no hay margen para sumar incluso si el panorama macro de hoy fuera más constructivo, y no lo es. SPY sigue al índice general moderadamente a la baja, cerca de $776. BTC continúa con la debilidad señalada hoy en la cobertura cripto en general, bajando cerca de 1% hasta la zona baja de los $62,000, sin catalizador propio nuevo. ABNB sigue muy por encima de la zona de retroceso de $150–160 y SPCX todavía tiene por delante el tramo de desbloqueo del 20 de agosto, por lo que ninguno de los dos nombres en seguimiento es accionable. Con la confianza del consumidor deteriorándose, los rendimientos elevados y la posición más grande ya en su límite, lo más prudente es mantener la combinación actual y la reserva de efectivo en lugar de sumar en un contexto más débil y con tasas más altas.",
        fr:"Deux heures après l'ouverture de la séance de vendredi, le marché efface une partie des gains du record historique inscrit jeudi au-dessus de 7 800 points : le S&P 500 est quasiment stable, juste sous l'équilibre, le Dow Jones recule d'environ 0,2 % et le Nasdaq-100 cède une ampleur similaire. Le déclencheur est une lecture préliminaire décevante de l'indice de confiance des consommateurs de l'Université du Michigan pour août : il ressort à 51,0, très en dessous du consensus de 54,5 et du chiffre final de juillet à 55,2, avec les composantes conditions actuelles et anticipations toutes deux inférieures aux attentes, et les anticipations d'inflation à un an remontant à 4,3 %. C'est un véritable signal d'alerte du côté de la demande, qui survient alors que le rendement du Trésor à 10 ans se maintient près de 4,69 %, au-dessus du seuil d'environ 4,30 % où sa corrélation avec les actions a tendance à devenir négative, ajoutant un vent contraire de valorisation à la déception sur la confiance. NVDA est pratiquement stable sur la journée, évoluant dans le milieu de la fourchette des 220 $ ; la position se situe déjà à environ 35,6 % du portefeuille, uniquement du fait de l'appréciation du prix, tout juste au (et techniquement au-dessus du) plafond de concentration de 35 %, donc aucune marge pour renforcer même si le contexte macro du jour était plus favorable — ce qui n'est pas le cas. SPY suit l'indice large, en léger repli, autour de 776 $. Le BTC prolonge la faiblesse relevée aujourd'hui dans l'ensemble de la couverture crypto, en baisse d'environ 1 % vers le bas de la fourchette des 62 000 $, sans nouveau catalyseur propre. ABNB reste nettement au-dessus de la zone de repli des 150–160 $ et SPCX doit encore digérer la tranche de déblocage du 20 août, si bien qu'aucune des deux valeurs suivies n'est exploitable. Avec une confiance des consommateurs qui se dégrade, des rendements élevés et la position la plus importante déjà à son plafond, la décision la plus prudente est de conserver la répartition actuelle et la réserve de liquidités plutôt que de renforcer dans un contexte plus faible et à taux plus élevés."

let currentLang = 'en';
function L(field){
  if (field && typeof field === 'object' && ('zh' in field || 'en' in field || 'es' in field || 'fr' in field)) {
    return field[currentLang] ?? field.en ?? field.zh ?? '';
  }
  return field;
}

/* ======================================================================
   Render logic (generally no need to edit)
   ====================================================================== */
const fmtUSD = (n, d=2) => '$' + n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtPct = (n) => (n>=0?'+':'') + n.toFixed(2) + '%';
const fmtQty = (n, d) => n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});

const ASSET_COLORS = {NVDA:'#ffb400', SPY:'#5eead4', BTC:'#f0a35c', CASH:'#3a4b4e'};
function colorFor(sym){ return ASSET_COLORS[sym] || '#7c8e90'; }
function qtyDecimalsFor(sym){
  const h = ALPHA_DATA.holdings.find(x=>x.symbol===sym);
  return h ? h.qtyDecimals : 4;
}

function computeHoldings(){
  return ALPHA_DATA.holdings.map(h=>{
    const marketValue = h.shares * h.currentPrice;
    const costValue = h.shares * h.avgCost;
    const pnl = marketValue - costValue;
    const pnlPct = costValue !== 0 ? (pnl/costValue*100) : 0;
    return {...h, marketValue, costValue, pnl, pnlPct};
  });
}

function computeTotals(){
  const holdings = computeHoldings();
  const holdingsValue = holdings.reduce((s,h)=>s+h.marketValue,0);
  const totalValue = holdingsValue + ALPHA_DATA.cash;
  const totalPnl = totalValue - ALPHA_DATA.meta.initialCapital;
  const totalPnlPct = totalPnl / ALPHA_DATA.meta.initialCapital * 100;
  return {holdings, holdingsValue, totalValue, totalPnl, totalPnlPct};
}

          <span class="log-date">${tr.date} · ${L(tr.time)}</span>
          <span class="badge ${tr.action}">${badgeLabel}</span>
        </div>
        ${mainBlock}
        <div class="log-reason"><div class="reason-label">${t.reasonLabel}</div>${L(tr.reason)}</div>
      </div>
    `;
  }).join('');
}

function renderNavChart(){
  const t = I18N[currentLang];
  const labels = ALPHA_DATA.snapshots.map(s=>L(s.label));
  const data = ALPHA_DATA.snapshots.map(s=>s.totalValue);
  document.getElementById('chartNote').textContent = t.chartNote(ALPHA_DATA.snapshots.length);

  if (navChartInstance) navChartInstance.destroy();
  navChartInstance = new Chart(document.getElementById('navChart'), {
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'nav',
          data,
          borderColor:'#ffb400',
          backgroundColor:'rgba(255,180,0,0.08)',
          pointBackgroundColor:'#ffb400',
          pointBorderColor:'#0a0e0f',
          pointRadius:5,
          pointHoverRadius:7,
          borderWidth:2,
          fill:true,
          tension:0.25
        },
        {
          label:'baseline',
          data:labels.map(()=>ALPHA_DATA.meta.initialCapital),
          borderColor:'#4e6567',
          borderDash:[4,4],
          borderWidth:1,
          pointRadius:0,
          fill:false
        }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#141d20', borderColor:'#213032', borderWidth:1,
          titleFont:{family:'IBM Plex Mono', size:11}, bodyFont:{family:'IBM Plex Mono', size:12},
          callbacks:{ label:(ctx)=> ctx.datasetIndex===0 ? ` ${t.navTooltip}${fmtUSD(ctx.parsed.y)}` : ` ${t.baselineTooltip}${fmtUSD(ctx.parsed.y)}` }
        }
      },
      scales:{
        x:{ grid:{color:'#1a2528'}, ticks:{color:'#8ba0a2', font:{family:'IBM Plex Mono', size:11}} },
        y:{ grid:{color:'#1a2528'}, ticks:{color:'#8ba0a2', font:{family:'IBM Plex Mono', size:11}, callback:(v)=>fmtUSD(v,0)} }
      }
    }
  });
}

function renderPrinciples(){
  const t = I18N[currentLang];
  document.getElementById('principles').innerHTML = t.principles.map(p=>`
    <div class="principle">
      <div class="n">${p.n}</div>
      <h3>${p.h}</h3>
      <p>${p.p}</p>
    </div>
  `).join('');
}

function renderFooter(){
  const t = I18N[currentLang];
  document.getElementById('disclaimerText').innerHTML =
    `${t.disclaimerIntro} <b>${t.disclaimerLead}</b>${t.disclaimerRest}`;
  document.getElementById('footerMeta').innerHTML = `
    <span>${t.footerInception} ${ALPHA_DATA.meta.startDate}</span>
    <span>${t.footerLastUpdated} ${ALPHA_DATA.meta.lastUpdated}</span>
    <span>${t.footerInitialCapital} ${fmtUSD(ALPHA_DATA.meta.initialCapital)}</span>
  `;
}

function renderAll(){
  const t = I18N[currentLang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.title;
  renderLangSwitch();

  const totals = computeTotals();
  renderStatusbar();
  renderHero(totals);
  renderStats(totals);
  renderSectionChrome();
  renderHoldings(totals);
  renderAllocation(totals);
  renderWatchlist();
  renderTradeLog();
  renderNavChart();
  renderPrinciples();
  renderFooter();
}

document.getElementById('langSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('.lang-btn');
  if (!btn) return;
  currentLang = btn.dataset.lang;
  renderAll();
});

renderAll();
</script>
</body>
</html>
