<style>
  :root{
    --bg:#0a0e0f;
    --bg-panel:#10171a;
    --bg-panel-2:#141d20;
    --bg-raised:#182225;
    --border:#213032;
    --border-soft:#1a2528;
    --text:#e7edee;
    --text-dim:#8ba0a2;
    --text-faint:#4e6567;
    --amber:#ffb400;
    --amber-dim:#8a640e;
    --teal:#5eead4;
    --green:#34d399;
    --green-dim:#1a5c46;
    --red:#f87171;
    --red-dim:#5c2626;
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
    --sans:'IBM Plex Sans SC','IBM Plex Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg);}
  body{
    background:
      radial-gradient(ellipse 1200px 600px at 15% -10%, rgba(255,180,0,0.06), transparent 60%),
      radial-gradient(ellipse 1000px 800px at 100% 0%, rgba(94,234,212,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    padding-bottom:60px;
    min-height:100vh;
  }
  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px; position:relative; z-index:2;}

  /* ---------- header ---------- */
  header.term{
    border-bottom:1px solid var(--border);
    padding:22px 0 26px;
    margin-bottom:28px;
  }
  .statusbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--text-dim);
    margin-bottom:22px;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2.2s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .dot{animation:none;} }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .statusbar .sep{color:var(--border);}
  .statusbar b{color:var(--teal); font-weight:600;}

  .hero-left .brand{
    font-family:var(--mono); font-size:13px; color:var(--text-faint);
    letter-spacing:.16em; text-transform:uppercase; margin-bottom:10px;
  }
  .hero-left h1{
    font-family:var(--mono); font-weight:700;
    font-size:clamp(34px, 5.4vw, 62px);
    color:var(--text); letter-spacing:-0.01em;
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  }
  .hero-left h1 .delta{
    font-size:clamp(15px,2.2vw,22px); font-weight:600;
  }
  .hero-left .subline{
    margin-top:8px; font-size:14px; color:var(--text-dim);
  }
  .hero-controls{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px; margin-top:20px;
  }
  .tag-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-start;}
  .tag{
    font-family:var(--mono); font-size:11px; padding:5px 10px;
    border:1px solid var(--border); border-radius:3px; color:var(--text-dim);
    white-space:nowrap;
  }
  .tag.warn{border-color:var(--amber-dim); color:var(--amber);}

  .site-links{display:flex; gap:8px; align-items:center;}
  .site-links a{
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.04em;
    padding:6px 11px; border:1px solid var(--border); border-radius:5px;
    color:var(--text-dim); text-decoration:none; transition:color .15s ease, border-color .15s ease;
    display:inline-flex; align-items:center; gap:6px;
  }
  .site-links a:hover{color:var(--amber); border-color:var(--amber-dim);}
  .site-links .x-icon{width:11px; height:11px; fill:currentColor; flex:none;}
  .hero-nav{display:flex; gap:12px; align-items:center;}

  .lang-switch{display:flex; gap:3px; padding:3px; border:1px solid var(--border); border-radius:5px; background:var(--bg-panel);}
  .lang-btn{
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.03em;
    padding:5px 10px; border-radius:3px; background:transparent; border:none;
    color:var(--text-faint); cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .lang-btn:hover{color:var(--text-dim);}
  .lang-btn.active{background:var(--amber); color:#0a0e0f;}
  .lang-btn:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}

  .up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--text-dim);}

  /* ---------- section headers ---------- */
  .sec-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin:44px 0 16px; flex-wrap:wrap;
  }
  .sec-head h2{
    font-family:var(--mono); font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text); font-weight:600;
    display:flex; align-items:center; gap:10px;
  }
  .sec-head h2::before{content:''; width:3px; height:14px; background:var(--amber); display:inline-block;}
  .sec-head .note{font-size:12px; color:var(--text-faint); font-family:var(--mono);}

  /* ---------- stat grid ---------- */
  .stats-grid{
    display:grid; grid-template-columns:repeat(6,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border);
  }
  .stat-card{background:var(--bg-panel); padding:18px 18px 16px;}
  .stat-card .label{font-size:11px; color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px; font-family:var(--mono);}
  .stat-card .value{font-family:var(--mono); font-size:21px; font-weight:600; color:var(--text);}
  .stat-card .sub{font-size:11px; margin-top:6px; font-family:var(--mono); color:var(--text-dim);}
  @media (max-width:1080px){ .stats-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:900px){ .stats-grid{grid-template-columns:repeat(2,1fr);} }

  /* ---------- panel ---------- */
  .panel{background:var(--bg-panel); border:1px solid var(--border); padding:20px;}

  /* ---------- subscribe ---------- */
  .subscribe-panel{
    background:var(--bg-panel); border:1px solid var(--amber-dim); padding:28px;
    display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
  }
  .subscribe-copy h3{font-size:16px; color:var(--text); margin-bottom:6px;}
  .subscribe-copy p{font-size:13px; color:var(--text-dim); max-width:440px; line-height:1.6;}
  .subscribe-form{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start;}
  .subscribe-form input[type="email"]{
    font-family:var(--mono); font-size:13px; color:var(--text);
    background:var(--bg-panel-2); border:1px solid var(--border); border-radius:3px;
    padding:10px 12px; min-width:240px;
  }
  .subscribe-form input[type="email"]::placeholder{color:var(--text-faint);}
  .subscribe-form input[type="email"]:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}
  .subscribe-form input[type="submit"]{
    font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.03em;
    background:var(--amber); color:#0a0e0f; border:none; border-radius:3px;
    padding:10px 18px; cursor:pointer;
  }
  .subscribe-form input[type="submit"]:hover{background:#ffc636;}
  .subscribe-form p{width:100%; margin-top:6px;}
  .subscribe-form a{font-size:10.5px; color:var(--text-faint); font-family:var(--mono);}
  @media (max-width:700px){ .subscribe-panel{flex-direction:column; align-items:flex-start;} }

  /* ---------- chart ---------- */
  .chart-panel{padding:22px 22px 12px;}
  .chart-box{position:relative; height:320px;}
  .baseline-note{font-size:11px; color:var(--text-faint); font-family:var(--mono); margin-top:8px; display:flex; align-items:center; gap:6px;}
  .baseline-note .swatch{width:14px; height:0; display:inline-block; border-bottom:1px dashed var(--text-faint);}

  /* ---------- holdings / alloc grid ---------- */
  .grid-2{display:grid; grid-template-columns:1.55fr 1fr; gap:1px; background:var(--border); border:1px solid var(--border);}
  @media (max-width:860px){ .grid-2{grid-template-columns:1fr;} }
  .grid-2 > div{background:var(--bg-panel); padding:20px;}

  table{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13px;}
  th{
    text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-faint); font-weight:500; padding:0 10px 10px 0; border-bottom:1px solid var(--border);
  }
  td{padding:12px 10px 12px 0; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  .sym{display:flex; flex-direction:column; gap:2px;}
  .sym b{color:var(--text); font-size:13.5px; letter-spacing:.02em;}
  .sym span{color:var(--text-faint); font-size:11px; font-family:var(--sans);}
  .type-pill{
    display:inline-block; font-family:var(--sans); font-size:10px; padding:2px 7px;
    border-radius:10px; border:1px solid var(--border); color:var(--text-dim);
  }

  .alloc-legend{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .alloc-row{display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:12.5px;}
  .alloc-row .l{display:flex; align-items:center; gap:8px; color:var(--text-dim);}
  .alloc-row .sw{width:9px; height:9px; border-radius:2px;}
  .alloc-row .v{color:var(--text);}

  /* ---------- watchlist ---------- */
  .watch-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--border); border:1px solid var(--border);}
  @media (max-width:700px){ .watch-grid{grid-template-columns:1fr;} }
  .watch-card{background:var(--bg-panel); padding:18px 20px;}
  .watch-card .wh{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:10px; flex-wrap:wrap;}
  .watch-card .wh b{font-family:var(--mono); font-size:15px;}
  .watch-card .wh .px{font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .watch-card p{font-size:13px; color:var(--text-dim); line-height:1.65;}
  .watch-status{
    display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    padding:3px 8px; border-radius:2px; margin-bottom:10px; text-transform:uppercase;
  }
  .watch-status.hold{background:rgba(255,180,0,0.1); color:var(--amber); border:1px solid var(--amber-dim);}

  /* ---------- trade log ---------- */
  .log-entry{
    border:1px solid var(--border); background:var(--bg-panel);
    padding:18px 20px; margin-bottom:14px; position:relative;
  }
  .log-entry.buy{border-left:3px solid var(--green);}
  .log-entry.sell{border-left:3px solid var(--red);}
  .log-entry.hold{border-left:3px solid var(--text-faint);}
  .log-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
  .log-id{font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:.06em;}
  .log-date{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .badge{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.06em;
    padding:3px 9px; border-radius:2px;
  }
  .badge.buy{background:rgba(52,211,153,0.12); color:var(--green); border:1px solid var(--green-dim);}
  .badge.sell{background:rgba(248,113,113,0.12); color:var(--red); border:1px solid var(--red-dim);}
  .badge.hold{background:rgba(139,160,162,0.12); color:var(--text-dim); border:1px solid var(--border);}
  .log-main{
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;
    margin-bottom:12px;
  }
  .log-main .who b{font-family:var(--mono); font-size:16px;}
  .log-main .who span{font-size:12px; color:var(--text-faint); margin-left:8px;}
  .log-main .calc{font-family:var(--mono); font-size:13px; color:var(--text-dim); text-align:right;}
  .log-main .calc b{color:var(--text); font-size:14px;}
  .log-reason{
    background:var(--bg-panel-2); border:1px solid var(--border-soft); padding:12px 14px;
    font-size:13px; color:var(--text-dim); line-height:1.7; position:relative;
  }
  .reason-label{
    font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    color:var(--teal); text-transform:uppercase; margin-bottom:6px;
  }
  .log-reason-text{
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .log-reason-text.expanded{display:block; -webkit-line-clamp:unset; overflow:visible;}
  .reason-toggle{
    display:inline-block; margin-top:8px; font-family:var(--mono); font-size:11px;
    letter-spacing:.04em; text-transform:uppercase; color:var(--teal);
    background:none; border:none; padding:0; cursor:pointer;
  }
  .reason-toggle:hover{color:var(--amber);}
  .log-more-row{text-align:center; margin:6px 0 20px;}
  .log-more-btn{
    font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.04em;
    background:transparent; color:var(--text-dim); border:1px solid var(--border);
    padding:10px 22px; border-radius:3px; cursor:pointer;
  }
  .log-more-btn:hover{color:var(--amber); border-color:var(--amber-dim);}
  .cursor-line{
    font-family:var(--mono); font-size:12px; color:var(--text-faint); padding:6px 2px; display:flex; align-items:center; gap:8px;
  }
  .cursor-blink{width:7px; height:14px; background:var(--amber); animation:blink 1s step-end infinite;}
  @media (prefers-reduced-motion: reduce){ .cursor-blink{animation:none; opacity:.6;} }
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:0;}}

  /* ---------- philosophy ---------- */
  .principles{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border);}
  @media (max-width:860px){ .principles{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .principles{grid-template-columns:1fr;} }
  .principle{background:var(--bg-panel); padding:18px;}
  .principle .n{font-family:var(--mono); color:var(--amber); font-size:12px; margin-bottom:8px;}
  .principle h3{font-size:14px; margin-bottom:6px; color:var(--text);}
  .principle p{font-size:12.5px; color:var(--text-dim); line-height:1.6;}

  /* ---------- footer ---------- */
  footer{margin-top:56px; padding-top:22px; border-top:1px solid var(--border);}
  footer .disclaimer{
    font-size:12px; color:var(--text-faint); line-height:1.8; max-width:820px;
  }
  footer .disclaimer b{color:var(--text-dim);}
  footer .meta{
    margin-top:14px; font-family:var(--mono); font-size:11px; color:var(--text-faint);
    display:flex; gap:16px; flex-wrap:wrap;
  }

  ::selection{background:var(--amber); color:#0a0e0f;}

  @media (max-width:640px){
    .hero-controls{flex-direction:column; align-items:flex-start;}
    .lang-switch{align-self:flex-start;}
  }
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="2dcbaf06-d535-480a-a4a3-f571b7b1a79c"></script>

      </div>
    </div>
  </header>

  <section class="stats-grid" id="statsGrid"></section>

  <section class="sec-head">
    <h2 id="secNavTitle"></h2>
    <span class="note" id="chartNote"></span>
  </section>
  <div class="panel chart-panel">
    <div class="chart-box"><canvas id="navChart"></canvas></div>
    <div class="baseline-note" id="baselineNote"></div>
  </div>

  <section class="sec-head">
    <h2 id="secHoldingsTitle"></h2>
    <span class="note" id="holdingsNote"></span>
  </section>
  <div class="grid-2">
    <div>
      <div class="table-scroll">

          <thead id="holdingsThead"></thead>

        </table>
      </div>

  </section>
  <div id="tradeLog"></div>

      <input type="email" name="email" id="bd-email" placeholder="you@example.com" required>

           source string Umami does and the two halves can be joined later. -->

      <input type="submit" id="subscribeSubmit" value="">
      <p><a href="https://buttondown.com/refer/1kalpha" target="_blank" id="subscribePowered"></a></p>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script>
/* ======================================================================
   ALPHA_DATA — the only block to edit for a daily update.
   Runs every day (crypto trades 24/7; equities only trade on NYSE trading
   days — see holidays.json). Each new day:
   1) Append new trade(s) to trades[] (reason needs zh/en/es/fr). Stock/ETF
      buy/sell entries are only valid on NYSE trading days; crypto buy/sell
      is valid any day.
   2) Update currentPrice / avgCost / shares on each holdings[] entry.
      Crypto currentPrice updates every day; stock/ETF currentPrice only
      updates on NYSE trading days (frozen at last close otherwise).
   3) Update cash
   4) Append a snapshot to snapshots[] (label needs zh/en/es/fr) — once per
      calendar day, at the close check only
   5) Update meta.lastUpdated / meta.dayCount
   Free-text fields use {zh:"...", en:"...", es:"...", fr:"..."}.
   Proper nouns (tickers, company names) stay plain strings — identical
   across languages.

   No-action check-ins: when a scheduled review concludes no trade is
   warranted, append a trades[] entry with action:"hold" instead of
   "buy"/"sell". Shape:
     { date, time:{zh,en,es,fr}, action:"hold",
       navAtCheck: <total portfolio value at the moment of the check>,
       reason:{zh,en,es,fr} }
   (no symbol/name/shares/price/amount/cashAfter — those are buy/sell-only)
   ====================================================================== */
const ALPHA_DATA = {
  meta: {
    startDate: "2026-08-07",

        es:"A falta de aproximadamente una hora para el cierre del miércoles, NVDA mantiene su rebote posterior al IPC, cotizando cerca de $223.20 (un avance de aproximadamente 2.6% en el día), mientras el moderado dato del IPC de julio, sumado a sólidos resultados de empresas ligadas a la IA (CoreWeave, Super Micro), sigue sosteniendo el apetito por el riesgo: el S&P 500 sube cerca de 0.3% cerca de máximos históricos y el Nasdaq cerca de 0.6%. La posición sigue justo en el límite de concentración del 35% de la cartera, por lo que no hay margen para sumar pese a la fortaleza, y nada en la sesión de hoy cambia la tesis subyacente de NVDA; la preocupación por el consorcio de financiamiento de principios de semana ya fue digerida por el mercado. SPY sigue al índice al alza, en $776.40, cerca de máximos. BTC se mantiene prácticamente plano a algo más débil, en un rango de $63,800–$64,000, quedándose al margen del repunte bursátil de hoy sin un catalizador específico nuevo para las criptomonedas. El petróleo se mantiene elevado (WTI ~$82, Brent ~$88) ante el estancamiento de las conversaciones sobre el Estrecho de Ormuz, un riesgo de fondo que vale la pena vigilar pero que aún no mueve al mercado. SPCX amplió su caída del día a cerca de 2.8%, hasta unos $132, mientras el mercado sigue digiriendo el calendario escalonado de desbloqueos (el próximo tramo el 20 de agosto); ABNB no cambia y sigue muy por encima de la zona de retroceso de $150–160. De cara al cierre, se mantiene el mismo criterio que esta mañana: conservar la combinación actual sin perseguir el movimiento.",
        fr:"À environ une heure de la clôture de mercredi, NVDA conserve son rebond post-IPC, évoluant près de 223,20 $ (en hausse d'environ 2,6 % sur la journée), alors que la publication modérée de l'IPC de juillet, conjuguée à de solides résultats de sociétés liées à l'IA (CoreWeave, Super Micro), continue de soutenir l'appétit pour le risque : le S&P 500 progresse d'environ 0,3 % près de ses sommets historiques, le Nasdaq d'environ 0,6 %. La position reste tout juste au plafond de concentration de 35 % du portefeuille, donc aucune marge pour renforcer malgré cette vigueur, et rien dans la séance d'aujourd'hui ne change la thèse sous-jacente sur NVDA ; l'inquiétude autour du consortium de financement, plus tôt dans la semaine, a déjà été digérée par le marché. SPY suit l'indice à la hausse, à 776,40 $, près de ses sommets. Le BTC reste quasi stable à légèrement plus faible, dans une fourchette de 63 800 $ à 64 000 $, restant à l'écart du rallye boursier du jour, sans nouveau catalyseur propre aux cryptomonnaies. Le pétrole demeure élevé (WTI ~82 $, Brent ~88 $) alors que les discussions sur le détroit d'Ormuz restent dans l'impasse, un risque de fond à surveiller mais qui ne pilote pas encore le marché. SPCX a accentué sa baisse du jour à environ 2,8 %, autour de 132 $, le marché continuant de digérer le calendrier échelonné des déblocages (prochaine tranche le 20 août) ; ABNB reste inchangée, toujours nettement au-dessus de la zone de repli des 150–160 $. À l'approche de la clôture, le constat reste le même que ce matin : conserver la répartition actuelle plutôt que de poursuivre le mouvement."

        en:"About two hours into Monday's session, the tape is subdued as the market digests a busy week ahead: NVDA has firmed modestly to the mid-$226s (today's range $224.50-$227.49) on renewed confidence in the AI capex trade — hyperscalers and AI infrastructure names broadly advanced after Anthropic reported strong revenue growth, reinforcing the case that AI model development and datacenter spending stay sustained through the medium term. That price move alone keeps the position at roughly 35.6% of the portfolio, still right at (and technically over) the 35% concentration ceiling, so there is no room to add even on a constructive AI headline. SPY is essentially flat near $777, tracking a quiet, mixed tape — the Dow is off about 0.2-0.3% at the open while the Nasdaq edges up fractionally — as investors look past today toward Wednesday's FOMC minutes and a retail-earnings wave (Home Depot Tuesday, Target/Lowe's/TJX Wednesday, Walmart Thursday) that should give a clearer read on consumer health and the Fed's next move; the Fed has held its target range at 3.50%-3.75% all year with the market pricing at most one 25bp cut later in 2026, so there's little reason to reposition ahead of that data. BTC has firmed slightly since Sunday's close to around $63,600 (intraday range roughly $62,800-$65,000), even as the Fear & Greed Index cooled further to 28 ('Fear', bordering 'Extreme Fear') from 37 yesterday — a price/sentiment divergence that continues rather than resolves, with BTC still down about 3% on the week. The position sits around 19.4-19.5% of the portfolio, comfortably under the ~20% target, and a single day of this kind of mixed signal isn't enough to justify sizing up or down. On the watchlist, ABNB has run further away from the $150-160 pullback zone to about $184 (+25% over the past month on its Q2 beat and raised guidance), reinforcing the case to keep waiting rather than chase; SPCX still has its next unlock tranche (~319M shares) due this Thursday, Augus         es:"A unas dos horas de iniciada la sesión del lunes, el mercado se muestra apagado mientras digiere una semana cargada de datos: NVDA se ha fortalecido moderadamente hasta cerca de $226 (rango del día $224.50–$227.49), impulsada por una renovada confianza en la narrativa de gasto de capital en IA —tras el sólido crecimiento de ingresos reportado por Anthropic, las hiperescaladoras y los valores de infraestructura de IA avanzaron de forma generalizada, reforzando la idea de que el desarrollo de modelos de IA y el gasto en centros de datos se mantendrán sostenidos a mediano plazo—. Solo ese movimiento de precio ya eleva la posición a cerca del 35.6% de la cartera, todavía justo en (y técnicamente por encima de) el límite de concentración del 35%, por lo que no hay margen para sumar ni siquiera con una noticia constructiva sobre IA. SPY está prácticamente plano cerca de $777, en una sesión tranquila y mixta —el Dow cae cerca de 0.2%-0.3% en la apertura mientras el Nasdaq sube ligeramente— mientras los inversores miran más allá de hoy, hacia las minutas del FOMC del miércoles y una ola de resultados minoristas (Home Depot el martes, Target/Lowe's/TJX el miércoles, Walmart el jueves) que deberían ofrecer una lectura más clara de la salud del consumidor y el próximo movimiento de la Fed; la Fed ha mantenido su rango objetivo en 3.50%-3.75% durante todo el año, con el mercado descontando a lo sumo un recorte de 25 puntos básicos en la segunda mitad de 2026, por lo que hay poca razón para reposicionarse antes de esos datos. BTC se ha fortalecido levemente desde el cierre del domingo hasta cerca de $63,600 (rango intradía aproximado de $62,800 a $65,000), incluso mientras el Índice de Miedo y Codicia se enfría aún más hasta 28 ('Miedo', bordeando 'Miedo Extremo'), desde 37 ayer —la divergencia entre precio y sentimiento continúa en lugar de resolverse, con BTC todavía bajando cerca de 3% en la semana—. La posición se ubica en torno al 19.4%-19.5% de la cartera, cómo         fr:"Environ deux heures après l'ouverture de la séance de lundi, le marché reste calme alors qu'il digère une semaine chargée en données : NVDA s'est raffermie modérément autour de 226 $ (fourchette du jour 224,50 $–227,49 $), portée par une confiance retrouvée dans le récit des dépenses d'investissement en IA — après qu'Anthropic a annoncé une forte croissance de son chiffre d'affaires, les hyperscalers et les valeurs d'infrastructure IA ont globalement progressé, renforçant l'idée que le développement des modèles d'IA et les dépenses en centres de données resteront soutenus à moyen terme. Ce seul mouvement de prix porte déjà la position à environ 35,6 % du portefeuille, toujours tout juste au (et techniquement au-dessus du) plafond de concentration de 35 %, donc aucune marge pour renforcer même face à une actualité IA constructive. SPY est pratiquement stable autour de 777 $, dans une séance calme et contrastée — le Dow Jones recule d'environ 0,2 à 0,3 % à l'ouverture tandis que le Nasdaq progresse légèrement — les investisseurs regardant au-delà d'aujourd'hui vers les minutes du FOMC de mercredi et une vague de résultats du commerce de détail (Home Depot mardi, Target/Lowe's/TJX mercredi, Walmart jeudi) qui devraient donner une lecture plus claire de la santé du consommateur et de la prochaine décision de la Fed ; la Fed a maintenu sa fourchette cible à 3,50 %-3,75 % toute l'année, le marché n'anticipant au maximum qu'une baisse de 25 points de base au second semestre 2026, donc peu de raisons de se repositionner avant ces données. Le BTC s'est légèrement raffermi depuis la clôture de dimanche, autour de 63 600 $ (fourchette intrajournalière d'environ 62 800 $ à 65 000 $), alors même que l'indice Peur et Cupidité s'est encore refroidi à 28 (« Peur », à la lisière de la « Peur extrême »), contre 37 la veille — la divergence entre prix et sentiment se poursuit plutôt qu'elle ne se résorbe, le BTC restant en baisse d'environ 3 % sur la semaine. La position représente environ 19,4-19,5 % du portefeuille, confortablement sous l'objectif d'environ 20 %, et une seule journée de ce type de signal mixte ne suffit pas à justifier un renforcement ou une réduction. Sur la liste de surveillance, ABNB s'est encore éloignée de la zone de repli des 150–160 $, remontant à environ 184 $ (+25 % sur le dernier mois après avoir dépassé les attentes du deuxième trimestre et relevé ses prévisions), ce qui renforce l'idée de continuer à attendre plutôt que de la poursuivre ; SPCX doit encore affronter sa prochaine tranche de déblocage (~319 millions d'actions) attendue ce jeudi 20 août, ce qui la maintient hors de portée tant que cette offre supplémentaire n'est pas digérée par le marché. Avec NVDA plafonnée par son propre prix, les actions calmes avant une semaine chargée en données, et les cryptomonnaies envoyant des signaux mitigés, la décision la plus prudente est de conserver la répartition actuelle et de réévaluer au fil des catalyseurs de la semaine."

        en:"About two hours into Tuesday's session, equities are choppy: the tape opened lower on a jump in sovereign bond yields (the 10-year at 4.70%, the 30-year at 5.30%, just off a 19-year high) and rising oil prices after President Trump threatened further economic pressure on Iran and warned Oman over the Strait of Hormuz — pressure that hit semiconductors hardest, with the Nasdaq down roughly 1.3% at the open while the Dow held closer to flat, cushioned by a >1% pop in Home Depot after its Q2 earnings beat (the first of this week's retail prints flagged yesterday). NVDA is essentially flat to slightly softer at ~$225 (prior close $225.16, today's range $224.86-$227.92) as chip names took the brunt of the yield-driven selloff; the position is unchanged at ~35.4% of the portfolio, still effectively capped, so there's no room to add even if sentiment turns. SPY has stabilized back to about $776.34 after an early dip (day range $772.51-$776.78), keeping the position right at its ~25.0% target weight — nothing here warrants a trim or an add. BTC has recovered to about $64,450 (+~2.2% over 24h) after slipping under $63,000 over the weekend on soft institutional flows and regulatory uncertainty; sentiment readings are mixed across sources (Fear & Greed roughly 28-53 depending on provider) but net improved from Monday's 28. The position sits around 19.7% of the portfolio, still under the ~20% target, and one day of recovery plus noisy sentiment data isn't a strong enough signal to size up. On the watchlist, SPCX's next unlock tranche is still two days out (Thursday, August 20) and ABNB remains well above its pullback zone, so neither is actionable yet. With NVDA capped by price, SPY at target, and BTC's bounce not yet confirmed by cleaner sentiment data, the right call is to hold and let today's yield/oil-driven volatility and the rest of the retail-earnings wave (Target/Lowe's/TJX tomorrow, Walmart Thursday) play out before repositioning.",
        es:"A unas dos horas de iniciada la sesión del martes, la renta variable se mueve de forma errática: el mercado abrió a la baja por un salto en los rendimientos de bonos soberanos (el bono a 10 años en 4.70%, el de 30 años en 5.30%, cerca de un máximo de 19 años) y por la subida del petróleo después de que el presidente Trump amenazara con más presión económica sobre Irán y advirtiera a Omán sobre el Estrecho de Ormuz; la presión golpeó con más fuerza a los semiconductores, con el Nasdaq cayendo cerca de un 1.3% en la apertura mientras el Dow se mantuvo más cerca de plano, amortiguado por una subida de más del 1% en Home Depot tras superar expectativas en su resultado del segundo trimestre (el primero de la ola de resultados minoristas señalada ayer). NVDA está prácticamente plana, algo más débil, en torno a $225 (cierre anterior $225.16, rango del día $224.86–$227.92), ya que los valores de chips absorbieron el grueso de la liquidación provocada por los rendimientos; la posición se mantiene sin cambios en torno al 35.4% de la cartera, todavía efectivamente en su límite, por lo que no hay margen para sumar incluso si el sentimiento mejora. SPY se ha estabilizado de nuevo en torno a $776.34 tras una caída inicial (rango del día $772.51–$776.78), manteniendo la posición justo en su peso objetivo de ~25.0%; nada aquí justifica recortar o sumar. BTC se ha recuperado a cerca de $64,450 (+~2.2% en 24 horas) tras caer por debajo de $63,000 durante el fin de semana por flujos institucionales débiles e incertidumbre regulatoria; las lecturas de sentimiento son mixtas según la fuente (Miedo y Codicia entre 28 y 53 según el proveedor), pero en conjunto mejoran frente al 28 del lunes. La posición se ubica en torno al 19.7% de la cartera, todavía por debajo del objetivo de ~20%, y un solo día de recuperación junto con datos de sentimiento ruidosos no es una señal suficientemente fuerte para sumar. En la lista de seguimiento, el próximo tramo de desbloqueo de SPCX todavía         fr:"Environ deux heures après l'ouverture de la séance de mardi, les actions évoluent en dents de scie : le marché a ouvert en baisse sous l'effet d'un bond des rendements obligataires souverains (le 10 ans à 4,70 %, le 30 ans à 5,30 %, tout juste sous un plus haut de 19 ans) et de la hausse du pétrole après que le président Trump a menacé d'exercer une pression économique supplémentaire sur l'Iran et mis en garde Oman au sujet du détroit d'Ormuz ; la pression a le plus touché les semi-conducteurs, le Nasdaq reculant d'environ 1,3 % à l'ouverture tandis que le Dow Jones restait plus proche de l'équilibre, soutenu par une hausse de plus de 1 % de Home Depot après un résultat du deuxième trimestre supérieur aux attentes (le premier de la vague de résultats du commerce de détail signalée hier). NVDA est pratiquement stable, légèrement plus faible, autour de 225 $ (clôture précédente 225,16 $, fourchette du jour 224,86 $–227,92 $), les valeurs de semi-conducteurs ayant absorbé l'essentiel de la vente déclenchée par les rendements ; la position reste inchangée à environ 35,4 % du portefeuille, toujours effectivement au plafond, donc aucune marge pour renforcer même si le sentiment s'améliore. Le SPY s'est stabilisé autour de 776,34 $ après un repli initial (fourchette du jour 772,51 $–776,78 $), maintenant la position tout juste à son poids cible d'environ 25,0 % ; rien ici ne justifie de réduire ou de renforcer. Le BTC s'est redressé autour de 64 450 $ (+~2,2 % sur 24 heures) après être passé sous les 63 000 $ pendant le week-end en raison de flux institutionnels faibles et d'une incertitude réglementaire ; les lectures de sentiment sont mitigées selon les sources (indice Peur et Cupidité entre 28 et 53 selon le fournisseur), mais globalement en amélioration par rapport au 28 de lundi. La position représente environ 19,7 % du portefeuille, toujours sous l'objectif d'environ 20 %, et une seule journée de rebond associée à des données de sentiment bruitées ne constitue pas un signal assez fort pour renforcer. Sur la liste de surveillance, la prochaine tranche de déblocage de SPCX est encore à deux jours (jeudi 20 août) et ABNB reste bien au-dessus de sa zone de repli, donc aucune des deux n'est encore exploitable. Avec NVDA plafonnée par son propre prix, le SPY à son poids cible, et le rebond du BTC pas encore confirmé par des données de sentiment plus claires, la décision la plus prudente est de conserver la position actuelle et de laisser la volatilité du jour, portée par les rendements et le pétrole, ainsi que le reste de la vague de résultats du commerce de détail (Target/Lowe's/TJX demain, Walmart jeudi), se dérouler avant de se repositionner."

        zh:"周三盘中已过去约两小时，NVDA 基本持平于219.74美元（前收盘220.03美元，当日区间218.69–221.64美元）；美银分析师Vivek Arya指出，按企业价值/自由现金流计算，该股相对AI算力同业存在40%-50%的折价，德意志银行同步上调目标价——这是英伟达8月26日财报发布前的一轮看多估值评论，但股价本身尚未对此作出反应。该仓位目前约占组合34.9%，已实质触及35%的集中度上限，即便分析师评论偏正面，也没有加仓空间；更稳妥的做法是等待8月26日财报落地后再决定下一步。SPY开盘报768.70美元（区间766.92–769.50美元），较昨日收盘价768.64美元基本持平，此前因亚洲市场隔夜暴跌及伊朗/霍尔木兹海峡局势再度紧张，期货一度走低。今日真正的催化剂是将于14:00 ET公布的FOMC八月会议纪要——发布时间晚于本次盘中复核，因此按兵不动、等待数据落地才是正确做法；该仓位目前维持在约25%的目标权重附近。BTC维持在64,450美元附近，仍在6.3万至6.5万美元的区间内震荡，暂无新催化剂；该仓位约占组合19.9%，略低于20%目标权重，没有理由减仓或加仓。利率方面，美联储已连续第五次会议维持3.50%-3.75%不变，9月加息概率已从一周前的约50%降至约30%，尽管长端收益率仍处于数十年高位、油价维持高位；7月非农就业减少2.3万人，失业率报4.1%。观察名单方面，ABNB报184.67美元，仍远高于150-160美元的回踩买入区间；SPCX报143.34美元，明日（8月20日）将迎来下一批约3.19亿股的解禁，两者均不具备可操作性，SPCX的解禁风险更支持在事件落地前继续观望。维持当前全部持仓，等待FOMC会议纪要与英伟达8月26日财报给出下一步真正的信号。",
        en:"About two hours into Wednesday's session, NVDA is essentially flat at $219.74 (prior close $220.03, day range $218.69–$221.64) as BofA's Vivek Arya flags the stock trading at a 40–50% discount to AI-compute peers on EV/FCF and Deutsche Bank lifts its target — bullish valuation calls ahead of the August 26 earnings report, but the stock itself isn't moving on them yet. The position sits at roughly 34.9% of the portfolio, already effectively at the 35% concentration ceiling, so there's no room to add even on constructive analyst commentary; better to let the August 26 print set the next move. SPY opened at $768.70 (range $766.92–$769.50), essentially flat versus yesterday's $768.64 close, after futures dipped overnight on an Asian-market selloff and renewed Iran/Strait of Hormuz tension. The real catalyst today is the FOMC's August meeting minutes, due at 2:00pm ET — well after this check — so sitting tight and waiting for that data is the right call; the position is at its ~25% target weight regardless. BTC is holding near $64,450, still range-bound between $63,000 and $65,000 with no fresh catalyst; the position is at about 19.9% of the portfolio, just under the 20% target, so no reason to trim or add. On rates: the Fed held at 3.50–3.75% for a fifth straight meeting, and September hike odds have fallen to around 30% from roughly 50% a week ago, even as long yields sit near multi-decade highs and oil stays elevated; July payrolls fell by 23,000 with unemployment at 4.1%. On the watchlist, ABNB is at $184.67, still well above the $150–160 pullback zone, and SPCX is at $143.34 ahead of tomorrow's next unlock tranche (~319 million shares) — both remain non-actionable, with SPCX unlock risk arguing for staying on the sidelines through the event. Holding the full book and waiting for the FOMC minutes and NVDA's August 26 earnings to provide the next real signal.",
        es:"A unas dos horas de iniciada la sesión del miércoles, NVDA se mantiene prácticamente plana en $219.74 (cierre anterior $220.03, rango del día $218.69–$221.64); el analista de BofA Vivek Arya señala que, según el valor empresarial sobre flujo de caja libre, la acción cotiza con un descuento del 40%-50% frente a sus pares de cómputo de IA, y Deutsche Bank elevó su precio objetivo en paralelo — comentarios de valoración alcistas antes del informe de resultados del 26 de agosto, aunque la acción en sí aún no reacciona a ellos. La posición se ubica en torno al 34.9% de la cartera, prácticamente en el límite de concentración del 35%, por lo que no hay margen para sumar incluso con comentarios de analistas favorables; lo más prudente es esperar a que se publique el informe del 26 de agosto antes de decidir el siguiente paso. SPY abrió en $768.70 (rango $766.92–$769.50), prácticamente plano frente al cierre de ayer de $768.64, después de que los futuros cedieran durante la noche por una fuerte caída en los mercados asiáticos y la renovada tensión en torno a Irán y el Estrecho de Ormuz. El verdadero catalizador de hoy son las minutas de la reunión de agosto del FOMC, que se publican a las 14:00 ET — después de esta revisión —, por lo que mantenerse a la espera de esos datos es la decisión correcta; la posición se mantiene cerca de su peso objetivo de ~25%. BTC se mantiene cerca de $64,450, todavía dentro del rango de $63,000–$65,000 sin un catalizador nuevo; la posición representa cerca del 19.9% de la cartera, justo por debajo del objetivo del 20%, por lo que no hay razón para recortar ni sumar. En cuanto a tasas, la Fed mantuvo sin cambios el rango de 3.50%-3.75% por quinta reunión consecutiva, y la probabilidad de una subida en septiembre ha caído a cerca del 30% desde alrededor del 50% hace una semana, aun cuando los rendimientos de largo plazo se mantienen cerca de máximos de varias décadas y el petróleo sigue elevado; la nómina no agrícola de julio cayó en 23,000 empleos, con un desempleo del 4.1%. En la lista de seguimiento, ABNB cotiza en $184.67, todavía muy por encima de la zona de retroceso de $150–160, y SPCX está en $143.34 antes del próximo tramo de desbloqueo de mañana (~319 millones de acciones); ninguna de las dos es accionable, y el riesgo del desbloqueo de SPCX refuerza la decisión de mantenerse al margen hasta que pase el evento. Se mantiene toda la cartera actual, a la espera de que las minutas del FOMC y el informe de resultados de NVDA del 26 de agosto ofrezcan la próxima señal real.",
        fr:"Environ deux heures après l'ouverture de la séance de mercredi, NVDA reste pratiquement stable à 219,74 $ (clôture précédente 220,03 $, fourchette du jour 218,69 $–221,64 $) ; l'analyste de BofA Vivek Arya souligne que, sur la base de la valeur d'entreprise rapportée au flux de trésorerie disponible, le titre se négocie avec une décote de 40 à 50 % par rapport à ses pairs du calcul IA, tandis que Deutsche Bank a relevé son objectif de cours en parallèle — des commentaires de valorisation haussiers avant la publication des résultats du 26 août, même si le titre lui-même n'y réagit pas encore. La position représente environ 34,9 % du portefeuille, pratiquement au plafond de concentration de 35 %, donc aucune marge pour renforcer même avec des commentaires d'analystes favorables ; il est plus prudent d'attendre la publication du 26 août avant de décider de la prochaine étape. Le SPY a ouvert à 768,70 $ (fourchette 766,92 $–769,50 $), pratiquement stable par rapport à la clôture d'hier à 768,64 $, après que les contrats à terme ont reculé pendant la nuit sous l'effet d'une forte baisse des marchés asiatiques et de tensions renouvelées autour de l'Iran et du détroit d'Ormuz. Le véritable catalyseur du jour est la publication des minutes de la réunion d'août du FOMC, prévue à 14h00 ET — soit après cette revue —, donc rester en attente de ces données est la bonne décision ; la position reste proche de son poids cible d'environ 25 %. Le BTC se maintient près de 64 450 $, toujours dans la fourchette de 63 000 $–65 000 $ sans nouveau catalyseur ; la position représente environ 19,9 % du portefeuille, juste sous l'objectif de 20 %, donc rien ne justifie de réduire ou de renforcer. Côté taux, la Fed a maintenu son taux inchangé à 3,50-3,75 % pour une cinquième réunion consécutive, et la probabilité d'une hausse en septembre est tombée à environ 30 %, contre près de 50 % il y a une semaine, alors même que les rendements longs restent proches de leurs plus hauts depuis plusieurs décennies et que le pétrole demeure élevé ; les créations d'emplois non agricoles de juillet ont reculé de 23 000, avec un taux de chômage à 4,1 %. Sur la liste de surveillance, ABNB se négocie à 184,67 $, toujours bien au-dessus de la zone de repli des 150–160 $, et SPCX est à 143,34 $ avant la prochaine tranche de déblocage de demain (~319 millions d'actions) ; aucune des deux n'est exploitable, et le risque lié au déblocage de SPCX renforce la décision de rester à l'écart jusqu'à la fin de l'événement. Conservation de l'ensemble du portefeuille actuel, en attendant que les minutes du FOMC et les résultats de NVDA du 26 août fournissent le prochain signal réel."
      }

        en:"With about an hour left before the 4:00 ET close, this pre-close check — which also settles today's official NAV — shows a quiet finish to a session shaped by the FOMC's August minutes. NVDA settled essentially flat at ~$219.10 (day range ~$218.69-$221.64), with this morning's bullish BofA/Deutsche Bank valuation calls (DB raised its price target to $220) still not moving the stock; the position holds at ~34.8% of the portfolio, effectively capped, so the disciplined move is to let the August 26 earnings print — not sell-side commentary — be the next catalyst. SPY eased slightly to ~$767.30 from this morning's $768.70 open after the 2:00pm ET release of the FOMC's July 28-29 minutes, which showed a 9-3 hold at 3.50-3.75% alongside an unusual three-way hawkish dissent (Hammack, Kashkari, and Logan pushing for a hike) — the first three-way dissent of its kind since 2016 — though the overall tone still read as dovish-leaning, with September-hold odds rising to near 65%; the broader tape firmed modestly (S&P 500 +0.3%, Nasdaq +0.25%, Dow +0.22%) on news of additional Treasury long-bond buybacks and a paused Canada tariff threat, keeping SPY right at its ~25% target weight. BTC firmed slightly to ~$64,650, still range-bound between $63,000 and $65,000, with the Fear & Greed Index improving to 40 ('Fear') and spot ETF flows turning net positive for a second straight day (+$297.5M Aug 17, +$189M Aug 18) after the prior week's outflows — a mildly encouraging signal but not strong enough on its own to size up a position already at its ~20% target. In retail earnings, TJX beat on EPS and revenue and raised full-year guidance but still slipped after-hours on soft Q3 guidance, while Target and Lowe's reported before the open. On the watchlist, ABNB remains near $184.67, well above its $150-160 pullback zone, and SPCX extended its slide to roughly $138-139 (-3% on the day) heading into tomorrow's ~319 million-share unlock tranche — both stay non-actionable. With NVDA         es:"A falta de una hora para el cierre de las 16:00 ET, esta revisión previa al cierre —que también sirve como liquidación oficial del NAV de hoy— muestra una sesión que cerró de forma tranquila tras la publicación de las minutas de agosto del FOMC. NVDA se mantuvo prácticamente plana, en torno a $219.10 (rango del día aproximadamente $218.69–$221.64), y los comentarios de valoración alcistas de esta mañana de BofA y Deutsche Bank (DB elevó su precio objetivo a $220) todavía no han movido la acción de forma clara; la posición se mantiene en torno al 34.8% de la cartera, prácticamente en su límite de concentración, por lo que lo más prudente es dejar que el informe de resultados del 26 de agosto —y no los comentarios de analistas— sea el próximo catalizador real. SPY retrocedió ligeramente a cerca de $767.30 desde los $768.70 de la apertura de esta mañana, después de que a las 14:00 ET se publicaran las minutas de la reunión del FOMC del 28-29 de julio, que mostraron una decisión de mantener las tasas en 3.50%-3.75% por 9 votos contra 3, con una inusual disidencia hawkish de tres miembros (Hammack, Kashkari y Logan, a favor de una subida) —la primera disidencia de tres miembros de este tipo desde 2016—, aunque el tono general de las minutas se interpretó como relativamente moderado, con la probabilidad de mantener las tasas en septiembre subiendo a cerca del 65%; el mercado en general se fortaleció de forma moderada (S&P 500 +0.3%, Nasdaq +0.25%, Dow +0.22%) tras conocerse que el Tesoro ampliará sus recompras de bonos a largo plazo y que Trump pausó la amenaza de aranceles a Canadá, lo que mantuvo a SPY justo en su peso objetivo de ~25%. BTC se fortaleció ligeramente hasta cerca de $64,650, todavía dentro del rango de $63,000–$65,000, con el Índice de Miedo y Codicia mejorando a 40 ('Miedo') y los flujos de los ETF al contado volviendo a ser netamente positivos por segundo día consecutivo (+$297.5M el 17 de agosto, +$189M el 18 de agosto), revirtiendo las sal         en:"About two hours into Thursday's session. Today's big move is in crypto: BTC surged roughly 11% on the day, breaking above $70,000 and touching about $71,900 — its highest since late May. Three catalysts fired together: Treasury Secretary Bessent's expansion of long-dated Treasury buybacks pulled long yields down; President Trump used a White House crypto event to press the Senate to advance the Clarity Act regulatory framework; and spot bitcoin ETFs took in about $500M of net inflows (a three-month high), while more than $1B of shorts were liquidated within an hour as BTC crossed $69,000, amplifying the move. The breakout genuinely lines up momentum with fundamentals (regulatory tailwind, returning institutional flows, falling rates), but an 11% single-day pop is textbook chase territory, and Forbes already carries an analyst warning of a '$44,000 bull-trap' pullback risk. After this run the position is worth roughly $221, about 21.8% of the book — just above its 20% target weight and freshly extended. Principle 03 (don't chase sentiment-driven moves) and Principle 05 (keep dry powder for pullbacks rather than chasing) both argue against adding here; at the same time the position sits at a healthy gain with its regulatory-tailwind thesis intact, so there's no reason to trim a confirmed breakout prematurely either. So BTC stays put. NVDA is essentially flat at ~$217.56 (prior close $217.56, day range $216.76–$222.87) with the August 26 earnings print just days away; the position is ~33.9% of the portfolio, effectively at the 35% concentration ceiling, so there's no room to add — let earnings be the next real catalyst. SPY eased to ~$766.29 (prior close $769.06), with the S&P 500 down ~0.33%, the Dow off 0.71% and the Nasdaq down 0.52% as long yields rebounded after the Treasury's larger buyback announcement and oil firmed on Trump's vow to squeeze Iran economically; the position is ~24.5% of the book, right at its ~25% target, with no pressing reason to a         es:"A unas dos horas de iniciada la sesión del jueves. El gran movimiento de hoy está en las criptomonedas: BTC se disparó cerca de un 11% en el día, superando los $70,000 y alcanzando alrededor de $71,900, su nivel más alto desde finales de mayo. Se activaron tres catalizadores a la vez: la ampliación por parte del secretario del Tesoro, Bessent, de las recompras de bonos del Tesoro a largo plazo empujó a la baja los rendimientos largos; el presidente Trump aprovechó un evento cripto en la Casa Blanca para presionar al Senado a avanzar el marco regulatorio de la Clarity Act; y los ETF de bitcoin al contado captaron cerca de $500M en entradas netas (un máximo de tres meses), mientras que más de $1,000M en posiciones cortas fueron liquidadas en una hora al cruzar BTC los $69,000, amplificando el movimiento. La ruptura realmente alinea el momentum con los fundamentales (viento de cola regulatorio, retorno de flujos institucionales, tasas a la baja), pero un alza del 11% en un solo día es territorio clásico de perseguir la subida, y Forbes ya recoge la advertencia de un analista sobre el riesgo de un retroceso tipo 'trampa alcista en $44,000'. Tras esta subida la posición vale cerca de $221, alrededor del 21.8% de la cartera — justo por encima de su peso objetivo del 20% y recién extendida. El Principio 03 (no perseguir movimientos impulsados por el sentimiento) y el Principio 05 (guardar liquidez para los retrocesos en lugar de perseguir) desaconsejan sumar aquí; al mismo tiempo, la posición acumula una ganancia sana con su tesis de viento de cola regulatorio intacta, por lo que tampoco hay razón para recortar prematuramente una ruptura confirmada. Así que BTC se mantiene sin cambios. NVDA está prácticamente plana en ~$217.56 (cierre anterior $217.56, rango del día $216.76–$222.87), con el informe de resultados del 26 de agosto a solo días de distancia; la posición representa ~33.9% de la cartera, prácticamente en el límite de concentración del 35%, por lo que         fr:"Environ deux heures après l'ouverture de la séance de jeudi. Le grand mouvement du jour vient des cryptomonnaies : le BTC a bondi d'environ 11 % sur la journée, franchissant les 70 000 $ et touchant près de 71 900 $ — son plus haut depuis fin mai. Trois catalyseurs se sont déclenchés ensemble : l'élargissement par le secrétaire au Trésor Bessent des rachats d'obligations du Trésor à long terme a fait baisser les rendements longs ; le président Trump a profité d'un événement crypto à la Maison-Blanche pour presser le Sénat de faire avancer le cadre réglementaire de la Clarity Act ; et les ETF bitcoin au comptant ont enregistré environ 500 M$ d'entrées nettes (un plus haut de trois mois), tandis que plus de 1 Md$ de positions vendeuses ont été liquidées en une heure au franchissement des 69 000 $ par le BTC, amplifiant le mouvement. La cassure aligne réellement le momentum et les fondamentaux (vent favorable réglementaire, retour des flux institutionnels, baisse des taux), mais une hausse de 11 % en une seule journée relève typiquement de la poursuite de cours, et Forbes relaie déjà l'avertissement d'un analyste sur le risque d'un repli en « piège haussier à 44 000 $ ». Après cette envolée, la position vaut environ 221 $, soit près de 21,8 % du portefeuille — juste au-dessus de son poids cible de 20 % et fraîchement étendue. Le Principe 03 (ne pas poursuivre les mouvements dictés par le sentiment) et le Principe 05 (conserver des liquidités pour les replis plutôt que de poursuivre) déconseillent tous deux de renforcer ici ; en même temps, la position affiche un gain sain avec sa thèse de vent favorable réglementaire intacte, il n'y a donc pas non plus de raison d'alléger prématurément une cassure confirmée. Le BTC reste donc inchangé. NVDA est quasiment stable à ~217,56 $ (clôture précédente 217,56 $, fourchette du jour 216,76 $–222,87 $), la publication des résultats du 26 août n'étant plus qu'à quelques jours ; la position représente ~33,9 % du portefeui         en:"Final look before Thursday's close, and the day's shape hasn't changed since the 11:30 check — it has only sharpened. BTC pushed further after this morning's breakout, trading around $72,000 and touching its highest level since June 1. CoinDesk puts short liquidations at roughly $3 billion over 24 hours, the largest since at least 2021, with more than $1 billion clearing in a single hour. BTC has now broken out of the $62,000–$66,900 range that held since July 8 and reclaimed both its 200-day moving average and its short-term-holder cost basis, with analysts already flagging a forming golden cross and pointing toward $76,000. That is a genuine confluence of momentum and fundamentals (Principle 03), but a squeeze that has run about 12% in two days is exactly the setup Principle 05 says to buy back on a pullback rather than chase at the highs; the position is worth roughly $222, about 21.9% of the book, already above its 20% target. Hold, don't add.\n\nEquities went the other way. Brent climbed 1.9% to $93.35 as Trump's threat of 'economic warfare' on Iran kept Persian Gulf shipping in doubt, pushing inflation worries and long yields back up and erasing much of Wednesday's Treasury-buyback relief. Walmart fell more than 9% — strong earnings undercut by slowing US sales as shoppers made 'trade-offs' against high gas prices — dragging consumer names with it. The S&P 500 ended down about 0.3%, the Dow about 0.8%, and the Nasdaq about 0.8%, a fourth loss in the five sessions since last week's record. NVDA finished essentially unchanged at ~$217.56 in that soft tape, still about 33.9% of the portfolio and effectively at the 35% ceiling, with the August 26 earnings print six days out — no room to add, and no reason to sell into it. SPY at ~$766.29 sits at ~24.5%, right on its ~25% target. The watchlist stays untouched: ABNB never came near the $150–160 zone, and SPCX absorbed today's ~319 million share unlock tranche with more due in September.\n\nNAV settles at         en:"About two hours into Saturday's session — though with equities markets closed for the weekend, this check concerns only the crypto book. BTC extended Friday's breakout, closing that day at $78,335 (+7.3% on the day) for its strongest week since 2024, and continues to firm this morning to around $78,300 as the rally broadens across the crypto complex — Ethereum is up over 8% to ~$2,515 and XRP has surged ~14.6% to ~$1.45, with CoinDesk and CNBC framing it as an institutional-led move rather than a single-token squeeze. US spot Bitcoin ETFs have pulled in over $1B across the past two trading days (four-day inflows near $1.6B), led by BlackRock's IBIT, alongside supportive macro tailwinds: a weaker dollar, the Treasury's expanded long-bond buyback program, and constructive regulatory signals (pressure on Congress to pass the Clarity Act, the SEC advancing its first crypto fundraising framework). The Crypto Fear & Greed Index remains parked in the low-to-mid 70s ('Greed'), essentially unchanged from yesterday's post-rally reading, which keeps this a chase-risk environment rather than a pullback worth buying. With BTC now worth about $207.50 (~20.1% of the book) — almost exactly where yesterday morning's trim was designed to land it — there's no case for either adding into a still-Greed tape or trimming further after already taking profit into Friday's spike. NVDA and SPY are frozen at Friday's closing prices ($216.85 / $766.30) with equities markets shut for the weekend; NVDA's August 26 earnings print remains the next real catalyst for that position, still capped at ~33% of the portfolio. Net effect: no trades today, holding the current mix into next week's data and Nvidia's earnings.",
        es:"Han pasado unas dos horas de la sesión del sábado —aunque los mercados de renta variable están cerrados por el fin de semana, esta revisión solo concierne a la cartera cripto. BTC extendió la ruptura del viernes, cerrando ese día en $78,335 (+7.3% en la jornada) para su semana más fuerte desde 2024, y continúa fortaleciéndose esta mañana hasta cerca de $78,300 mientras el repunte se amplía por todo el sector cripto —Ethereum sube más de un 8% hasta ~$2,515 y XRP se dispara ~14.6% hasta ~$1.45—, con CoinDesk y CNBC describiéndolo como un movimiento liderado por instituciones y no como un short squeeze de un solo token. Los ETF de bitcoin al contado en EE. UU. han captado más de $1,000 millones en los últimos dos días de negociación (flujos de cuatro días cercanos a $1,600 millones), liderados por el IBIT de BlackRock, junto con vientos de cola macro favorables: un dólar más débil, el programa ampliado de recompra de bonos a largo plazo del Tesoro, y señales regulatorias constructivas (presión sobre el Congreso para aprobar la Ley Clarity, la SEC avanzando en su primer marco de recaudación cripto). El Índice de Miedo y Codicia de las criptomonedas permanece en la zona baja de los 70 ('Codicia'), prácticamente sin cambios frente a la lectura de ayer tras el repunte, lo que mantiene este entorno como de riesgo de perseguir el precio en lugar de un retroceso que valga la pena comprar. La posición de BTC vale ahora cerca de $207.50 (~20.1% de la cartera) —casi exactamente donde apuntaba el recorte de ayer por la mañana—, por lo que no hay razón para sumar en un mercado todavía en 'Codicia' ni para recortar más después de haber tomado ganancias ya el viernes. NVDA y SPY permanecen congelados en los precios de cierre del viernes ($216.85 / $766.30) al estar cerrados los mercados de renta variable el fin de semana; el informe de resultados de NVDA del 26 de agosto sigue siendo el próximo catalizador real para esa posición, todavía en torno al 33% de la cartera, en su límite. En conjunto: sin operaciones hoy, se mantiene la combinación actual a la espera de los datos de la próxima semana y los resultados de Nvidia.",
        fr:"Environ deux heures après l'ouverture de la séance de samedi — bien que les marchés actions soient fermés pour le week-end, cette revue ne concerne que le portefeuille crypto. Le BTC a prolongé la cassure de vendredi, clôturant ce jour-là à 78 335 $ (+7,3 % sur la journée) pour sa meilleure semaine depuis 2024, et continue de se raffermir ce matin autour de 78 300 $ alors que le rallye s'étend à l'ensemble du secteur crypto — l'Ethereum grimpe de plus de 8 % à environ 2 515 $ et le XRP bondit d'environ 14,6 % à environ 1,45 $ —, CoinDesk et CNBC décrivant ce mouvement comme porté par les institutionnels plutôt que comme un short squeeze sur un seul jeton. Les ETF bitcoin au comptant américains ont attiré plus d'1 milliard de dollars sur les deux derniers jours de bourse (flux sur quatre jours proches de 1,6 milliard), menés par l'IBIT de BlackRock, avec des vents macro favorables : un dollar plus faible, le programme élargi de rachat d'obligations à long terme du Trésor, et des signaux réglementaires constructifs (pression sur le Congrès pour adopter le Clarity Act, la SEC faisant avancer son premier cadre de levée de fonds crypto). L'indice Peur et Cupidité des cryptomonnaies reste dans le bas des 70 (« Cupidité »), pratiquement inchangé par rapport à la lecture d'hier après le rallye, ce qui maintient cet environnement à risque de poursuite de cours plutôt qu'à un repli à acheter. La position en BTC vaut désormais environ 207,50 $ (~20,1 % du portefeuille) — presque exactement là où visait la réduction d'hier matin —, donc aucune raison de renforcer sur un marché encore en « Cupidité », ni de réduire davantage après avoir déjà pris des bénéfices vendredi. NVDA et SPY restent gelés aux cours de clôture de vendredi (216,85 $ / 766,30 $), les marchés actions étant fermés pour le week-end ; la publication des résultats de NVDA le 26 août reste le prochain vrai catalyseur pour cette position, toujours à environ 33 % du portefeuille, à son plafond. Au total       reason: {
        zh:"距离今早的检查约三个半小时，周六美股仍然休市，本次收盘前复核（同时也是当日官方净值结算）聚焦于加密货币市场午间发生的一次真实闪崩。一波高杠杆多头集中平仓在约六分钟内抹去了整个加密市场约1,080亿美元的市值，24小时内清算总额接近17亿美元，涉及约28.2万名交易者；BTC盘中一度下探至约76,500美元，跌幅约2.5%，相对温和，而杠杆更高的币种则首当其冲——XRP一度暴跌37%，Solana下跌约11.5%，以太坊下跌约5%。在此次事件发生前，4小时图RSI已升至七年多以来的最高水平，因此从技术面看，过度拥挤的多头仓位出现剧烈出清并不意外，尽管基本面并未发生变化。市场随后已部分修复，截至本次复核BTC已回升至约77,500美元；现货比特币ETF周五单日仍净流入约3.07亿美元——连续第五个交易日净流入——表明尽管杠杆仓位被大幅出清，底层买盘并未消失。这正是原则五所说值得买入的「过度反应」类型，但该仓位在周五减仓后已几乎正好落在20%目标附近（约205美元，约占组合19.9%），且此次下跌本身在数小时内已回补大半，RSI仍处于极端水平——并非该策略所要买入的、已企稳的干净回踩。因此维持仓位不变，而非在仍剧烈波动的去杠杆事件中交易。NVDA与SPY仍冻结在周五收盘价（216.85美元 / 766.30美元），因美股周末休市；距英伟达8月26日财报还有五天，仍是该仓位下一个真正的催化剂，目前仍占组合约33.3%，实质上处于上限。综合来看：今日无交易。净值结算于1,030.81美元，较昨日1,030.28美元的收盘小幅上升，但低于今早的1,032.93美元，今日BTC因闪崩回吐了此前的大部分涨幅。",
        en:"About three and a half hours after this morning's check, and still with equities closed for the Saturday weekend, this pre-close review — which also settles today's official NAV — centers on a genuine flash crash that hit the crypto market around midday. A wave of over-leveraged long liquidations wiped out roughly $108 billion in total crypto market cap in about six minutes, with liquidations totaling near $1.7 billion across roughly 282,000 traders; BTC itself fell to about $76,500 intraday, a comparatively mild ~2.5% drawdown, while more leveraged names took the brunt — XRP plunged as much as 37%, Solana dropped ~11.5%, Ethereum fell ~5%. Going into the event the 4-hour RSI had been sitting at its highest level in more than seven years, so a violent unwind of stretched longs was arguably overdue technically even with fundamentals unchanged. The market has since partly recovered, with BTC back to around $77,500 as of this check, and spot Bitcoin ETFs still absorbed roughly $307 million in net inflows on Friday alone — a fifth straight day of inflows — suggesting the underlying bid hasn't disappeared even as leveraged positioning got flushed. That is the kind of overreaction Principle 05 says can be worth buying, but the position is already sitting almost exactly at its 20% target (~$205, ~19.9% of the book) after Friday's trim, the drop itself round-tripped much of the way back within hours, and RSI still reads extreme — not the clean, settled pullback this strategy looks to add into. Holding the position unchanged rather than trading into a still-volatile deleveraging event. NVDA and SPY remain frozen at Friday's close ($216.85 / $766.30) with equities shut for the weekend; NVDA's August 26 earnings print, five days out, stays the next real catalyst for that position, still at ~33.3% of the portfolio and effectively capped. Net effect: no trades today. NAV settles at $1,030.81, up marginally from yesterday's $1,030.28 close and down from this morning's $1,032.93 as today's flash-crash pullback in BTC gave back most of the past day's gains.",
        es:"Unas tres horas y media después del control de esta mañana, y con los mercados de renta variable todavía cerrados por el fin de semana del sábado, esta revisión previa al cierre —que también liquida el NAV oficial de hoy— se centra en un auténtico flash crash que sacudió el mercado cripto hacia el mediodía. Una ola de liquidaciones de posiciones largas sobreapalancadas borró cerca de $108,000 millones de la capitalización total del mercado cripto en unos seis minutos, con liquidaciones totales cercanas a $1,700 millones entre aproximadamente 282,000 operadores; el propio BTC cayó hasta cerca de $76,500 intradía, una caída comparativamente moderada de ~2.5%, mientras que los activos más apalancados se llevaron la peor parte: XRP se desplomó hasta un 37%, Solana cayó ~11.5% y Ethereum bajó ~5%. Antes del evento, el RSI en el gráfico de 4 horas se situaba en su nivel más alto en más de siete años, por lo que una liquidación violenta de posiciones largas sobreextendidas resultaba, técnicamente, casi previsible, incluso sin cambios en los fundamentales. El mercado se ha recuperado parcialmente desde entonces, con el BTC de vuelta a cerca de $77,500 en el momento de este control, y los ETF de bitcoin al contado siguieron absorbiendo cerca de $307 millones en entradas netas solo el viernes —el quinto día consecutivo de entradas—, lo que sugiere que la demanda subyacente no ha desaparecido pese a la purga de posiciones apalancadas. Este es el tipo de sobrerreacción que el Principio 05 señala como digna de comprarse, pero la posición ya se encuentra casi exactamente en su objetivo del 20% (~$205, ~19.9% de la cartera) tras el recorte del viernes, la propia caída ya recuperó gran parte del terreno en cuestión de horas, y el RSI sigue en niveles extremos: no es el retroceso limpio y asentado que esta estrategia busca para sumar. Se mantiene la posición sin cambios en lugar de operar dentro de un evento de desapalancamiento todavía volátil. NVDA y SPY permanecen congelados en el cierre del viernes ($216.85 / $766.30) con los mercados de renta variable cerrados por el fin de semana; los resultados de NVIDIA del 26 de agosto, a cinco días vista, siguen siendo el próximo catalizador real para esa posición, todavía en torno al 33.3% de la cartera y prácticamente en su límite. En conjunto: sin operaciones hoy. El NAV se liquida en $1,030.81, ligeramente por encima del cierre de ayer de $1,030.28 pero por debajo de los $1,032.93 de esta mañana, ya que el retroceso de BTC por el flash crash de hoy borró la mayor parte de las ganancias del último día.",
        fr:"Environ trois heures et demie après le contrôle de ce matin, et avec les marchés actions toujours fermés pour le week-end du samedi, cette revue avant clôture — qui règle également la VNI officielle du jour — porte sur un véritable flash crash survenu sur le marché crypto en milieu de journée. Une vague de liquidations de positions longues surendettées a effacé environ 108 milliards de dollars de la capitalisation totale du marché crypto en environ six minutes, avec des liquidations totales proches de 1,7 milliard de dollars touchant environ 282 000 traders ; le BTC lui-même est tombé à environ 76 500 $ en intrajournalier, un repli relativement modéré d'environ 2,5 %, tandis que les actifs les plus surendettés ont pris le plus gros du choc — le XRP a chuté jusqu'à 37 %, le Solana a reculé d'environ 11,5 % et l'Ethereum a baissé d'environ 5 %. Avant cet événement, le RSI en 4 heures se situait à son niveau le plus élevé depuis plus de sept ans, si bien qu'un dénouement brutal des positions longues étirées était, sur le plan technique, presque attendu, même sans changement des fondamentaux. Le marché s'est depuis partiellement redressé, le BTC revenant autour de 77 500 $ au moment de ce contrôle, et les ETF bitcoin au comptant ont continué d'absorber environ 307 millions de dollars d'entrées nettes rien que vendredi — un cinquième jour consécutif d'entrées —, ce qui suggère que la demande sous-jacente n'a pas disparu malgré la purge des positions à effet de levier. C'est exactement le type de surréaction que le Principe 05 juge digne d'être acheté, mais la position se trouve déjà presque exactement à son objectif de 20 % (~205 $, ~19,9 % du portefeuille) après la réduction de vendredi, la chute elle-même a déjà comblé une grande partie du terrain perdu en quelques heures, et le RSI reste à des niveaux extrêmes — ce n'est pas le repli propre et stabilisé que cette stratégie cherche à renforcer. La position est donc maintenue inchangée plutôt que d'être négociée au sein d'un événement de désendettement encore volatil. NVDA et SPY restent gelés au cours de clôture de vendredi (216,85 $ / 766,30 $), les marchés actions étant fermés pour le week-end ; la publication des résultats de Nvidia le 26 août, dans cinq jours, reste le prochain vrai catalyseur pour cette position, toujours à environ 33,3 % du portefeuille et pratiquement à son plafond. Au total : aucune opération aujourd'hui. La VNI est arrêtée à 1 030,81 $, en légère hausse par rapport à la clôture d'hier à 1 030,28 $ mais en baisse par rapport aux 1 032,93 $ de ce matin, le repli du BTC lié au flash crash d'aujourd'hui ayant effacé l'essentiel des gains de la dernière journée."

let currentLang = 'en';
function L(field){
  if (field && typeof field === 'object' && ('zh' in field || 'en' in field || 'es' in field || 'fr' in field)) {
    return field[currentLang] ?? field.en ?? field.zh ?? '';
  }
  return field;
}

const fmtUSD = (n, d=2) => '$' + n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtPct = (n) => (n>=0?'+':'') + n.toFixed(2) + '%';
const fmtQty = (n, d) => n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});

function getNextCheckInfo(){
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hour: 'numeric', minute: 'numeric', hour12: false
  }).formatToParts(new Date());
  let h = parseInt(parts.find(p=>p.type==='hour').value, 10);
  const m = parseInt(parts.find(p=>p.type==='minute').value, 10);
  if (h === 24) h = 0;
  const nowMin = h*60 + m;
  const morningMin = 11*60 + 30, closeMin = 15*60;
  if (nowMin < morningMin) return { time:'11:30', today:true };
  if (nowMin < closeMin) return { time:'15:00', today:true };
  return { time:'11:30', today:false };
}

const ASSET_COLORS = {NVDA:'#ffb400', SPY:'#5eead4', BTC:'#f0a35c', CASH:'#3a4b4e'};
function colorFor(sym){ return ASSET_COLORS[sym] || '#7c8e90'; }
function qtyDecimalsFor(sym){
  const h = ALPHA_DATA.holdings.find(x=>x.symbol===sym);
  return h ? h.qtyDecimals : 4;
}

function computeHoldings(){
  return ALPHA_DATA.holdings.map(h=>{
    const marketValue = h.shares * h.currentPrice;
    const costValue = h.shares * h.avgCost;
    const pnl = marketValue - costValue;
    const pnlPct = costValue !== 0 ? (pnl/costValue*100) : 0;
    return {...h, marketValue, costValue, pnl, pnlPct};
  });
}

function computeTotals(){
  const holdings = computeHoldings();
  const holdingsValue = holdings.reduce((s,h)=>s+h.marketValue,0);
  const totalValue = holdingsValue + ALPHA_DATA.cash;
  const totalPnl = totalValue - ALPHA_DATA.meta.initialCapital;
  const totalPnlPct = totalPnl / ALPHA_DATA.meta.initialCapital * 100;
  return {holdings, holdingsValue, totalValue, totalPnl, totalPnlPct};
}

function computeDailyChange(totalValue){
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit'
  }).format(new Date());
  const priorSnaps = ALPHA_DATA.snapshots.filter(s => s.date < parts);
  if (priorSnaps.length === 0) return null;
  const baseline = priorSnaps[priorSnaps.length - 1].totalValue;
  if (!baseline) return null;
  const change = totalValue - baseline;
  return { change, changePct: change / baseline * 100 };
}

function renderStats(totals){
  const t = I18N[currentLang];
  const {totalValue, holdingsValue, totalPnl, totalPnlPct} = totals;
  const cls = totalPnl>0?'up':(totalPnl<0?'down':'flat');
  const daily = computeDailyChange(totalValue);
  const dailyCls = !daily ? 'flat' : (daily.change>0?'up':(daily.change<0?'down':'flat'));
  const dailyStat = !daily
    ? {label:t.statDailyChange, value:'—', sub:t.dailyChangeNA}
    : {label:t.statDailyChange, value:`<span class="${dailyCls}">${fmtPct(daily.changePct)}</span>`, sub:`<span class="${dailyCls}">${daily.change>=0?'+':''}${fmtUSD(daily.change)}</span> ${t.dailyChangeSub}`};
  const stats = [
    {label:t.statTotalValue, value:fmtUSD(totalValue), sub:t.statTotalValueSub},
    {label:t.statTotalReturn, value:`<span class="${cls}">${fmtPct(totalPnlPct)}</span>`, sub:`<span class="${cls}">${totalPnl>=0?'+':''}${fmtUSD(totalPnl)}</span>`},
    dailyStat,
    {label:t.statCash, value:fmtUSD(ALPHA_DATA.cash), sub:t.pctOfPortfolio((ALPHA_DATA.cash/totalValue*100).toFixed(1))},
    {label:t.statInvested, value:fmtUSD(holdingsValue), sub:t.pctOfPortfolio((holdingsValue/totalValue*100).toFixed(1))},
    {label:t.statDays, value:t.dayN(ALPHA_DATA.meta.dayCount), sub:t.tradesTotal(ALPHA_DATA.trades.length, countTrades())}
  ];
  document.getElementById('statsGrid').innerHTML = stats.map(s=>`
    <div class="stat-card">
      <div class="label">${s.label}</div>
      <div class="value">${s.value}</div>
      <div class="sub">${s.sub}</div>
    </div>
  `).join('');
}
