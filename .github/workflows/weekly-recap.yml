name: Publish weekly recap

# DORMANT — manual dispatch only.
#
# A separate Claude Routine already publishes the weekly recap (as
# blog/recap-<date>.html, on a Sunday-to-Sunday week). On 2026-08-23 both ran
# and the blog carried two cards for the same week with different numbers,
# because the two use different week conventions. The schedule was removed
# here rather than there, since that one was already established and working.
#
# The generator itself still works and is still the deterministic option; see
# CLAUDE.md for what is unresolved before either is made the single mechanism.
# It used to run on: schedule: - cron: '0 1 * * 1'  (Sunday 21:00 ET)
on:
  workflow_dispatch:
    inputs:
      week_end:
        description: 'Week-ending date (YYYY-MM-DD). Any date works — it snaps back to the most recent Sunday on or before it. Defaults to the most recent Sunday.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-recap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate the recap
        id: recap
        # week_end goes through the environment rather than being interpolated
        # into the script. Only someone with write access can dispatch this, so
        # it is not an escalation either way, but a `${{ }}` expansion inside a
        # run block is pasted in as text before the shell ever sees it — one
        # stray quote in the input and the rest is a command.
        env:
          WEEK_END: ${{ inputs.week_end }}
        run: |
          if [ -n "$WEEK_END" ]; then
            node scripts/generate-recap.js --end "$WEEK_END"
          else
            node scripts/generate-recap.js
          fi

      - name: Commit and push
        if: steps.recap.outputs.published == 'true'
        env:
          WEEK_END: ${{ steps.recap.outputs.week_end }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed — recap already up to date."
            exit 0
          fi

          git config user.name "1kAlpha bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/recaps blog/index.html sitemap.xml
          git commit -m "Publish weekly recap for the week ending $WEEK_END"
          git push origin master
